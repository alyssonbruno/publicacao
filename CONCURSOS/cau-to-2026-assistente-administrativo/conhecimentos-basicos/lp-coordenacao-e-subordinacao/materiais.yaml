materiais:
  - tipo: texto
    titulo: "Orações e períodos: coordenação e subordinação"
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: COMPLEMENTO NOMINAL X ADJUNTO ADNOMINAL
    url: https://www.youtube.com/watch?v=vQI5jHEwCCI
    autor: Prof. Álvaro Ferreira
    duracao_min: 10
    descricao: >-
      Aula curta, de professor de concursos, sobre a diferença entre os dois termos: é o ponto
      dos itens de sintaxe da prova de 2023 do cargo. Indicada pelo título, pela descrição e
      pela duração; ainda não foi assistida por nós. Compare com os três passos do texto da
      aula e, se algo divergir, fique com o texto.
  - tipo: video
    titulo: "Tudo sobre ORAÇÕES SUBORDINADAS (Substantiva, Adjetiva e Adverbial) #português #concurso"
    url: https://www.youtube.com/watch?v=1C88RhbZjgg
    autor: Professor Noslen
    duracao_min: 15
    descricao: >-
      Visão geral das três famílias de orações subordinadas, com capítulos de conectivos e
      funções, classificação na prática e questões de concurso, segundo a descrição do vídeo.
      Ainda não foi assistida por nós. Em 15 minutos não deve detalhar as seis substantivas
      nem as nove adverbiais: para isso, use as tabelas do texto da aula.
  - tipo: video
    titulo: "ORAÇÕES COORDENADAS SINDÉTICAS e ASSINDÉTICAS | Aprenda tudo! | Português do Zero"
    url: https://www.youtube.com/watch?v=3oO_ejhW7yM
    autor: Português com Letícia
    duracao_min: 16
    descricao: >-
      Segundo a descrição, ensina a diferenciar as coordenadas sindéticas das assindéticas e
      percorre as cinco sindéticas (aditivas, adversativas, alternativas, explicativas e
      conclusivas), com marcação de tempo por parte. Ainda não foi assistida por nós.
  - tipo: video
    titulo: Coordenada explicativa X Subordinada adverbial causal [Prof. Noslen]
    url: https://www.youtube.com/watch?v=Kwmj54TkbiM
    autor: Professor Noslen
    duracao_min: 9
    descricao: >-
      Capítulos, segundo a descrição: o que é a causal, o que é a explicativa, diferenças entre
      as duas, relação de causa e consequência, relação de explicação e hipótese. Ainda não foi
      assistida por nós: não sabemos se os testes do professor são os mesmos do texto da aula
      (ordem ou suposição antes da vírgula; troca por "por" + infinitivo). Opcional: é um ponto
      em que as gramáticas divergem.
  - tipo: video
    titulo: Orações Reduzidas - Pablo Jamilk
    url: https://www.youtube.com/watch?v=mk5Nvyr8hUw
    autor: Pablo Jamilk
    duracao_min: 9
    descricao: >-
      Aula curta, de professor de concursos, sobre orações reduzidas. A descrição do vídeo não
      detalha o conteúdo, e a aula ainda não foi assistida por nós: confira os exemplos com a
      tabela de reduzidas do texto.
  - tipo: podcast
    titulo: Complemento Nominal (termo integrante)
    url: https://podcasts.apple.com/br/podcast/complemento-nominal-termo-integrante/id1554980104?i=1000512545839
    audio: https://anchor.fm/s/4d8ab5a4/podcast/play/28660428/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2021-08-11%2F700b84f68bb6bdc12f1ba630d0b27f0f.m4a
    autor: Livro Aberto Podcasts Educacionais (prof. Marcos Barbara)
    duracao_min: 14
    descricao: >-
      Aula gravada para áudio, que se entende sem tela: complemento nominal × adjunto
      adnominal pelo mesmo caminho do texto da aula (adjetivo ou advérbio, substantivo
      concreto, abstrato com valor ativo ou passivo). Conferido por transcrição automática,
      sem erro de classificação nos exemplos. Atenção: por volta dos 8 minutos, a regra sai
      simplificada ("substantivo abstrato, complemento nominal"); só o quadro final corrige
      e admite adjunto adnominal com substantivo abstrato. O exercício final (dez frases) não
      traz as respostas: confira com os três passos do texto.
  - tipo: podcast
    titulo: COMPLEMENTO NOMINAL ou OBJETO INDIRETO? Entenda as diferenças!
    url: https://podcasts.apple.com/br/podcast/complemento-nominal-ou-objeto-indireto-entenda-as-diferen%C3%A7as/id1534371896?i=1000554848843
    audio: https://anchor.fm/s/3950d1cc/podcast/play/48157788/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2022-1-24%2F9245e725-9879-6116-5b56-1c6f6dd04537.mp3
    autor: Português com Letícia (prof. Letícia Góes)
    duracao_min: 16
    descricao: >-
      O outro lado do complemento nominal: a diferença para o objeto indireto, os dois com
      preposição, pela classe da palavra completada (nome ou verbo), com frases lidas em voz
      alta ("crença em milagres" × "crê em milagres"). Conferido por transcrição automática,
      sem erro encontrado. É o áudio de uma videoaula: a "tabelinha" citada no começo não
      aparece, mas as frases e as classificações são todas faladas. Não trata do adjunto
      adnominal; para isso, ouça o episódio anterior.
