  - id: q09
    topico: conhecimentos-basicos/lp-coordenacao-e-subordinacao
    enunciado: |-
      Considere o aviso a seguir, enviado pela secretaria de um conselho profissional fictício, com as linhas numeradas.

      > 1. Senhores conselheiros, a sessão que estava marcada para
      > 2. quinta-feira foi adiada pela presidência. A secretaria
      > 3. ainda não sabe se haverá quórum na nova data.
      > 4. Encerrado o prazo de confirmação, enviaremos a pauta
      > 5. para que todos possam preparar os votos. Há dois
      > 6. processos urgentes na lista.

      Com base no texto e na estrutura sintática de seus períodos, julgue o item.

      Na linha 1, o termo “Senhores conselheiros” exerce a função de sujeito da forma verbal “foi adiada” (linha 2).
