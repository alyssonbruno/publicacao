materiais:
  - tipo: texto
    titulo: Classes de palavras e colocação pronominal
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: "MORFOLOGIA: CLASSES DE PALAVRAS (Para Concurso)"
    url: https://www.youtube.com/watch?v=ltrzPijgKi4
    autor: Prof. Álvaro Ferreira
    duracao_min: 63
    descricao: >-
      Passa por todas as classes (substantivo em 1:30, adjetivo em 8:30, artigos em 14:18,
      pronomes em 19:40, advérbio e verbo em 27:39, preposição em 36:14, conjunção em 40:28,
      numeral em 47:05) e resolve questões de concurso de 50:10 até o fim. Se o tempo for
      curto, veja advérbio, preposição e conjunção e as questões. Há divulgação de curso pago
      por volta de 26:41.
  - tipo: video
    titulo: COLOCAÇÃO PRONOMINAL (Para Concurso)
    url: https://www.youtube.com/watch?v=6zsVwix7Uh0
    autor: Prof. Álvaro Ferreira
    duracao_min: 19
    descricao: >-
      Capítulos: próclise em 1:12, ênclise em 2:22, mesóclise em 3:14, regras importantes em
      4:38 e duas questões, em 12:12 e 15:50. Os capítulos não citam as locuções verbais:
      para esse ponto, use o texto da aula.
  - tipo: video
    titulo: "Dica #46 - Colocação Pronominal em LOCUÇÕES"
    url: https://www.youtube.com/watch?v=SuB237duFxU
    autor: Professor José Maria (canal no YouTube)
    duracao_min: 14
    descricao: >-
      Vídeo de março de 2021, sem capítulos, para a parte "Colocação nas locuções verbais" do
      texto, que o vídeo anterior não cobre. A descrição do vídeo diz só que a dica ajuda a
      resolver questões de colocação pronominal. Ninguém da equipe assistiu: o que se sabe vem
      do título e da descrição. Não se sabe como ele trata o pronome solto entre os dois verbos
      ("Vou lhe enviar", próclise ao verbo principal), que o texto da aula apresenta como ponto
      controverso. Se algo divergir do texto da aula, vale o texto.
  - tipo: podcast
    titulo: "Língua Portuguesa: CLASSES DE PALAVRAS (MORFOLOGIA) - Prof. Riverton Sousa."
    url: https://podcasts.apple.com/br/podcast/l%C3%ADngua-portuguesa-classes-de-palavras-morfologia/id1584593874?i=1000681574870
    autor: Tribo Concursos, com o professor Riverton Sousa (podcast)
    duracao_min: 29
    descricao: >-
      Episódio de dezembro de 2024, para a primeira metade da aula (das dez classes até
      preposições e conjunções). A descrição da página diz só que o professor explica as
      classes de palavras (morfologia) para concursos públicos: não lista as classes nem cita a
      Quadrix. Ninguém da equipe ouviu o episódio: a informação vem da descrição da página. Se
      algo divergir do texto da aula, vale o texto. Não há podcast indicado para colocação
      pronominal: nessa parte, fique com o texto e os dois vídeos.
