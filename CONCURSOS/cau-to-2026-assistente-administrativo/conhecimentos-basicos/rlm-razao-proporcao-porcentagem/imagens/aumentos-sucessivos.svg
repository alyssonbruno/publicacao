<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <text x="16" y="28" font-size="15" font-weight="700" fill="#0b0b0b">Aumento de 10% seguido de desconto de 10%</text>

  <!-- Caixas dos valores -->
  <g font-weight="700" text-anchor="middle">
    <rect x="24" y="80" width="150" height="64" rx="10" fill="#e3edf9" stroke="#256abf" stroke-width="2"/>
    <text x="99" y="106" font-size="12.5" fill="#1c5cab" font-weight="600">valor inicial</text>
    <text x="99" y="130" font-size="19" fill="#0b0b0b">R$ 400,00</text>

    <rect x="285" y="80" width="150" height="64" rx="10" fill="#e3edf9" stroke="#256abf" stroke-width="2"/>
    <text x="360" y="106" font-size="12.5" fill="#1c5cab" font-weight="600">depois do aumento</text>
    <text x="360" y="130" font-size="19" fill="#0b0b0b">R$ 440,00</text>

    <rect x="546" y="80" width="150" height="64" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="2"/>
    <text x="621" y="106" font-size="12.5" fill="#b84a1c" font-weight="600">valor final</text>
    <text x="621" y="130" font-size="19" fill="#0b0b0b">R$ 396,00</text>
  </g>

  <!-- Setas e fatores -->
  <g stroke="#52514e" stroke-width="2" marker-end="url(#seta)">
    <line x1="180" y1="112" x2="278" y2="112"/>
    <line x1="441" y1="112" x2="539" y2="112"/>
  </g>
  <g text-anchor="middle">
    <text x="229" y="100" font-size="16" font-weight="700" fill="#127a55">× 1,10</text>
    <text x="229" y="134" font-size="12" fill="#52514e">+10% de 400</text>
    <text x="229" y="150" font-size="12" fill="#52514e">= + R$ 40,00</text>
    <text x="490" y="100" font-size="16" font-weight="700" fill="#b84a1c">× 0,90</text>
    <text x="490" y="134" font-size="12" fill="#52514e">−10% de 440</text>
    <text x="490" y="150" font-size="12" fill="#52514e">= − R$ 44,00</text>
  </g>

  <!-- Fator único -->
  <rect x="24" y="184" width="672" height="58" rx="10" fill="#f9f9f7" stroke="#8a8880" stroke-width="1.2"/>
  <text x="360" y="208" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">Fator único: 1,10 × 0,90 = 0,99</text>
  <text x="360" y="230" font-size="13" fill="#52514e" text-anchor="middle">O valor final é 99% do inicial: uma queda de 1% (400 × 0,99 = 396).</text>

  <!-- O erro esperado -->
  <text x="24" y="276" font-size="13" font-weight="700" fill="#b84a1c">Errado:</text>
  <text x="84" y="276" font-size="13" fill="#52514e">"+10% − 10% = 0%, o valor volta a R$ 400,00".</text>
  <text x="24" y="300" font-size="13" font-weight="700" fill="#127a55">Certo:</text>
  <text x="84" y="300" font-size="13" fill="#52514e">o desconto incide sobre R$ 440,00, por isso tira mais (R$ 44,00) do que o aumento pôs (R$ 40,00).</text>
</svg>
