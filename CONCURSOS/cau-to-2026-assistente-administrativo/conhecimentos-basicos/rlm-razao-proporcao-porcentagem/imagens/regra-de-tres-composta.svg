<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="16" y="28" font-size="15" font-weight="700" fill="#0b0b0b">Regra de três composta: cada grandeza comparada com os dias</text>

  <!-- Tabela: 4 colunas de 168 px, de x=24 a x=696 -->
  <g font-size="14">
    <rect x="24" y="48" width="672" height="52" fill="#e3edf9"/>
    <g text-anchor="middle" font-weight="700" fill="#0b0b0b">
      <text x="108" y="70">Dias <tspan fill="#127a55">↑</tspan></text>
      <text x="276" y="70">Servidores <tspan fill="#b84a1c">↓</tspan></text>
      <text x="444" y="70">Horas por dia <tspan fill="#b84a1c">↓</tspan></text>
      <text x="612" y="70">Processos <tspan fill="#127a55">↑</tspan></text>
    </g>
    <g text-anchor="middle" font-size="12" fill="#52514e">
      <text x="108" y="90">(a incógnita)</text>
      <text x="276" y="90">mais servidores, menos dias</text>
      <text x="444" y="90">mais horas, menos dias</text>
      <text x="612" y="90">mais processos, mais dias</text>
    </g>
    <line x1="24" y1="136" x2="696" y2="136" stroke="#d6d4ce"/>
    <g stroke="#d6d4ce"><line x1="192" y1="48" x2="192" y2="172"/><line x1="360" y1="48" x2="360" y2="172"/><line x1="528" y1="48" x2="528" y2="172"/></g>
    <g text-anchor="middle" fill="#0b0b0b">
      <text x="108" y="123">5</text><text x="276" y="123">4</text><text x="444" y="123">6</text><text x="612" y="123">240</text>
      <text x="108" y="159" font-weight="700" fill="#1c5cab">x</text><text x="276" y="159">6</text><text x="444" y="159">5</text><text x="612" y="159">720</text>
    </g>
    <rect x="24" y="48" width="672" height="124" fill="none" stroke="#8a8880"/>
  </g>

  <!-- Frações -->
  <g font-size="13" fill="#52514e" text-anchor="middle">
    <text x="108" y="200">fica 5/x</text>
    <text x="276" y="200">4/6 invertida: 6/4</text>
    <text x="444" y="200">6/5 invertida: 5/6</text>
    <text x="612" y="200">fica 240/720</text>
  </g>

  <rect x="24" y="222" width="672" height="112" rx="10" fill="#f9f9f7" stroke="#8a8880" stroke-width="1.2"/>
  <text x="360" y="254" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">5/x = 6/4 × 5/6 × 240/720</text>
  <text x="360" y="282" font-size="15" fill="#0b0b0b" text-anchor="middle">5/x = 5/4 × 1/3 = 5/12</text>
  <text x="360" y="314" font-size="17" font-weight="700" fill="#127a55" text-anchor="middle">x = 12 dias</text>
</svg>
