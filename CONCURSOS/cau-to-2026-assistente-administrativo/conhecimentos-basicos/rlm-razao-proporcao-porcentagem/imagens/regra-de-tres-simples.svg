<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>

  <!-- Painel 1: direta -->
  <text x="24" y="30" font-size="15" font-weight="700" fill="#127a55">Diretamente proporcionais</text>
  <text x="24" y="50" font-size="12.5" fill="#52514e">mais servidores, mais processos</text>
  <g font-size="14">
    <rect x="24" y="66" width="312" height="36" fill="#e3edf9"/>
    <text x="102" y="89" text-anchor="middle" font-weight="700" fill="#0b0b0b">Servidores <tspan fill="#127a55">↑</tspan></text>
    <text x="258" y="89" text-anchor="middle" font-weight="700" fill="#0b0b0b">Processos <tspan fill="#127a55">↑</tspan></text>
    <line x1="24" y1="138" x2="336" y2="138" stroke="#d6d4ce"/>
    <line x1="180" y1="66" x2="180" y2="174" stroke="#d6d4ce"/>
    <text x="102" y="125" text-anchor="middle" fill="#0b0b0b">4</text>
    <text x="258" y="125" text-anchor="middle" fill="#0b0b0b">600</text>
    <text x="102" y="161" text-anchor="middle" fill="#0b0b0b">6</text>
    <text x="258" y="161" text-anchor="middle" font-weight="700" fill="#1c5cab">x</text>
    <rect x="24" y="66" width="312" height="108" fill="none" stroke="#8a8880"/>
  </g>
  <text x="24" y="206" font-size="13" fill="#52514e">Seta para cima: a fração fica como está.</text>
  <text x="24" y="236" font-size="16" font-weight="700" fill="#0b0b0b">600/x = 4/6</text>
  <text x="24" y="262" font-size="14" fill="#0b0b0b">x = 600 × 6 ÷ 4</text>
  <text x="24" y="290" font-size="16" font-weight="700" fill="#127a55">x = 900 processos</text>

  <!-- Painel 2: inversa -->
  <text x="384" y="30" font-size="15" font-weight="700" fill="#b84a1c">Inversamente proporcionais</text>
  <text x="384" y="50" font-size="12.5" fill="#52514e">menos servidores, mais dias</text>
  <g font-size="14">
    <rect x="384" y="66" width="312" height="36" fill="#e3edf9"/>
    <text x="462" y="89" text-anchor="middle" font-weight="700" fill="#0b0b0b">Servidores <tspan fill="#b84a1c">↓</tspan></text>
    <text x="618" y="89" text-anchor="middle" font-weight="700" fill="#0b0b0b">Dias <tspan fill="#127a55">↑</tspan></text>
    <line x1="384" y1="138" x2="696" y2="138" stroke="#d6d4ce"/>
    <line x1="540" y1="66" x2="540" y2="174" stroke="#d6d4ce"/>
    <text x="462" y="125" text-anchor="middle" fill="#0b0b0b">6</text>
    <text x="618" y="125" text-anchor="middle" fill="#0b0b0b">10</text>
    <text x="462" y="161" text-anchor="middle" fill="#0b0b0b">4</text>
    <text x="618" y="161" text-anchor="middle" font-weight="700" fill="#1c5cab">x</text>
    <rect x="384" y="66" width="312" height="108" fill="none" stroke="#8a8880"/>
  </g>
  <text x="384" y="206" font-size="13" fill="#52514e">Seta para baixo: 6/4 vira 4/6 (invertida).</text>
  <text x="384" y="236" font-size="16" font-weight="700" fill="#0b0b0b">10/x = 4/6</text>
  <text x="384" y="262" font-size="14" fill="#0b0b0b">x = 10 × 6 ÷ 4</text>
  <text x="384" y="290" font-size="16" font-weight="700" fill="#b84a1c">x = 15 dias</text>

  <line x1="360" y1="20" x2="360" y2="300" stroke="#d6d4ce"/>
  <text x="24" y="320" font-size="12" fill="#52514e">Seta para cima na coluna do x; nas outras, para cima se a grandeza é direta e para baixo se é inversa.</text>
</svg>
