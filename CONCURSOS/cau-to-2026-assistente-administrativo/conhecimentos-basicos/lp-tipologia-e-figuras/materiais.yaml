materiais:
  - tipo: texto
    titulo: Tipos textuais, figuras de linguagem, denotação e conotação
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: "18. Aula de Tipologia textual (Português) - Parte 1"
    url: https://www.youtube.com/watch?v=UZ5DJkUhMrM
    autor: TecConcursos
    duracao_min: 31
    descricao: >-
      Veja os capítulos sobre gêneros textuais, "não existe tipo textual puro" e o tipo
      narrativo, com um exemplo analisado. Os demais tipos não estão nesta parte: estude-os
      pelo texto da aula.
  - tipo: video
    titulo: "PASSO A PASSO para entender as FIGURAS DE LINGUAGEM!"
    url: https://www.youtube.com/watch?v=n0e75nRstcU
    autor: Professor Noslen
    duracao_min: 15
    descricao: >-
      Denotação e conotação, comparação, metáfora, metonímia, antítese, paradoxo,
      personificação, hipérbole, eufemismo e ironia, com exemplos de músicas. Pelos capítulos, não trata de
      catacrese, elipse, zeugma, pleonasmo e anáfora nem é voltado a bancas: complete com o
      texto da aula.
  - tipo: podcast
    titulo: DENOTAÇÃO E CONOTAÇÃO
    url: https://podcasts.apple.com/br/podcast/denota%C3%A7%C3%A3o-e-conota%C3%A7%C3%A3o/id1584593874?i=1000547591272
    autor: Tribo Concursos (podcast)
    duracao_min: 24
    descricao: >-
      Episódio de janeiro de 2022. Acompanha a parte "Denotação e conotação" do texto da aula.
      Pela descrição da página, é uma aula inteira sobre denotação e conotação, gravada para
      outro concurso (Polícia Penal); a página não diz quem é o professor. O episódio não foi
      ouvido na preparação desta aula: o que está aqui vem da descrição da página. Se algo
      divergir do texto da aula, vale o texto.
  - tipo: podcast
    titulo: Figuras de linguagem
    url: https://podcasts.apple.com/br/podcast/figuras-de-linguagem/id1467274512?i=1000522095545
    autor: Pablo Jamilk (Jamilkast)
    duracao_min: 40
    descricao: >-
      Episódio de julho de 2019. Acompanha as partes de figuras de linguagem do texto da aula
      (dos pares que se confundem até "Outras figuras, em uma linha cada"). A página diz apenas
      que o episódio ensina "as principais figuras de linguagem", sem listar quais. O episódio
      não foi ouvido na preparação desta aula: o que está aqui vem da descrição da página. Se
      algo divergir do texto da aula, vale o texto. Não há podcast indicado para tipos
      textuais: estude essa parte pelo texto e pelo vídeo.
