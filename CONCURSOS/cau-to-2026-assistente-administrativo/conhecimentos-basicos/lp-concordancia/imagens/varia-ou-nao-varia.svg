<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="500" fill="#ffffff"/>

  <!-- Bloco 1 -->
  <rect x="20" y="20" width="680" height="134" rx="10" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <text x="36" y="46" font-size="16" font-weight="700" fill="#1c5cab">Sempre concordam com o nome</text>
  <g font-size="14" fill="#0b0b0b">
    <text x="36" y="74"><tspan font-weight="700">anexo</tspan>: a planilha <tspan font-weight="600">anexa</tspan>; os recibos <tspan font-weight="600">anexos</tspan></text>
    <text x="36" y="96" fill="#52514e">     (a locução "em anexo" não varia: seguem em anexo os recibos)</text>
    <text x="36" y="120"><tspan font-weight="700">mesmo, próprio</tspan>: elas <tspan font-weight="600">mesmas</tspan> conferiram; eles <tspan font-weight="600">próprios</tspan> assinaram</text>
    <text x="36" y="142"><tspan font-weight="700">obrigado</tspan>: a mulher diz "<tspan font-weight="600">obrigada</tspan>"; o homem, "<tspan font-weight="600">obrigado</tspan>"</text>
  </g>

  <!-- Bloco 2 -->
  <rect x="20" y="168" width="680" height="116" rx="10" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
  <text x="36" y="194" font-size="16" font-weight="700" fill="#8a5a00">Dependem do sentido</text>
  <g font-size="14" fill="#0b0b0b">
    <text x="36" y="222"><tspan font-weight="700">meio</tspan>: <tspan font-weight="600">meia</tspan> hora (metade: varia) × <tspan font-weight="600">meio</tspan> atrasada (um pouco: não varia)</text>
    <text x="36" y="248"><tspan font-weight="700">bastante</tspan>: <tspan font-weight="600">bastantes</tspan> pedidos (muitos: varia) ×</text>
    <text x="36" y="270">     <tspan font-weight="600">bastante</tspan> cansados (muito: não varia)</text>
  </g>

  <!-- Bloco 3 -->
  <rect x="20" y="298" width="680" height="62" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
  <text x="36" y="324" font-size="16" font-weight="700" fill="#0b0b0b">Nunca variam</text>
  <text x="36" y="348" font-size="14" fill="#0b0b0b"><tspan font-weight="700">menos</tspan>: <tspan font-weight="600">menos</tspan> reclamações ("menas" não existe)</text>

  <!-- Pé: é proibido -->
  <rect x="20" y="374" width="680" height="110" rx="10" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
  <text x="36" y="400" font-size="16" font-weight="700" fill="#4a3aa7">"É proibido", "é necessário", "é bom"</text>
  <g font-size="14" fill="#0b0b0b">
    <text x="36" y="428">sem artigo ou outro determinante, invariável: É <tspan font-weight="600">proibido</tspan> entrada de animais.</text>
    <text x="36" y="454">com determinante, concorda: É <tspan font-weight="600">proibida a</tspan> entrada de animais.</text>
    <text x="36" y="476" fill="#52514e">"É proibido a entrada" mistura as duas construções: errado.</text>
  </g>
</svg>
