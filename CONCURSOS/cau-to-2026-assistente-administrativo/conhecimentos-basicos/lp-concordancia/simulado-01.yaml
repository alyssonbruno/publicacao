# Treino de concordância verbal e nominal — CAU/TO 2026, Assistente Administrativo. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Concordância verbal e nominal
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre um texto próprio e fictício (comunicado de um conselho profissional), com linhas
      numeradas, e sobre frases soltas, no estilo de certo ou errado do Instituto Quadrix: troca de flexão “sem
      prejuízo da correção”, justificativa da flexão e julgamento da correção de frases.'
    - 'Referências de estilo, sem cópia de itens: itens do Instituto Quadrix listados no Estude Grátis (assuntos
      Concordância verbal e concordância nominal, Concordância e flexão nominal e Verbo:
      https://www.estudegratis.com.br/questoes-de-concurso/materia/portugues/assunto/concordancia-verbal-concordancia-nominal/banca/quadrix);
      caderno e gabarito definitivo de Assistente Administrativo do CRMV-CE 2024 e do CREF3/SC 2023 (Instituto
      Quadrix); item do NOVACAP 2024 no Aprova Concursos.'
    - 'Bases do gabarito: Manual de Redação da Presidência da República, 3ª ed. (item 11.7); Manual de
      Comunicação da Secom do Senado Federal (verbetes “Concordância verbal” e “Anexo”); TJMG, Gotas da
      Língua Portuguesa nºs 158, 164, 171, 204 e 212; STJ, EaDicas de Português, Dica 16. Consultados em
      17/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-concordancia
    enunciado: |-
      Considere o texto a seguir, um comunicado fictício de um conselho profissional, com as linhas numeradas.
      > 1. Desde a semana passada, chegaram ao protocolo do Conselho novos
      > 2. pedidos de registro. Há, entre eles, processos que
      > 3. aguardam documentos, e faz quinze dias que a equipe tenta contato
      > 4. com os interessados. Para agilizar a análise, publicaram-se no
      > 5. portal as orientações de preenchimento, e a lista dos documentos
      > 6. exigidos segue anexa a este comunicado. É necessária a assinatura
      > 7. do responsável técnico em todos os formulários. A maioria dos
      > 8. profissionais já regularizou a situação; os demais devem procurar
      > 9. o atendimento, que funciona de segunda a sexta-feira.

      Com relação à concordância verbal e nominal no texto, julgue o item.

      Na linha 1, a forma verbal “chegaram” está no plural porque concorda com o núcleo do sujeito, “pedidos” (linha 2), que aparece depois do verbo.
