    topico: conhecimentos-basicos/lp-concordancia
    enunciado: |-
      Considere o texto a seguir, um comunicado fictício de um conselho profissional, com as linhas numeradas.
      > 1. Desde a semana passada, chegaram ao protocolo do Conselho novos
      > 2. pedidos de registro. Há, entre eles, processos que
      > 3. aguardam documentos, e faz quinze dias que a equipe tenta contato
      > 4. com os interessados. Para agilizar a análise, publicaram-se no
      > 5. portal as orientações de preenchimento, e a lista dos documentos
      > 6. exigidos segue anexa a este comunicado. É necessária a assinatura
      > 7. do responsável técnico em todos os formulários. A maioria dos
      > 8. profissionais já regularizou a situação; os demais devem procurar
      > 9. o atendimento, que funciona de segunda a sexta-feira.

      Com relação à concordância verbal e nominal no texto, julgue o item.

      Na linha 3, a forma verbal “faz” poderia ser substituída por “fazem”, em concordância com “quinze dias”, sem prejuízo da correção gramatical.
  - id: q04
    topico: conhecimentos-basicos/lp-concordancia
    enunciado: |-
      Considere o texto a seguir, um comunicado fictício de um conselho profissional, com as linhas numeradas.
      > 1. Desde a semana passada, chegaram ao protocolo do Conselho novos
      > 2. pedidos de registro. Há, entre eles, processos que
      > 3. aguardam documentos, e faz quinze dias que a equipe tenta contato
      > 4. com os interessados. Para agilizar a análise, publicaram-se no
      > 5. portal as orientações de preenchimento, e a lista dos documentos
      > 6. exigidos segue anexa a este comunicado. É necessária a assinatura
      > 7. do responsável técnico em todos os formulários. A maioria dos
      > 8. profissionais já regularizou a situação; os demais devem procurar
      > 9. o atendimento, que funciona de segunda a sexta-feira.

      Com relação à concordância verbal e nominal no texto, julgue o item.

      No trecho “publicaram-se no portal as orientações de preenchimento” (linhas 4 e 5), o verbo está no plural porque “as orientações de preenchimento” é o sujeito da oração, e o “se” é partícula apassivadora.
