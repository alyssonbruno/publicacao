materiais:
  - tipo: texto
    titulo: "Pontuação: o uso correto dos sinais"
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: podcast
    titulo: VÍRGULA – QUESTÃO POLÊMICA! Oração Restritiva e Explicativa
    url: https://podcasts.apple.com/br/podcast/v%C3%ADrgula-quest%C3%A3o-pol%C3%AAmica-ora%C3%A7%C3%A3o-restritiva-e-explicativa/id1534371896?i=1000550427332
    audio: https://anchor.fm/s/3950d1cc/podcast/play/46824641/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2022-0-28%2F604bcc78-b0d1-015e-7f86-8f17851de4bc.mp3
    autor: Português com Letícia (podcast)
    duracao_min: 9
    descricao: >-
      Episódio de fevereiro de 2022, sobre o ponto de pontuação que a Quadrix mais cobra: a mesma
      frase sem vírgulas (restritiva), com vírgulas (explicativa) e com vírgulas mal postas. Pela
      transcrição automática do áudio, feita para outra aula do acervo (ninguém ouviu), a
      professora mostra que as duas primeiras formas estão corretas e que só o sentido decide
      entre elas. A questão é de enquete do canal, não de prova. Ouça depois da parte
      "Restritiva × explicativa".
  - tipo: podcast
    titulo: Episódio 51 - Uso da vírgula no adjunto adverbial
    url: https://podcasts.apple.com/br/podcast/epis%C3%B3dio-51-uso-da-v%C3%ADrgula-no-adjunto-adverbial/id1507504573?i=1000532280037
    audio: https://anchor.fm/s/1bcc809c/podcast/play/38911995/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2021-08-17%2F2136cc642d911c748c41917077c1601b.m4a
    autor: Wanderson Melo (podcast Português Jurídico)
    duracao_min: 8
    descricao: >-
      Episódio de agosto de 2021, só sobre a vírgula do adjunto adverbial. Pela transcrição
      automática feita para outra aula (ninguém ouviu): em regra facultativa, obrigatória quando o
      adjunto é longo e está deslocado. O autor conta como longo o adjunto de mais de duas
      palavras; o manual do Senado, citado no texto da aula, fala em mais de três. Nenhuma das
      duas contagens é regra da gramática: guarde a lógica, não o número. Exemplos de textos
      jurídicos.
  - tipo: podcast
    titulo: "🟣 Casos OBRIGATÓRIOS de VÍRGULA | Aprenda de verdade e não erre nunca mais!"
    url: https://podcasts.apple.com/br/podcast/casos-obrigat%C3%B3rios-de-v%C3%ADrgula-aprenda-de-verdade-e/id1534371896?i=1000680128203
    audio: https://anchor.fm/s/3950d1cc/podcast/play/95324630/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2024-11-3%2F390930911-44100-2-7b2621917f1c8.mp3
    autor: Português com Letícia (podcast)
    duracao_min: 31
    descricao: >-
      Episódio de dezembro de 2024, áudio da videoaula de mesmo título (abaixo). Pela transcrição
      automática feita para outra aula (ninguém ouviu), dá para acompanhar sem a tela. Com pouco
      tempo, ouça três trechos: adjunto adverbial deslocado (a partir de 10:00), vírgula antes de
      "e" com sujeitos diferentes (20:25) e oração adjetiva explicativa (24:19). Ela dá a vírgula
      do adjunto como facultativa até três palavras, a medida do Senado; e, apesar do título,
      as fontes da aula não tratam a vírgula antes de "e" como obrigatória em todo caso (veja a
      parte "Enumeração, orações coordenadas e o 'e'").
  - tipo: video
    titulo: "🟣 VÍRGULA – Casos OBRIGATÓRIOS | Aprenda de verdade e não erre nunca mais! | Português do Zero"
    url: https://www.youtube.com/watch?v=zONGXynBdaY
    autor: Português com Letícia (canal no YouTube)
    duracao_min: 31
    descricao: >-
      A mesma aula do podcast acima, em vídeo, para quem prefere ver as frases na tela. O vídeo
      não foi assistido; o conteúdo foi conferido só pela transcrição do áudio: vocativo, termos
      de mesma função, aposto e explicativas, adjunto adverbial deslocado, verbo omitido,
      orações coordenadas e adverbiais. Exemplos literários, nada de banca. Só vírgula: os outros
      sinais estão no texto da aula. Valem as mesmas ressalvas do podcast sobre o adjunto curto e
      a vírgula antes de "e".
  - tipo: link
    titulo: Vírgula — Manual de Comunicação da Secom (Senado Federal)
    url: https://www12.senado.leg.br/manualdecomunicacao/estilos/virgula
    autor: Senado Federal, Secretaria de Comunicação Social
    descricao: >-
      Página curta, para ler inteira: abre pelo que a vírgula não separa (sujeito e verbo, verbo e
      objetos) e lista os usos, com a função de cada termo marcada entre parênteses nos exemplos.
      É norma de estilo de uma redação jornalística, não gramática. No mesmo manual, os verbetes
      "Adjunto adverbial deslocado" e "Vírgula antes da conjunção e" tratam dos dois casos em que
      a aula fala de convenção e de divergência.
  - tipo: link
    titulo: Manual de Redação da Presidência da República, 3ª edição (cópia hospedada pelo ICMBio)
    url: https://ava.icmbio.gov.br/pluginfile.php/4592/mod_data/content/16325/Manual-de-redacao%20oficial%20_3%C2%AA%20EDI%C3%87%C3%83O%202018.pdf
    autor: Presidência da República, Casa Civil
    descricao: >-
      PDF de 189 páginas; para esta aula, leia só a seção 11.9, "Pontuação" (p. 77 a 80 da
      numeração impressa: vírgula, ponto e vírgula, dois-pontos, interrogação e exclamação), e,
      na seção 10, os itens de aspas, parênteses e travessão (p. 53 a 56). Não trata da vírgula
      facultativa nem das reticências, que estão no texto da aula.
