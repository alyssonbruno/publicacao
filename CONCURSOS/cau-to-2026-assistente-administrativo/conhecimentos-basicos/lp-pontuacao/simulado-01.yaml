# Treino de pontuação — CAU/TO 2026, Assistente Administrativo. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Pontuação
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre um texto próprio e fictício (uma notícia de um conselho profissional), com linhas numeradas, no estilo de certo ou errado do Instituto Quadrix: justificativa da vírgula, inserção, supressão e deslocamento de sinais e troca de um sinal por outro, com julgamento da correção e do sentido.'
    - 'Referências de estilo, sem cópia de itens: itens do Instituto Quadrix de 2017 a 2025 listados no Estude Grátis no assunto Pontuação (https://www.estudegratis.com.br/questoes-de-concurso/materia/portugues/assunto/pontuacao/banca/quadrix), em especial CRECI 14ª Região (MS) 2021, Assistente Administrativo (Q867716 e Q867717), CFBio 2025, CRQ-SP 2018, CRMV 2020, CREF/SE 2019 e CRESS/SC 2019; caderno de Assistente Administrativo do CORE-SE 2025 (Instituto Quadrix), questão de pontuação. Os gabaritos dessas provas não foram consultados.'
    - 'Bases do gabarito: Manual de Redação da Presidência da República, 3ª ed. (2018), seções 10.5 e 11.9; Manual de Comunicação da Secom, Senado Federal (verbetes “Vírgula”, “Adjunto adverbial deslocado” e “Travessão”); Gotas da Língua Portuguesa nº 243, TJMG; Dad Squarisi, “Casos de vírgula” (Blog da Dad). Consultados em 17/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-pontuacao
    enunciado: |-
      Considere o texto a seguir, uma notícia fictícia do site de um conselho profissional, com as linhas numeradas.
      > 1. O Conselho abriu, nesta semana, um novo canal de atendimento: um
      > 2. número para mensagens que funciona das 8h às 18h. Os profissionais
      > 3. que ainda não atualizaram o cadastro receberão um aviso pelo
      > 4. próprio canal. Segundo a gerente de atendimento, a ferramenta deve
      > 5. reduzir a fila do balcão, que chegou a quarenta pessoas por dia em
      > 6. setembro. A equipe responsável pelo projeto, no entanto, alerta
      > 7. para um cuidado: o canal não substitui o protocolo eletrônico.
      > 8. Pedidos de registro, certidões e recursos continuam a ser feitos
      > 9. pelo portal; dúvidas simples, pelo novo número. Em outubro, o
      > 10. serviço passará por avaliação.

      Com relação ao emprego dos sinais de pontuação no texto, julgue o item.

      As vírgulas que isolam “nesta semana” (linha 1) justificam-se por se tratar de uma expressão explicativa, do mesmo tipo de “isto é” e “ou seja”.
