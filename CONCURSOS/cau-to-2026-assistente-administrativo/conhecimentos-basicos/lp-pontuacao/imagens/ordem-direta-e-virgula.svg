<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="20" y="34" font-size="18" font-weight="700" fill="#0b0b0b">Ordem direta: sem vírgula entre os termos ligados</text>

  <g transform="translate(20 52)">
    <rect width="680" height="132" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <g font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">
      <text x="88" y="28">sujeito</text>
      <text x="232" y="28">verbo</text>
      <text x="364" y="28">complemento</text>
      <text x="556" y="28">adjunto adverbial</text>
    </g>
    <g font-size="16" font-weight="600" text-anchor="middle">
      <rect x="16" y="40" width="144" height="40" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="88" y="66" fill="#1c5cab">A comissão</text>
      <rect x="184" y="40" width="96" height="40" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="232" y="66" fill="#8a5a00">aprovou</text>
      <rect x="304" y="40" width="120" height="40" rx="6" fill="#e8f4ea" stroke="#2f8a46" stroke-width="1.5"/>
      <text x="364" y="66" fill="#1f6b33">o relatório</text>
      <rect x="448" y="40" width="216" height="40" rx="6" fill="#f1efe9" stroke="#8a877d" stroke-width="1.5"/>
      <text x="556" y="66" fill="#3d3c38">na sessão de ontem.</text>
    </g>
    <g stroke="#c4302b" stroke-width="3" stroke-linecap="round">
      <line x1="166" y1="52" x2="178" y2="68"/><line x1="178" y1="52" x2="166" y2="68"/>
      <line x1="286" y1="52" x2="298" y2="68"/><line x1="298" y1="52" x2="286" y2="68"/>
    </g>
    <text x="16" y="112" font-size="13" fill="#52514e"><tspan fill="#c4302b" font-weight="700">✕</tspan> nunca uma vírgula sozinha entre sujeito e verbo nem entre verbo e complemento, por mais longo que seja o sujeito.</text>
  </g>

  <text x="20" y="218" font-size="18" font-weight="700" fill="#0b0b0b">Quando a vírgula aparece</text>

  <g transform="translate(20 232)">
    <rect width="680" height="70" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="16" y="26" font-size="13" font-weight="600" fill="#52514e">Um termo sai do lugar: o adjunto vai para o começo</text>
    <g font-size="16" font-weight="600">
      <text x="16" y="54" fill="#3d3c38">Na sessão de ontem<tspan fill="#c4302b" font-size="20">,</tspan> <tspan fill="#1c5cab">a comissão</tspan> <tspan fill="#8a5a00">aprovou</tspan> <tspan fill="#1f6b33">o relatório</tspan>.</text>
    </g>
  </g>

  <g transform="translate(20 312)">
    <rect width="680" height="70" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="16" y="26" font-size="13" font-weight="600" fill="#52514e">Algo entra no meio: vírgulas em par, uma abre e outra fecha</text>
    <g font-size="16" font-weight="600">
      <text x="16" y="54"><tspan fill="#1c5cab">A comissão</tspan><tspan fill="#c4302b" font-size="20">,</tspan> <tspan fill="#3d3c38">por unanimidade</tspan><tspan fill="#c4302b" font-size="20">,</tspan> <tspan fill="#8a5a00">aprovou</tspan> <tspan fill="#1f6b33">o relatório</tspan>.</text>
    </g>
  </g>
</svg>
