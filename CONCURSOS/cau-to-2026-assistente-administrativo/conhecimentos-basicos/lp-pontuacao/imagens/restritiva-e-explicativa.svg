<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <defs>
    <g id="doc">
      <rect width="40" height="52" rx="3" fill="#ffffff" stroke="#8a877d" stroke-width="1.5"/>
      <line x1="8" y1="12" x2="32" y2="12" stroke="#c9c6bd" stroke-width="2"/>
      <line x1="8" y1="20" x2="32" y2="20" stroke="#c9c6bd" stroke-width="2"/>
      <line x1="8" y1="28" x2="26" y2="28" stroke="#c9c6bd" stroke-width="2"/>
    </g>
    <g id="assinado">
      <use href="#doc"/>
      <path d="M8 42 q5 -8 9 0 t9 0 t8 -2" fill="none" stroke="#256abf" stroke-width="2"/>
    </g>
    <g id="semassinatura">
      <use href="#doc"/>
      <line x1="8" y1="42" x2="32" y2="42" stroke="#c98500" stroke-width="1.5" stroke-dasharray="3 3"/>
    </g>
  </defs>

  <!-- Restritiva -->
  <g transform="translate(16 16)">
    <rect width="336" height="348" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="18" y="32" font-size="18" font-weight="700" fill="#0b0b0b">Restritiva (sem vírgulas)</text>
    <text x="18" y="58" font-size="14" fill="#0b0b0b">Os pedidos que chegaram sem assinatura</text>
    <text x="18" y="78" font-size="14" fill="#0b0b0b">voltaram ao protocolo.</text>
    <rect x="18" y="100" width="168" height="84" rx="10" fill="#fdf1d6" stroke="#c98500" stroke-width="2"/>
    <use href="#semassinatura" x="30" y="116"/>
    <use href="#semassinatura" x="80" y="116"/>
    <use href="#semassinatura" x="130" y="116"/>
    <use href="#assinado" x="204" y="116"/>
    <use href="#assinado" x="254" y="116"/>
    <use href="#assinado" x="30" y="208"/>
    <use href="#assinado" x="80" y="208"/>
    <use href="#assinado" x="130" y="208"/>
    <text x="18" y="292" font-size="13" fill="#52514e"><tspan font-weight="700" fill="#8a5a00">3 de 8</tspan> voltaram: só os sem assinatura.</text>
    <text x="18" y="314" font-size="13" fill="#52514e">Os assinados seguiram adiante.</text>
    <text x="18" y="336" font-size="13" font-weight="600" fill="#0b0b0b">Separa uma parte do grupo.</text>
  </g>

  <!-- Explicativa -->
  <g transform="translate(368 16)">
    <rect width="336" height="348" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="18" y="32" font-size="18" font-weight="700" fill="#0b0b0b">Explicativa (com vírgulas)</text>
    <text x="18" y="58" font-size="14" fill="#0b0b0b">Os pedidos<tspan fill="#c4302b" font-weight="700">,</tspan> que chegaram sem assinatura<tspan fill="#c4302b" font-weight="700">,</tspan></text>
    <text x="18" y="78" font-size="14" fill="#0b0b0b">voltaram ao protocolo.</text>
    <rect x="18" y="100" width="300" height="176" rx="10" fill="#fdf1d6" stroke="#c98500" stroke-width="2"/>
    <use href="#semassinatura" x="30" y="116"/>
    <use href="#semassinatura" x="80" y="116"/>
    <use href="#semassinatura" x="130" y="116"/>
    <use href="#semassinatura" x="204" y="116"/>
    <use href="#semassinatura" x="254" y="116"/>
    <use href="#semassinatura" x="30" y="208"/>
    <use href="#semassinatura" x="80" y="208"/>
    <use href="#semassinatura" x="130" y="208"/>
    <text x="18" y="292" font-size="13" fill="#52514e"><tspan font-weight="700" fill="#8a5a00">8 de 8</tspan> voltaram: todos estavam</text>
    <text x="18" y="314" font-size="13" fill="#52514e">sem assinatura.</text>
    <text x="18" y="336" font-size="13" font-weight="600" fill="#0b0b0b">Fala do grupo inteiro.</text>
  </g>
</svg>
