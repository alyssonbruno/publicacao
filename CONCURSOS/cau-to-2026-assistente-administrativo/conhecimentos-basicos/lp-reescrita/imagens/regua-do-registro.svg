<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fdf1d6"/>
      <stop offset="1" stop-color="#e3edf9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="330" fill="#ffffff"/>

  <!-- Régua -->
  <rect x="24" y="40" width="672" height="34" rx="17" fill="url(#g)" stroke="#e1e0d9"/>
  <text x="44" y="63" font-size="16" font-weight="700" fill="#8a5a00">← mais informal</text>
  <text x="676" y="63" font-size="16" font-weight="700" fill="#1c5cab" text-anchor="end">mais formal →</text>
  <text x="360" y="26" font-size="13" fill="#52514e" text-anchor="middle">o que puxa: distância entre as pessoas, “cerimônia” da situação, assunto</text>

  <!-- Legenda -->
  <g font-size="12.5" fill="#52514e">
    <rect x="24" y="92" width="20" height="16" rx="4" fill="#ffffff" stroke="#256abf" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="52" y="105">fala</text>
    <rect x="100" y="92" width="20" height="16" rx="4" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="128" y="105">escrita</text>
  </g>

  <!-- Coluna informal -->
  <g font-size="13" fill="#0b0b0b">
    <text x="24" y="138" font-size="13" font-weight="700" fill="#8a5a00">Lado informal</text>
    <rect x="24" y="148" width="210" height="34" rx="6" fill="#ffffff" stroke="#256abf" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="36" y="170">conversa entre amigos</text>
    <rect x="24" y="190" width="210" height="34" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="36" y="212">mensagem no grupo da família</text>
    <rect x="24" y="232" width="210" height="34" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="36" y="254">bilhete a um colega</text>
  </g>

  <!-- Coluna meio -->
  <g font-size="13" fill="#0b0b0b">
    <text x="255" y="138" font-weight="700" fill="#52514e">No meio</text>
    <rect x="255" y="148" width="210" height="34" rx="6" fill="#ffffff" stroke="#256abf" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="267" y="170">atendimento no balcão</text>
    <rect x="255" y="190" width="210" height="34" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="267" y="212">post do Conselho na rede social</text>
  </g>

  <!-- Coluna formal -->
  <g font-size="13" fill="#0b0b0b">
    <text x="486" y="138" font-weight="700" fill="#1c5cab">Lado formal</text>
    <rect x="486" y="148" width="210" height="34" rx="6" fill="#ffffff" stroke="#256abf" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="498" y="170">palestra num seminário</text>
    <rect x="486" y="190" width="210" height="34" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="498" y="212">e-mail a um profissional</text>
    <rect x="486" y="232" width="210" height="34" rx="6" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="498" y="254">ofício a outro órgão</text>
  </g>

  <!-- Nota -->
  <rect x="24" y="282" width="672" height="36" rx="8" fill="#f3f2ee"/>
  <text x="360" y="305" font-size="13" fill="#0b0b0b" text-anchor="middle">Fala e escrita aparecem dos dois lados. Informal não é errado: é o registro de outra situação.</text>
</svg>
