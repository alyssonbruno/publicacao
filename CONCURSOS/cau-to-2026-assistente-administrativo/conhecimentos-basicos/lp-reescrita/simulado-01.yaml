  - id: q08
    topico: conhecimentos-basicos/lp-reescrita
    enunciado: |-
      Considere o texto a seguir, uma notícia fictícia do site de um conselho profissional, com as linhas numeradas.
      > 1. O Conselho mudou, em outubro, o horário do atendimento presencial.
      > 2. A sede agora abre às 8h e fecha às 14h, e o portal continua
      > 3. disponível o dia todo. A diretoria aprovou a mudança em setembro,
      > 4. depois de uma consulta aos servidores, que pediram mais tempo para
      > 5. analisar os processos à tarde. Segundo a coordenadora do atendimento,
      > 6. a fila da manhã era o maior problema: “A gente não dá conta de atender
      > 7. todo mundo no mesmo dia, então o jeito foi reorganizar”. Como o
      > 8. novo horário vale só para a sede, as unidades do interior mantêm
      > 9. o funcionamento antigo, atendendo também aos sábados.

      Considerando a adequação da linguagem a diferentes contextos, julgue o item, a respeito do texto.

      Caso a fala da coordenadora fosse aproveitada num ofício, em registro formal, o trecho “A gente não dá conta de atender todo mundo no mesmo dia” (linhas 6 e 7) poderia ser reescrito, com correção gramatical e sem alteração do sentido, como “Não conseguimos atender a todos no mesmo dia”.
