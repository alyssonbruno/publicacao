<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="16" y="28" font-size="15" font-weight="700" fill="#0b0b0b">Um dado lançado duas vezes: sair pelo menos um 6</text>

  <!-- Rótulos dos eixos -->
  <text x="190" y="60" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="middle">2º lançamento</text>
  <text x="34" y="220" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="middle" transform="rotate(-90 34 220)">1º lançamento</text>
  <g font-size="13" font-weight="600" fill="#52514e" text-anchor="middle">
    <text x="85" y="82">1</text><text x="127" y="82">2</text><text x="169" y="82">3</text>
    <text x="211" y="82">4</text><text x="253" y="82">5</text><text x="295" y="82">6</text>
    <text x="54" y="115">1</text><text x="54" y="157">2</text><text x="54" y="199">3</text>
    <text x="54" y="241">4</text><text x="54" y="283">5</text><text x="54" y="325">6</text>
  </g>

  <!-- 25 casos sem 6 (linhas 1 a 5, colunas 1 a 5) -->
  <g fill="#f3f3f0" stroke="#c9c7c0" stroke-width="1">
    <rect x="66" y="92" width="38" height="38"/><rect x="108" y="92" width="38" height="38"/><rect x="150" y="92" width="38" height="38"/><rect x="192" y="92" width="38" height="38"/><rect x="234" y="92" width="38" height="38"/>
    <rect x="66" y="134" width="38" height="38"/><rect x="108" y="134" width="38" height="38"/><rect x="150" y="134" width="38" height="38"/><rect x="192" y="134" width="38" height="38"/><rect x="234" y="134" width="38" height="38"/>
    <rect x="66" y="176" width="38" height="38"/><rect x="108" y="176" width="38" height="38"/><rect x="150" y="176" width="38" height="38"/><rect x="192" y="176" width="38" height="38"/><rect x="234" y="176" width="38" height="38"/>
    <rect x="66" y="218" width="38" height="38"/><rect x="108" y="218" width="38" height="38"/><rect x="150" y="218" width="38" height="38"/><rect x="192" y="218" width="38" height="38"/><rect x="234" y="218" width="38" height="38"/>
    <rect x="66" y="260" width="38" height="38"/><rect x="108" y="260" width="38" height="38"/><rect x="150" y="260" width="38" height="38"/><rect x="192" y="260" width="38" height="38"/><rect x="234" y="260" width="38" height="38"/>
  </g>
  <!-- 11 casos com pelo menos um 6: coluna 6 (6 casos) e linha 6 (mais 5) -->
  <g fill="#fdeee7" stroke="#eb6834" stroke-width="1.5">
    <rect x="276" y="92" width="38" height="38"/><rect x="276" y="134" width="38" height="38"/><rect x="276" y="176" width="38" height="38"/>
    <rect x="276" y="218" width="38" height="38"/><rect x="276" y="260" width="38" height="38"/><rect x="276" y="302" width="38" height="38"/>
    <rect x="66" y="302" width="38" height="38"/><rect x="108" y="302" width="38" height="38"/><rect x="150" y="302" width="38" height="38"/>
    <rect x="192" y="302" width="38" height="38"/><rect x="234" y="302" width="38" height="38"/>
  </g>
  <text x="190" y="368" font-size="12" fill="#52514e" text-anchor="middle">36 casos igualmente prováveis (6 × 6)</text>

  <!-- Legenda e contas -->
  <rect x="350" y="92" width="18" height="18" fill="#f3f3f0" stroke="#c9c7c0"/>
  <text x="378" y="106" font-size="13" fill="#0b0b0b"><tspan font-weight="700">25</tspan> casos sem nenhum 6 (5 × 5)</text>
  <rect x="350" y="122" width="18" height="18" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
  <text x="378" y="136" font-size="13" fill="#0b0b0b"><tspan font-weight="700">11</tspan> casos com pelo menos um 6</text>

  <rect x="350" y="166" width="354" height="150" rx="10" fill="#f9f9f7" stroke="#8a8880" stroke-width="1.2"/>
  <text x="366" y="192" font-size="13" font-weight="700" fill="#0b0b0b">Pelo complementar (o caminho curto):</text>
  <text x="366" y="216" font-size="13" fill="#52514e">P(nenhum 6) = 25/36</text>
  <text x="366" y="240" font-size="13" fill="#52514e">P(pelo menos um 6) = 1 − 25/36 = <tspan font-weight="700" fill="#b84a1c">11/36</tspan></text>
  <text x="366" y="272" font-size="13" font-weight="700" fill="#b84a1c">Errado: 1/6 + 1/6 = 12/36.</text>
  <text x="366" y="294" font-size="12" fill="#52514e">O caso (6, 6) seria contado duas vezes.</text>
</svg>
