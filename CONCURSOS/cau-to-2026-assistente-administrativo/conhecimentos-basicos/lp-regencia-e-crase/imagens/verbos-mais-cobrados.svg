<svg xmlns="http://www.w3.org/2000/svg" width="720" height="498" viewBox="0 0 720 498" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="498" fill="#ffffff"/>

  <text x="16" y="30" font-size="18" font-weight="700" fill="#0b0b0b">Verbos de regência mais cobrados</text>
  <text x="16" y="50" font-size="13" fill="#52514e">"a" = pede a preposição a; "sem preposição" = complemento direto</text>

  <!-- Cabeçalho -->
  <rect x="12" y="62" width="696" height="32" rx="6" fill="#e3edf9"/>
  <g font-size="13" font-weight="700" fill="#1c5cab">
    <text x="24" y="83">Verbo</text>
    <text x="124" y="83">Sentido</text>
    <text x="300" y="83">Regência</text>
    <text x="474" y="83">Exemplo</text>
  </g>

  <!-- Faixas alternadas -->
  <g fill="#f6f6f3">
    <rect x="12" y="94" width="696" height="64"/>
    <rect x="12" y="222" width="696" height="64"/>
    <rect x="12" y="318" width="696" height="32"/>
    <rect x="12" y="382" width="696" height="32"/>
    <rect x="12" y="446" width="696" height="32"/>
  </g>
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="12" y1="158" x2="708" y2="158"/>
    <line x1="12" y1="222" x2="708" y2="222"/>
    <line x1="12" y1="286" x2="708" y2="286"/>
  </g>

  <g font-size="13" fill="#0b0b0b">
    <!-- aspirar -->
    <text x="24" y="115" font-weight="700">aspirar</text>
    <text x="124" y="115">respirar, sugar</text>
    <text x="300" y="115">sem preposição</text>
    <text x="474" y="115" font-style="italic">aspirou o pó</text>
    <text x="124" y="147">desejar, pretender</text>
    <text x="300" y="147" font-weight="700" fill="#8a5a00">a</text>
    <text x="474" y="147" font-style="italic">aspira a uma vaga</text>

    <!-- assistir -->
    <text x="24" y="179" font-weight="700">assistir</text>
    <text x="124" y="179">ver, estar presente</text>
    <text x="300" y="179" font-weight="700" fill="#8a5a00">a</text>
    <text x="474" y="179" font-style="italic">assistiu ao treinamento</text>
    <text x="124" y="211">ajudar, socorrer</text>
    <text x="300" y="211">com ou sem a</text>
    <text x="474" y="211" font-style="italic">assistiu os (aos) feridos</text>

    <!-- visar -->
    <text x="24" y="243" font-weight="700">visar</text>
    <text x="124" y="243">ter por objetivo</text>
    <text x="300" y="243"><tspan font-weight="700" fill="#8a5a00">a</tspan> (também aceito sem)</text>
    <text x="474" y="243" font-style="italic">visa à economia; visa reduzir</text>
    <text x="124" y="275">mirar, pôr o visto</text>
    <text x="300" y="275">sem preposição</text>
    <text x="474" y="275" font-style="italic">visou o documento</text>

    <!-- implicar -->
    <text x="24" y="307" font-weight="700">implicar</text>
    <text x="124" y="307">acarretar</text>
    <text x="300" y="307">sem preposição</text>
    <text x="474" y="307" font-style="italic">implica multa</text>

    <!-- obedecer -->
    <text x="24" y="339" font-weight="700">obedecer</text>
    <text x="124" y="339">cumprir, seguir</text>
    <text x="300" y="339" font-weight="700" fill="#8a5a00">a</text>
    <text x="474" y="339" font-style="italic">obedece ao regimento</text>

    <!-- preferir -->
    <text x="24" y="371" font-weight="700">preferir</text>
    <text x="124" y="371">uma coisa a outra</text>
    <text x="300" y="371"><tspan font-weight="700" fill="#8a5a00">a</tspan> (nunca "do que")</text>
    <text x="474" y="371" font-style="italic">prefere o trem ao ônibus</text>

    <!-- chegar, ir -->
    <text x="24" y="403" font-weight="700">chegar, ir</text>
    <text x="124" y="403">a um lugar</text>
    <text x="300" y="403" font-weight="700" fill="#8a5a00">a</text>
    <text x="474" y="403" font-style="italic">chegou a Palmas</text>

    <!-- pedir -->
    <text x="24" y="435" font-weight="700">pedir</text>
    <text x="124" y="435">algo a alguém</text>
    <text x="300" y="435"><tspan font-weight="700" fill="#8a5a00">a</tspan> (a pessoa)</text>
    <text x="474" y="435" font-style="italic">pediu aos fiscais que voltassem</text>

    <!-- informar -->
    <text x="24" y="467" font-weight="700">informar</text>
    <text x="124" y="467">alguém de algo</text>
    <text x="300" y="467">ou algo a alguém</text>
    <text x="474" y="467" font-style="italic">informou o chefe do prazo</text>
  </g>

  <text x="16" y="494" font-size="11.5" fill="#52514e">Base: Manual de Redação da Presidência (p. 73 a 78); Senado (visar, implicar); STJ (chegar a).</text>
</svg>
