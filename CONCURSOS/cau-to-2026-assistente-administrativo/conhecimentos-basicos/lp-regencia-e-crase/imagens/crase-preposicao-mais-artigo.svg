<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#256abf"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- A soma -->
  <g transform="translate(12 16)">
    <rect width="210" height="96" rx="10" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="105" y="28" font-size="13" fill="#1c5cab" text-anchor="middle" font-weight="700">1. O regente pede "a"</text>
    <text x="105" y="62" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="600">necessário <tspan fill="#1c5cab">a</tspan></text>
    <text x="105" y="84" font-size="12" fill="#52514e" text-anchor="middle">preposição</text>

    <text x="240" y="60" font-size="30" fill="#52514e" text-anchor="middle">+</text>

    <rect x="258" width="210" height="96" rx="10" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="363" y="28" font-size="13" fill="#8a5a00" text-anchor="middle" font-weight="700">2. A palavra aceita "a"</text>
    <text x="363" y="62" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="600"><tspan fill="#8a5a00">a</tspan> inscrição</text>
    <text x="363" y="84" font-size="12" fill="#52514e" text-anchor="middle">artigo + palavra feminina</text>

    <text x="486" y="60" font-size="30" fill="#52514e" text-anchor="middle">=</text>

    <rect x="504" width="192" height="96" rx="10" fill="#e4f5ec" stroke="#1baf7a" stroke-width="1.5"/>
    <text x="600" y="28" font-size="13" fill="#11764f" text-anchor="middle" font-weight="700">Crase</text>
    <text x="600" y="62" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">necessário <tspan fill="#11764f">à</tspan> inscrição</text>
    <text x="600" y="84" font-size="12" fill="#52514e" text-anchor="middle">a + a = à</text>
  </g>

  <!-- Quem pede o a -->
  <g transform="translate(12 132)">
    <rect width="696" height="150" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="20" y="28" font-size="15" font-weight="700" fill="#0b0b0b">Quem pede o "a"? A palavra ao lado, não o verbo da frase</text>
    <text x="20" y="96" font-size="18" fill="#0b0b0b">O Conselho <tspan fill="#b42727">enviou</tspan> o formulário <tspan font-weight="700" fill="#1c5cab">necessário</tspan> <tspan font-weight="700" fill="#11764f">à</tspan> inscrição.</text>
    <path d="M 312 74 C 322 50, 354 50, 364 76" fill="none" stroke="#256abf" stroke-width="2" marker-end="url(#seta)"/>
    <text x="276" y="50" font-size="12" fill="#1c5cab">necessário a quê?</text>
    <text x="20" y="128" font-size="13" fill="#b42727">"enviou" não é o regente do à: "enviou o formulário" não tem preposição.</text>
  </g>

  <!-- Os testes -->
  <g transform="translate(12 298)">
    <rect width="340" height="106" rx="10" fill="#f6f6f3"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#0b0b0b">Teste 1: troque por masculino</text>
    <text x="16" y="54" font-size="14" fill="#0b0b0b">necessário <tspan font-weight="700" fill="#11764f">ao</tspan> cadastro</text>
    <text x="16" y="80" font-size="13" fill="#52514e">Apareceu "ao"? Então há crase</text>
    <text x="16" y="98" font-size="13" fill="#52514e">no feminino.</text>

    <rect x="356" width="340" height="106" rx="10" fill="#f6f6f3"/>
    <text x="372" y="26" font-size="14" font-weight="700" fill="#0b0b0b">Teste 2: troque por "para a"</text>
    <text x="372" y="54" font-size="14" fill="#0b0b0b">necessário <tspan font-weight="700" fill="#11764f">para a</tspan> inscrição</text>
    <text x="372" y="80" font-size="13" fill="#52514e">Coube "para a"? Havia preposição</text>
    <text x="372" y="98" font-size="13" fill="#52514e">e artigo.</text>
  </g>
</svg>
