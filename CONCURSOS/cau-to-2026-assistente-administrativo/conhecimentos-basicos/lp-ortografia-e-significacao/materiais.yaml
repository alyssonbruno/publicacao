materiais:
  - tipo: texto
    titulo: Ortografia oficial e significação das palavras
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: "Novo Acordo Ortográfico: o que mudou na acentuação gráfica"
    url: https://www.youtube.com/watch?v=lZb8yx7oSm8
    autor: Aprova Concursos, com a professora Daniela Tatarin
    duracao_min: 10
    descricao: >-
      Veja inteiro: só as mudanças do Acordo na acentuação, com foco em prova. Atenção: a
      descrição do vídeo diz que o Acordo "entrou em vigor em janeiro de 2016", o que é
      impreciso. Os efeitos começaram em 1º/1/2009 e o uso passou a ser obrigatório em
      1º/1/2016, quando terminou a transição (Decretos nº 6.583/2008 e 7.875/2012).
  - tipo: video
    titulo: "Aula 5: Emprego do hífen (novas regras)"
    url: https://www.youtube.com/watch?v=I0N3EvDBLmU
    autor: GramáticaEmVídeo - Prof. Fábio Alves
    duracao_min: 17
    descricao: >-
      Hífen com prefixos: regra geral (3:05), letras iguais (4:37), casos em que sempre há
      hífen (5:48), circum- (7:09) e super-, hiper- e inter- (8:29).
  - tipo: video
    titulo: HOMÔNIMOS e PARÔNIMOS || Português para Concursos
    url: https://www.youtube.com/watch?v=G-mVUDQ13fo
    autor: Português para Concursos - com Diego Pureza
    duracao_min: 18
    descricao: >-
      Homônimos perfeitos (2:02), homógrafos (2:27) e homófonos (2:57); parônimos (7:41);
      questões comentadas de outras bancas a partir de 10:33. Não trata de polissemia nem de
      hiperônimo e hipônimo: para isso, use o texto da aula.
  - tipo: video
    titulo: Homônimos e Parônimos - Nunca mais erre em concurso público!
    url: https://www.youtube.com/watch?v=aHpFOM3NBtg
    autor: Prof. Álvaro Ferreira
    duracao_min: 74
    descricao: >-
      Aprofundamento opcional: aula longa de homônimos, parônimos e polissemia, com questões
      de concurso resolvidas. Sem capítulos; vale dividir em duas partes.
  - tipo: podcast
    titulo: "NOVO ACORDO ORTOGRÁFICO: as principais mudanças!"
    url: https://podcasts.apple.com/br/podcast/novo-acordo-ortogr%C3%A1fico-as-principais-mudan%C3%A7as/id1534371896?i=1000550828029
    autor: Português com Letícia (professora Letícia Góes)
    duracao_min: 23
    descricao: >-
      Episódio de fevereiro de 2022. Acompanha as partes "O que o Acordo mudou na acentuação" e
      "Hífen com prefixos" do texto da aula. Pela descrição da página, é a aula sobre o Novo
      Acordo Ortográfico, com as principais alterações de acentuação e de hífen. O episódio não
      foi ouvido na preparação deste material: a informação vem da descrição da página, e ele
      parece ser o áudio de uma videoaula, sem a lousa. Se algo divergir do texto da aula, vale o
      texto.
  - tipo: podcast
    titulo: Acentuação Gráfica - Português para Concursos com Sidney Martins
    url: https://podcasts.apple.com/br/podcast/acentua%C3%A7%C3%A3o-gr%C3%A1fica-portugu%C3%AAs-para-concursos-com-sidney/id1467689131?i=1000701926218
    autor: Focus Concursos, com o professor Sidney Martins
    duracao_min: 30
    descricao: >-
      Episódio de abril de 2025, com o áudio de uma videoaula de janeiro de 2020. Acompanha a
      parte "Acentuação gráfica: as regras gerais" do texto da aula. A página informa apenas que é
      uma aula de Português sobre acentuação gráfica; não diz se separa as regras gerais das
      mudanças do Acordo, e o episódio não trata de hífen. Ele não foi ouvido na preparação deste
      material: a informação vem da descrição da página. Se algo divergir do texto da aula, vale o
      texto. O volume pode estar baixo: aumente o som se precisar. Não há podcast indicado para
      a significação das palavras (sinônimos, antônimos, homônimos e parônimos): para essa parte,
      use o texto e os vídeos.
