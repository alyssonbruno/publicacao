<svg xmlns="http://www.w3.org/2000/svg" width="720" height="488" viewBox="0 0 720 488" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="488" fill="#ffffff"/>
  <g font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="90" y="30">Verbo</text>
    <text x="90" y="46" font-weight="400" fill="#52514e">(infinitivo)</text>
    <text x="290" y="30">1. Pretérito perfeito</text>
    <text x="290" y="46" font-weight="400" fill="#52514e">“ontem eles…”</text>
    <text x="500" y="30">2. Tire o -am: futuro do subjuntivo</text>
    <text x="500" y="46" font-weight="400" fill="#52514e">“se ele…”, “quando ele…”</text>
  </g>
  <line x1="12" y1="58" x2="708" y2="58" stroke="#0b0b0b" stroke-width="1.5"/>
