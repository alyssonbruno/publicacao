    <text x="90" y="24" font-weight="700" fill="#1c5cab">protocolar</text>
    <text x="290" y="24" fill="#0b0b0b">protocolar<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M372 18 L412 18" stroke="#52514e" stroke-width="1.5"/><path d="M412 13 L422 18 L412 23 Z" fill="#52514e"/>
    <rect x="432" y="2" width="136" height="32" rx="6" fill="#f1f0ec" stroke="#8a8982" stroke-width="1.5"/>
    <text x="500" y="24" font-weight="700" fill="#3b3a37">protocolar</text>
    <text x="580" y="23" font-size="12" fill="#52514e" text-anchor="start">igual ao infinitivo</text>
  </g>
