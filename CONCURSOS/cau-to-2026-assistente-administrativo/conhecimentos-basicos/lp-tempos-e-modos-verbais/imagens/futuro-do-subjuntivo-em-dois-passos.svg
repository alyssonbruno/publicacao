  <line x1="12" y1="383" x2="708" y2="383" stroke="#e1e0d9"/>
  <g transform="translate(12 394)">
    <rect width="696" height="64" rx="10" fill="#fbe3e3"/>
    <text font-size="13.5" fill="#b42727">
      <tspan x="20" y="26" font-weight="700">Nos verbos das caixas amarelas, a forma do infinitivo depois de “se” e “quando” é erro:</tspan>
      <tspan x="20" dy="21">“se ele ver”, “quando ele vir aqui”, “se ele manter”, “se ele intervir”, “quando ele pôr”.</tspan>
    </text>
