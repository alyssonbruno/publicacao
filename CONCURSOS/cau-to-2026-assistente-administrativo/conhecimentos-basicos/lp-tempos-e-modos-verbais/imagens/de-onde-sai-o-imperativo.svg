<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="408" fill="#ffffff"/>

  <!-- Legenda -->
  <g font-size="13" fill="#52514e">
    <rect x="12" y="12" width="24" height="18" rx="4" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="44" y="26">vem do presente do indicativo, sem o -s</text>
    <rect x="316" y="12" width="24" height="18" rx="4" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="348" y="26">vem do presente do subjuntivo, sem mudar nada</text>
  </g>

  <!-- Cabeçalho -->
  <g font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="48" y="62">Pessoa</text>
    <text x="165" y="54">Presente do</text><text x="165" y="70">indicativo</text>
    <text x="321" y="54">Imperativo</text><text x="321" y="70">afirmativo</text>
    <text x="477" y="54">Presente do</text><text x="477" y="70">subjuntivo</text>
    <text x="630" y="54">Imperativo</text><text x="630" y="70">negativo</text>
  </g>
  <line x1="12" y1="80" x2="708" y2="80" stroke="#0b0b0b" stroke-width="1.5"/>

  <!-- Linhas -->
  <g font-size="15" text-anchor="middle">
    <!-- tu -->
    <g transform="translate(0 90)">
      <text x="48" y="28" font-weight="700" fill="#0b0b0b">tu</text>
      <text x="165" y="28" fill="#8a5a00">atende<tspan fill="#b42727" text-decoration="line-through">s</tspan></text>
      <path d="M214 23 L242 23" stroke="#c98500" stroke-width="1.5"/><path d="M242 18 L252 23 L242 28 Z" fill="#c98500"/>
      <rect x="256" y="4" width="130" height="36" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="321" y="28" font-weight="700" fill="#8a5a00">atende</text>
      <text x="477" y="28" fill="#1c5cab">atendas</text>
      <path d="M522 23 L550 23" stroke="#256abf" stroke-width="1.5"/><path d="M550 18 L560 23 L550 28 Z" fill="#256abf"/>
      <rect x="564" y="4" width="136" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="632" y="28" font-weight="700" fill="#1c5cab">não atendas</text>
    </g>
    <line x1="12" y1="138" x2="708" y2="138" stroke="#e1e0d9"/>
    <!-- você -->
    <g transform="translate(0 142)">
      <text x="48" y="28" font-weight="700" fill="#0b0b0b">você</text>
      <text x="165" y="28" fill="#a3a29c">—</text>
      <rect x="256" y="4" width="130" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="321" y="28" font-weight="700" fill="#1c5cab">atenda</text>
      <path d="M400 23 L428 23" stroke="#256abf" stroke-width="1.5"/><path d="M400 18 L390 23 L400 28 Z" fill="#256abf"/>
      <text x="477" y="28" fill="#1c5cab">atenda</text>
      <path d="M522 23 L550 23" stroke="#256abf" stroke-width="1.5"/><path d="M550 18 L560 23 L550 28 Z" fill="#256abf"/>
      <rect x="564" y="4" width="136" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="632" y="28" font-weight="700" fill="#1c5cab">não atenda</text>
    </g>
    <line x1="12" y1="190" x2="708" y2="190" stroke="#e1e0d9"/>
    <!-- nós -->
    <g transform="translate(0 194)">
      <text x="48" y="28" font-weight="700" fill="#0b0b0b">nós</text>
      <text x="165" y="28" fill="#a3a29c">—</text>
      <rect x="256" y="4" width="130" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="321" y="28" font-weight="700" fill="#1c5cab">atendamos</text>
      <path d="M400 23 L428 23" stroke="#256abf" stroke-width="1.5"/><path d="M400 18 L390 23 L400 28 Z" fill="#256abf"/>
      <text x="477" y="28" fill="#1c5cab">atendamos</text>
      <path d="M522 23 L550 23" stroke="#256abf" stroke-width="1.5"/><path d="M550 18 L560 23 L550 28 Z" fill="#256abf"/>
      <rect x="564" y="4" width="136" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="632" y="28" font-weight="700" fill="#1c5cab">não atendamos</text>
    </g>
    <line x1="12" y1="242" x2="708" y2="242" stroke="#e1e0d9"/>
    <!-- vós -->
    <g transform="translate(0 246)">
      <text x="48" y="28" font-weight="700" fill="#0b0b0b">vós</text>
      <text x="165" y="28" fill="#8a5a00">atendei<tspan fill="#b42727" text-decoration="line-through">s</tspan></text>
      <path d="M214 23 L242 23" stroke="#c98500" stroke-width="1.5"/><path d="M242 18 L252 23 L242 28 Z" fill="#c98500"/>
      <rect x="256" y="4" width="130" height="36" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="321" y="28" font-weight="700" fill="#8a5a00">atendei</text>
      <text x="477" y="28" fill="#1c5cab">atendais</text>
      <path d="M522 23 L550 23" stroke="#256abf" stroke-width="1.5"/><path d="M550 18 L560 23 L550 28 Z" fill="#256abf"/>
      <rect x="564" y="4" width="136" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="632" y="28" font-weight="700" fill="#1c5cab">não atendais</text>
    </g>
    <line x1="12" y1="294" x2="708" y2="294" stroke="#e1e0d9"/>
    <!-- vocês -->
    <g transform="translate(0 298)">
      <text x="48" y="28" font-weight="700" fill="#0b0b0b">vocês</text>
      <text x="165" y="28" fill="#a3a29c">—</text>
      <rect x="256" y="4" width="130" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="321" y="28" font-weight="700" fill="#1c5cab">atendam</text>
      <path d="M400 23 L428 23" stroke="#256abf" stroke-width="1.5"/><path d="M400 18 L390 23 L400 28 Z" fill="#256abf"/>
      <text x="477" y="28" fill="#1c5cab">atendam</text>
      <path d="M522 23 L550 23" stroke="#256abf" stroke-width="1.5"/><path d="M550 18 L560 23 L550 28 Z" fill="#256abf"/>
      <rect x="564" y="4" width="136" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="632" y="28" font-weight="700" fill="#1c5cab">não atendam</text>
    </g>
  </g>

  <!-- Rodapé -->
  <g transform="translate(12 352)">
    <rect width="696" height="44" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="20" y="27" font-size="13.5" fill="#0b0b0b">Verbo <tspan font-weight="700">atender</tspan>. Não existe imperativo para “eu”. O negativo sai inteiro do subjuntivo.</text>
  </g>
</svg>
