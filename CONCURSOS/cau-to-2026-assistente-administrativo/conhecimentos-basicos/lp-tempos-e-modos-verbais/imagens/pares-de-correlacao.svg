<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="470" fill="#ffffff"/>

  <g font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="174" y="26">Oração da condição (com “se”)</text>
    <text x="546" y="26">Oração principal</text>
  </g>
  <line x1="12" y1="38" x2="708" y2="38" stroke="#0b0b0b" stroke-width="1.5"/>

  <!-- 1 -->
  <g transform="translate(0 48)" text-anchor="middle">
    <rect x="12" y="0" width="324" height="78" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
    <text x="174" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Presente do indicativo</text>
    <text x="174" y="48" font-size="15" fill="#0b0b0b">Se o prazo <tspan font-weight="700" fill="#0e6b4b">vence</tspan> hoje,</text>
    <text x="174" y="67" font-size="12" fill="#52514e">fato tido como real</text>
    <path d="M342 39 L366 39" stroke="#52514e" stroke-width="1.5"/><path d="M366 34 L376 39 L366 44 Z" fill="#52514e"/>
    <rect x="384" y="0" width="324" height="78" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
    <text x="546" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Presente do indicativo</text>
    <text x="546" y="48" font-size="15" fill="#0b0b0b">o sistema <tspan font-weight="700" fill="#0e6b4b">bloqueia</tspan> o pedido.</text>
  </g>

  <!-- 2 -->
  <g transform="translate(0 136)" text-anchor="middle">
    <rect x="12" y="0" width="324" height="78" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="174" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Futuro do subjuntivo</text>
    <text x="174" y="48" font-size="15" fill="#0b0b0b">Se o prazo <tspan font-weight="700" fill="#8a5a00">vencer</tspan>,</text>
    <text x="174" y="67" font-size="12" fill="#52514e">pode acontecer</text>
    <path d="M342 39 L366 39" stroke="#52514e" stroke-width="1.5"/><path d="M366 34 L376 39 L366 44 Z" fill="#52514e"/>
    <rect x="384" y="0" width="324" height="78" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="546" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Futuro do presente (ou imperativo)</text>
    <text x="546" y="48" font-size="15" fill="#0b0b0b">o sistema <tspan font-weight="700" fill="#8a5a00">bloqueará</tspan> o pedido.</text>
  </g>

  <!-- 3 -->
  <g transform="translate(0 224)" text-anchor="middle">
    <rect x="12" y="0" width="324" height="78" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="174" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Pretérito imperfeito do subjuntivo</text>
    <text x="174" y="48" font-size="15" fill="#0b0b0b">Se o prazo <tspan font-weight="700" fill="#1c5cab">vencesse</tspan>,</text>
    <text x="174" y="67" font-size="12" fill="#52514e">só uma hipótese</text>
    <path d="M342 39 L366 39" stroke="#52514e" stroke-width="1.5"/><path d="M366 34 L376 39 L366 44 Z" fill="#52514e"/>
    <rect x="384" y="0" width="324" height="78" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="546" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Futuro do pretérito</text>
    <text x="546" y="48" font-size="15" fill="#0b0b0b">o sistema <tspan font-weight="700" fill="#1c5cab">bloquearia</tspan> o pedido.</text>
  </g>

  <!-- 4 -->
  <g transform="translate(0 312)" text-anchor="middle">
    <rect x="12" y="0" width="324" height="78" rx="8" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="174" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Mais-que-perfeito composto do subjuntivo</text>
    <text x="174" y="48" font-size="15" fill="#0b0b0b">Se o prazo <tspan font-weight="700" fill="#4a3aa7">tivesse vencido</tspan>,</text>
    <text x="174" y="67" font-size="12" fill="#52514e">hipótese sobre o passado: não aconteceu</text>
    <path d="M342 39 L366 39" stroke="#52514e" stroke-width="1.5"/><path d="M366 34 L376 39 L366 44 Z" fill="#52514e"/>
    <rect x="384" y="0" width="324" height="78" rx="8" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="546" y="24" font-size="12.5" font-weight="700" fill="#0b0b0b">Futuro do pretérito composto</text>
    <text x="546" y="48" font-size="15" fill="#0b0b0b">o sistema <tspan font-weight="700" fill="#4a3aa7">teria bloqueado</tspan> o pedido.</text>
  </g>

  <!-- Erro -->
  <g transform="translate(12 400)">
    <rect width="696" height="58" rx="10" fill="#fbe3e3"/>
    <text font-size="13.5" fill="#b42727">
      <tspan x="20" y="24" font-weight="700">Linhas misturadas quebram a correlação:</tspan>
      <tspan x="20" dy="20">“Se o prazo vencesse, o sistema bloqueará o pedido.”</tspan>
    </text>
  </g>
</svg>
