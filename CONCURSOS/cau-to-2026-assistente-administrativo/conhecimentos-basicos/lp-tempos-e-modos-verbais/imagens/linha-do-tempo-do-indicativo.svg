<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="430" fill="#ffffff"/>

  <!-- Caixas acima da linha -->
  <g text-anchor="middle">
    <g transform="translate(14 16)">
      <rect width="166" height="92" rx="8" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
      <text x="83" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Mais-que-perfeito</text>
      <text x="83" y="45" font-size="16" font-weight="700" fill="#4a3aa7">protocolara</text>
      <text x="83" y="63" font-size="12.5" fill="#4a3aa7">= tinha protocolado</text>
      <text x="83" y="82" font-size="12" fill="#52514e">antes de outro fato passado</text>
    </g>
    <g transform="translate(194 16)">
      <rect width="150" height="92" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="75" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Pretérito perfeito</text>
      <text x="75" y="48" font-size="16" font-weight="700" fill="#1c5cab">protocolou</text>
      <text x="75" y="74" font-size="12" fill="#52514e">fato concluído</text>
    </g>
    <g transform="translate(372 16)">
      <rect width="150" height="92" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
      <text x="75" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Presente</text>
      <text x="75" y="48" font-size="16" font-weight="700" fill="#0e6b4b">protocola</text>
      <text x="75" y="74" font-size="12" fill="#52514e">agora ou sempre</text>
    </g>
    <g transform="translate(550 16)">
      <rect width="156" height="92" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="78" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Futuro do presente</text>
      <text x="78" y="48" font-size="16" font-weight="700" fill="#8a5a00">protocolará</text>
      <text x="78" y="74" font-size="12" fill="#52514e">depois de agora</text>
    </g>
  </g>

  <!-- Ligações das caixas à linha -->
  <g stroke-width="1.5">
    <line x1="97" y1="108" x2="97" y2="160" stroke="#4a3aa7"/>
    <line x1="269" y1="108" x2="269" y2="160" stroke="#256abf"/>
    <line x1="447" y1="108" x2="447" y2="160" stroke="#12805a"/>
    <line x1="628" y1="108" x2="628" y2="160" stroke="#c98500"/>
  </g>

  <!-- Linha do tempo -->
  <line x1="24" y1="160" x2="686" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <path d="M686 153 L700 160 L686 167 Z" fill="#0b0b0b"/>
  <circle cx="97" cy="160" r="6" fill="#4a3aa7"/>
  <circle cx="269" cy="160" r="6" fill="#256abf"/>
  <circle cx="447" cy="160" r="8" fill="#12805a"/>
  <circle cx="628" cy="160" r="6" fill="#c98500"/>
  <g font-size="12.5" fill="#52514e">
    <text x="24" y="182">passado</text>
    <text x="447" y="184" text-anchor="middle" font-weight="700" fill="#0e6b4b">agora</text>
    <text x="700" y="182" text-anchor="end">futuro</text>
  </g>

  <!-- Imperfeito: uma faixa -->
  <rect x="120" y="200" width="290" height="22" rx="11" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <text x="265" y="216" font-size="13.5" font-weight="700" fill="#1c5cab" text-anchor="middle">protocolava</text>
  <text x="24" y="246" font-size="12.5" fill="#0b0b0b"><tspan font-weight="700">Pretérito imperfeito:</tspan> o fato durava ou se repetia no passado, sem fim marcado.</text>

  <!-- Futuro do pretérito: sai de um ponto do passado -->
  <circle cx="269" cy="286" r="5" fill="#b42727"/>
  <line x1="269" y1="286" x2="398" y2="286" stroke="#b42727" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M398 280 L410 286 L398 292 Z" fill="#b42727"/>
  <text x="424" y="291" font-size="13.5" font-weight="700" fill="#b42727">protocolaria</text>
  <text x="24" y="316" font-size="12.5" fill="#0b0b0b"><tspan font-weight="700">Futuro do pretérito:</tspan> o que viria depois de um fato passado; também hipótese, polidez e dúvida.</text>

  <!-- Frase-exemplo -->
  <g transform="translate(12 340)">
    <rect width="696" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text font-size="13.5" fill="#0b0b0b">
      <tspan x="20" y="26">Quando a fiscal <tspan font-weight="700" fill="#1c5cab">chegou</tspan>, o arquiteto já <tspan font-weight="700" fill="#4a3aa7">protocolara</tspan> o pedido.</tspan>
      <tspan x="20" dy="20" fill="#52514e">Dois fatos passados: primeiro o protocolo (mais-que-perfeito), depois a chegada (perfeito).</tspan>
      <tspan x="20" dy="20">Ele <tspan font-weight="700" fill="#1c5cab">avisou</tspan> que <tspan font-weight="700" fill="#b42727">protocolaria</tspan> o pedido: <tspan fill="#52514e">o protocolo viria depois do aviso.</tspan></tspan>
    </text>
  </g>
</svg>
