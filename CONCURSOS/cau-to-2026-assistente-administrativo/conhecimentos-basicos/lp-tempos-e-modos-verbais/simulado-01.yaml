  - id: q08
    topico: conhecimentos-basicos/lp-tempos-e-modos-verbais
    enunciado: |-
      Texto para o item: relato fictício, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Na semana passada, a assistente Marta encontrou na recepção um
      > 2. envelope que alguém deixara sobre o balcão. Ela conferia a lista
      > 3. de visitantes quando o telefone tocou: era o arquiteto que havia
      > 4. esquecido os documentos. Marta pediu que ele viesse buscá-los no
      > 5. mesmo dia, pois o setor fecharia mais cedo. Ele veio à tarde,
      > 6. agradeceu e contou que já tinha entregado uma cópia ao fiscal.
      > 7. Desde então, os colegas dizem que Marta resolve qualquer problema
      > 8. e pedem que ela treine os novos atendentes.

      Com base no texto e em seus aspectos gramaticais, julgue o item.

      No trecho “um envelope que alguém deixara sobre o balcão” (linhas 1 e 2), a substituição de “deixara” por “tinha deixado” manteria a correção gramatical e o sentido original.
