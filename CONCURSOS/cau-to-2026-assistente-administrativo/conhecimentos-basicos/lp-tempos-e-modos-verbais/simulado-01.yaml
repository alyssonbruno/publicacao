# Treino de emprego de tempos e modos verbais — CAU/TO 2026, Assistente Administrativo. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Emprego de tempos e modos verbais
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre dois textos próprios e fictícios (um comunicado de um conselho
      profissional e um relato), no estilo de certo ou errado do Instituto Quadrix: a forma verbal
      entre aspas, com remissão à linha, e uma afirmação por item sobre o verbo, o tempo ou o modo
      da forma, a troca de tempo e a correlação verbal em reescrita.'
    - 'Referências de estilo, sem cópia de itens: caderno de Assistente Administrativo do CAU/TO 2023
      (Instituto Quadrix) e itens da Quadrix de 2016 a 2024 sobre flexão verbal de tempo e de modo
      e sobre verbos listados no Aprova Concursos.'
    - 'Bases do gabarito: Gotas da Língua Portuguesa nº 40 e nº 66 (TJMG); Blog da Dad, Correio
      Braziliense (futuro do subjuntivo e verbos abundantes); Gramatigalhas, Migalhas (consecução
      dos tempos verbais, “Vir” e futuro do pretérito); Só Português (modos, tempos, formação do
      imperativo e tempos compostos); InfoEscola (modo indicativo e modo subjuntivo); Dicio (“se
      eu ver ou se eu vir”). Consultados em 10/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-tempos-e-modos-verbais
    enunciado: |-
      Texto para o item: comunicado fictício de um conselho profissional, com as linhas numeradas.

      > **Texto I**
      >
      > 1. O Conselho informa que o novo portal de serviços entrará no ar na
      > 2. segunda-feira. Quem mantiver o cadastro atualizado receberá a senha
      > 3. por e-mail; quem não o fizer deverá comparecer à sede. Se o sistema
      > 4. ficar indisponível, o profissional poderá protocolar o pedido no
      > 5. balcão. Caso a equipe técnica intervenha a tempo, a espera será
      > 6. curta. Guarde o número do protocolo e não o informe a terceiros.
      > 7. Os profissionais que virem mensagens suspeitas devem avisar o
      > 8. setor de atendimento. Gostaríamos de contar com a colaboração de
      > 9. todos para que a mudança ocorra sem transtornos.

      Com base no texto e em seus aspectos gramaticais, julgue o item.

      No trecho “Quem mantiver o cadastro atualizado receberá a senha” (linha 2), a substituição de “mantiver” por “manter” preservaria a correção gramatical.
