<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="384" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" font-weight="700" fill="#0b0b0b">Certidões emitidas pelo portal de um conselho profissional, por mês</text>
  <text x="24" y="56" font-size="13.5" fill="#52514e">1º semestre de 2025 (dados fictícios)</text>

  <!-- Eixo vertical: de 0 a 500 certidões -->
  <text x="24" y="76" font-size="12" fill="#52514e">nº de certidões</text>
  <g stroke="#e1e0d9">
    <line x1="70" y1="90" x2="700" y2="90"/>
    <line x1="70" y1="134" x2="700" y2="134"/>
    <line x1="70" y1="178" x2="700" y2="178"/>
    <line x1="70" y1="222" x2="700" y2="222"/>
    <line x1="70" y1="266" x2="700" y2="266"/>
  </g>
  <line x1="70" y1="310" x2="700" y2="310" stroke="#8a8880"/>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="62" y="94">500</text>
    <text x="62" y="138">400</text>
    <text x="62" y="182">300</text>
    <text x="62" y="226">200</text>
    <text x="62" y="270">100</text>
    <text x="62" y="314">0</text>
  </g>

  <!-- A linha: 300, 350, 320, 400, 450, 450 -->
  <polyline points="110,178 222,156 334,169.2 446,134 558,112 670,112" fill="none" stroke="#4a3aa7" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#4a3aa7" stroke="#ffffff" stroke-width="2">
    <circle cx="110" cy="178" r="6"/>
    <circle cx="222" cy="156" r="6"/>
    <circle cx="334" cy="169.2" r="6"/>
    <circle cx="446" cy="134" r="6"/>
    <circle cx="558" cy="112" r="6"/>
    <circle cx="670" cy="112" r="6"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="110" y="164">300</text>
    <text x="222" y="142">350</text>
    <text x="334" y="196">320</text>
    <text x="446" y="120">400</text>
    <text x="558" y="98">450</text>
    <text x="670" y="98">450</text>
  </g>

  <!-- Eixo horizontal: os meses -->
  <g font-size="13" fill="#52514e" text-anchor="middle">
    <text x="110" y="332">jan.</text>
    <text x="222" y="332">fev.</text>
    <text x="334" y="332">mar.</text>
    <text x="446" y="332">abr.</text>
    <text x="558" y="332">maio</text>
    <text x="670" y="332">jun.</text>
  </g>
  <text x="24" y="368" font-size="12" fill="#6e6c67">Fonte: dados fictícios, criados para esta aula. Unidade: número de certidões por mês.</text>
</svg>
