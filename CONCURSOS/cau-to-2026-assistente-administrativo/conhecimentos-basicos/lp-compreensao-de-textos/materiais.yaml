materiais:
  - tipo: texto
    titulo: Compreensão e interpretação de textos variados, digitais e multimodais
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: PERFIL DA BANCA QUADRIX
    url: https://www.youtube.com/watch?v=o8Wfty00Qk0
    autor: Professora Flávia Rita (canal no YouTube)
    duracao_min: 96
    descricao: >-
      Aula ao vivo de junho de 2026, sem capítulos. Pela descrição do vídeo, analisa o perfil da
      Quadrix com questões objetivas de Língua Portuguesa comentadas e lista, entre os assuntos,
      interpretação de textos, gramática aplicada e estratégias de resolução. A descrição não
      menciona textos digitais, gráficos nem tabelas: esses pontos estão no texto da aula.
  - tipo: video
    titulo: Acerte as questões de INTERPRETAÇÃO DE TEXTO com estes 4 passos
    url: https://www.youtube.com/watch?v=z0PX0-KjI6U
    autor: Prof. Álvaro Ferreira (canal no YouTube)
    duracao_min: 59
    descricao: >-
      Aula de março de 2026, sem capítulos. Pela descrição do vídeo, apresenta quatro passos para
      resolver questões de interpretação de texto em provas de concurso. A descrição não cita a
      Quadrix nem o formato de certo ou errado: treine os passos com os itens do tópico.
  - tipo: podcast
    titulo: Por que você erra interpretação (não é português)
    url: https://podcasts.apple.com/br/podcast/por-que-voc%C3%AA-erra-interpreta%C3%A7%C3%A3o-n%C3%A3o-%C3%A9-portugu%C3%AAs/id1516650122?i=1000774465260
    autor: Mente de Concurseiro (podcast)
    duracao_min: 18
    descricao: >-
      Episódio de junho de 2026. Pela descrição, traz cinco ferramentas de leitura de prova para
      concursos de nível médio (entre elas, o que ler antes do texto, as palavras de intensidade e o
      mapa do texto) e uma questão resolvida. A descrição cita tribunais e a FCC, não a Quadrix.
