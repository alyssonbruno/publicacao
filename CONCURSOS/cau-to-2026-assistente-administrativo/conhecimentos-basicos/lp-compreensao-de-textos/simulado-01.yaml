  - id: q09
    topico: conhecimentos-basicos/lp-compreensao-de-textos
    enunciado: |-
      Considere a notícia a seguir, publicada no site de um conselho profissional.

      > O Conselho lançou, em março de 2026, o programa Portas Abertas, que leva orientação sobre registro profissional a municípios do interior. A primeira etapa, encerrada em junho, passou por seis cidades e atendeu 480 profissionais. A segunda etapa, prevista para o segundo semestre, deve alcançar outras oito cidades. Segundo a coordenação, a iniciativa foi criada em resposta ao resultado de uma pesquisa interna de 2025, que apontou a distância da capital como a principal dificuldade dos profissionais do interior.

      Com base na notícia, julgue o item.

      Depreende-se do texto que, de acordo com a coordenação, a criação do programa foi motivada pelo resultado de uma pesquisa feita no âmbito do próprio Conselho.
  - id: q10
    topico: conhecimentos-basicos/lp-compreensao-de-textos
    enunciado: |-
      Considere a notícia a seguir, publicada no site de um conselho profissional.

