# Treino do tópico. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Compreensão e interpretação de textos variados, digitais e multimodais
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, no formato de certo ou errado do Instituto Quadrix (itens vinculados a um
      comando, uma afirmação por item). Os textos-base (e-mail, post, tabela e notícia) foram escritos
      para este treino; o órgão, os programas e os dados são fictícios.'
    - 'Referência de estilo, sem reprodução de itens: prova de Assistente Administrativo do CAU/TO
      (Instituto Quadrix, 2023), https://www.pciconcursos.com.br/provas/download/assistente-administrativo-cau-to-quadrix-2023'
    - 'Base teórica: Rafaela Freitas, "Dicas de Interpretação textual – Português para
      iniciantes" (Estratégia Concursos, 2017), para os erros de extrapolação, redução e contradição;
      Bruno Quintela, "Transforme imagens em pontos: domine gêneros multimodais para o ENEM"
      (Descomplica, 2026), para a leitura de tabelas e gráficos.'
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-compreensao-de-textos
    enunciado: |-
      Considere o e-mail a seguir, enviado por um conselho profissional aos profissionais registrados.

      > **Assunto:** Alteração no atendimento presencial a partir de 3 de novembro
      >
      > Prezados profissionais registrados,
      >
      > Informamos que, a partir de 3 de novembro, o atendimento presencial na sede do Conselho passará a ocorrer das 9h às 15h, de segunda a sexta-feira, exclusivamente mediante agendamento prévio pelo portal de serviços. A medida decorre da reforma do andar térreo, prevista para durar três meses.
      >
      > O atendimento por e-mail e por telefone não sofrerá alteração. Os pedidos de registro e de emissão de certidões continuam disponíveis no portal, a qualquer hora.
      >
      > Agradecemos a compreensão.
      >
      > Setor de Atendimento

      Com base no e-mail, julgue o item.

      De acordo com a mensagem, a partir de 3 de novembro, o atendimento presencial na sede dependerá de agendamento feito previamente pelo portal de serviços.
