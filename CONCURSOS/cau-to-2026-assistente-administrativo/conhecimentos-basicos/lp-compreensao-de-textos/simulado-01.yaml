  - id: q04
    topico: conhecimentos-basicos/lp-compreensao-de-textos
    enunciado: |-
      Considere a postagem a seguir, publicada no perfil de um conselho profissional em uma rede social.

      > Atenção, profissional! Termina nesta sexta, 30/10, o prazo de inscrição no curso gratuito de elaboração de laudos. São 40 vagas, preenchidas por ordem de inscrição. O formulário está no link da bio. Dúvidas? Chame a gente no direto. #capacitação

      Com base na postagem, julgue o item.

      Expressões como “Chame a gente” e “link da bio” conferem à postagem um registro mais informal do que o esperado em um ofício.
  - id: q05
    topico: conhecimentos-basicos/lp-compreensao-de-textos
    enunciado: |-
      Considere a postagem a seguir, publicada no perfil de um conselho profissional em uma rede social.

      > Atenção, profissional! Termina nesta sexta, 30/10, o prazo de inscrição no curso gratuito de elaboração de laudos. São 40 vagas, preenchidas por ordem de inscrição. O formulário está no link da bio. Dúvidas? Chame a gente no direto. #capacitação

      Com base na postagem, julgue o item.

      Depreende-se da postagem que a inscrição feita dentro do prazo pode não assegurar vaga no curso, caso o número de inscritos supere o de vagas.
  - id: q06
    topico: conhecimentos-basicos/lp-compreensao-de-textos
    enunciado: |-
      Considere a tabela a seguir, publicada no relatório de gestão de um conselho profissional.

      **Pedidos de registro profissional em 2025, por trimestre**

      | Trimestre | Pedidos recebidos | Pedidos concluídos | Prazo médio de conclusão (em dias) |
      |---|---|---|---|
      | 1º | 200 | 150 | 20 |
      | 2º | 250 | 200 | 18 |
      | 3º | 240 | 240 | 15 |
      | 4º | 300 | 270 | 12 |

      Fonte: Setor de Registro, Relatório de Gestão 2025.

      Com base na tabela, julgue o item.

      O número de pedidos de registro recebidos aumentou a cada trimestre de 2025.
