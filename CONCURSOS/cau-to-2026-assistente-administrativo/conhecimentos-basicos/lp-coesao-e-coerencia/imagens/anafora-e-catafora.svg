<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a3aa7"/>
    </marker>
  </defs>
  <rect width="720" height="356" fill="#ffffff"/>

  <!-- Legenda das cores -->
  <g font-size="13" fill="#52514e">
    <rect x="12" y="12" width="24" height="18" rx="4" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="44" y="26">palavra que aponta</text>
    <rect x="182" y="12" width="24" height="18" rx="4" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="214" y="26">termo a que ela se refere</text>
  </g>

  <!-- Anáfora: aponta para trás -->
  <g transform="translate(12 44)">
    <rect width="696" height="146" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="20" y="62" font-size="18" font-weight="700" fill="#0b0b0b">Anáfora</text>
    <text font-size="13" fill="#52514e">
      <tspan x="20" y="84">retoma o que</tspan>
      <tspan x="20" dy="18"><tspan font-weight="600" fill="#0b0b0b">já foi dito</tspan></tspan>
    </text>
    <line x1="152" y1="16" x2="152" y2="130" stroke="#e1e0d9"/>
    <path d="M419 74 C 419 28, 219 28, 219 70" fill="none" stroke="#4a3aa7" stroke-width="2" marker-end="url(#ponta)"/>
    <text x="319" y="30" font-size="12.5" font-weight="600" fill="#4a3aa7" text-anchor="middle">aponta para trás</text>
    <g font-size="16" font-weight="600">
      <rect x="172" y="76" width="94" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="219" y="100" fill="#1c5cab" text-anchor="middle">A fiscal</text>
      <text x="276" y="100" fill="#0b0b0b" font-weight="400">chegou cedo.</text>
      <rect x="392" y="76" width="54" height="36" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="419" y="100" fill="#8a5a00" text-anchor="middle">Ela</text>
      <text x="456" y="100" fill="#0b0b0b" font-weight="400">trouxe os relatórios.</text>
    </g>
  </g>

  <!-- Catáfora: aponta para a frente -->
  <g transform="translate(12 198)">
    <rect width="696" height="146" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="20" y="62" font-size="18" font-weight="700" fill="#0b0b0b">Catáfora</text>
    <text font-size="13" fill="#52514e">
      <tspan x="20" y="84">anuncia o que</tspan>
      <tspan x="20" dy="18"><tspan font-weight="600" fill="#0b0b0b">ainda vai ser dito</tspan></tspan>
    </text>
    <line x1="152" y1="16" x2="152" y2="130" stroke="#e1e0d9"/>
    <path d="M305 74 C 305 28, 512 28, 512 70" fill="none" stroke="#4a3aa7" stroke-width="2" marker-end="url(#ponta)"/>
    <text x="408" y="30" font-size="12.5" font-weight="600" fill="#4a3aa7" text-anchor="middle">aponta para a frente</text>
    <g font-size="16" font-weight="600">
      <text x="172" y="100" fill="#0b0b0b" font-weight="400">O edital exige</text>
      <rect x="280" y="76" width="50" height="36" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="305" y="100" fill="#8a5a00" text-anchor="middle">isto</text>
      <text x="334" y="100" fill="#0b0b0b" font-weight="400">:</text>
      <rect x="348" y="76" width="328" height="36" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="512" y="100" fill="#1c5cab" text-anchor="middle">diploma e documento com foto</text>
    </g>
  </g>
</svg>
