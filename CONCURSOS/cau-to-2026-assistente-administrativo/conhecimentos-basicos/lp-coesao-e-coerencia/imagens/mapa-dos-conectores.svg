<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="650" fill="#ffffff"/>

  <!-- Legenda das cores -->
  <g font-size="13" fill="#52514e">
    <rect x="12" y="12" width="24" height="18" rx="4" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="44" y="26">ideias em contraste</text>
    <rect x="186" y="12" width="24" height="18" rx="4" fill="#e3edf9" stroke="#1c5cab" stroke-width="1.5"/>
    <text x="218" y="26">o conector fica no motivo</text>
    <rect x="394" y="12" width="24" height="18" rx="4" fill="#fdf1d6" stroke="#8a5a00" stroke-width="1.5"/>
    <text x="426" y="26">o conector fica no resultado</text>
  </g>

  <g transform="translate(12 44)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Adição</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">e</tspan>, nem, além disso, não só… mas também</tspan>
    </text>
  </g>
  <g transform="translate(12 130)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#4a3aa7">Oposição</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">mas</tspan>, porém, contudo, todavia, entretanto,</tspan>
      <tspan x="22" y="67">no entanto</tspan>
    </text>
  </g>
  <g transform="translate(12 216)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#4a3aa7">Concessão</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">embora</tspan>, ainda que, mesmo que, conquanto,</tspan>
      <tspan x="22" y="67">posto que, apesar de</tspan>
    </text>
  </g>
  <g transform="translate(12 302)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#e3edf9" stroke="#1c5cab" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#1c5cab">Causa</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">porque</tspan>, já que, visto que, uma vez que,</tspan>
      <tspan x="22" y="67">porquanto, como (no início), na medida em que</tspan>
    </text>
  </g>
  <g transform="translate(12 388)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#e3edf9" stroke="#1c5cab" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#1c5cab">Explicação</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">pois</tspan> (antes do verbo), porque, que</tspan>
    </text>
  </g>
  <g transform="translate(12 474)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#fdf1d6" stroke="#8a5a00" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#8a5a00">Conclusão</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">portanto</tspan>, logo, por isso, assim,</tspan>
      <tspan x="22" y="67">pois (depois do verbo)</tspan>
    </text>
  </g>
  <g transform="translate(12 560)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#fdf1d6" stroke="#8a5a00" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#8a5a00">Consequência</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">tão… que</tspan>, tanto… que, de modo que</tspan>
    </text>
  </g>
  <g transform="translate(364 44)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Condição</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">se</tspan>, caso, desde que, contanto que,</tspan>
      <tspan x="22" y="67">a menos que</tspan>
    </text>
  </g>
  <g transform="translate(364 130)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Finalidade</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">para que</tspan>, a fim de que, para, a fim de</tspan>
    </text>
  </g>
  <g transform="translate(364 216)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Tempo</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">quando</tspan>, assim que, logo que, depois que,</tspan>
      <tspan x="22" y="67">enquanto</tspan>
    </text>
  </g>
  <g transform="translate(364 302)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Comparação</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">como</tspan>, mais… do que, tanto quanto,</tspan>
      <tspan x="22" y="67">assim como</tspan>
    </text>
  </g>
  <g transform="translate(364 388)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Conformidade</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">conforme</tspan>, segundo, consoante, como</tspan>
    </text>
  </g>
  <g transform="translate(364 474)">
    <rect width="344" height="78" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="0" y="0" width="8" height="78" rx="4" fill="#f1f0ea" stroke="#0b0b0b" stroke-width="1"/>
    <text x="22" y="26" font-size="16" font-weight="700" fill="#0b0b0b">Proporção</text>
    <text font-size="14" fill="#52514e">
      <tspan x="22" y="48"><tspan font-weight="700" fill="#0b0b0b">à medida que</tspan>, à proporção que,</tspan>
      <tspan x="22" y="67">quanto mais… mais</tspan>
    </text>
  </g>
  <g transform="translate(364 560)">
    <rect width="344" height="78" rx="10" fill="#e6f5ee"/>
    <text font-size="13.5" fill="#0f6b4a">
      <tspan x="16" y="24" font-weight="700">Em negrito, o conector-modelo de cada valor.</tspan>
      <tspan x="16" dy="19">Troque o conector do item pelo modelo:</tspan>
      <tspan x="16" dy="19">se a ideia continua a mesma, o valor é esse.</tspan>
    </text>
  </g>
</svg>
