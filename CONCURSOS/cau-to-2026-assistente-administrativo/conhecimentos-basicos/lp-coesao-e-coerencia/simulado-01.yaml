  - id: q08
    topico: conhecimentos-basicos/lp-coesao-e-coerencia
    enunciado: |-
      Considere o texto a seguir, um comunicado fictício de um conselho profissional, com as linhas numeradas.
      > 1. A partir de novembro, os pedidos de registro serão feitos apenas
      > 2. pelo portal, pois o protocolo em papel será desativado. A mudança
      > 3. preocupa parte dos profissionais, mas a direção garante que
      > 4. ninguém ficará sem atendimento. À medida que os novos pedidos
      > 5. chegarem, a equipe os analisará em ordem de entrada. A sede terá
      > 6. dois computadores e dois atendentes: estes ajudarão quem tiver
      > 7. dificuldade com o sistema. Caso o portal fique fora do ar, o
      > 8. prazo será prorrogado, conforme prevê o regulamento.

      Com relação aos mecanismos de coesão e ao emprego dos conectores no texto, julgue o item.

      A substituição de “pois” (linha 2) por “porquanto” manteria a correção gramatical e o sentido original do período.
