    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: Resumo de Improbidade Administrativa
    url: https://www.youtube.com/watch?v=LkpK6hCClcE
    autor: Prof. Herbert Almeida
    duracao_min: 30
    descricao: >-
      Aula de resumo, de setembro de 2026. Veja inteira depois de ler o texto, com atenção
