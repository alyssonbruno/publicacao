    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: Resumo de Improbidade Administrativa
    url: https://www.youtube.com/watch?v=LkpK6hCClcE
    autor: Prof. Herbert Almeida
    duracao_min: 30
    descricao: >-
      Vídeo publicado em 13/8/2026, depois do fim do julgamento das ADIs 7156 e 7236 no STF
      (1º/7/2026). A página não traz capítulos nem sumário do conteúdo. Veja depois de ler
      o texto; se algo divergir do texto da aula, confira na lei.
  - tipo: video
    titulo: As mudanças na Lei de Improbidade - STF julga ADIs sobre a LIA
    url: https://www.youtube.com/watch?v=dW2AtNltw40
    autor: Prof. Herbert Almeida
    duracao_min: 54
    descricao: >-
      Transmissão ao vivo de 27/6/2026, feita com o julgamento das ADIs ainda em andamento
      no STF. É anterior à sessão final, de 1º/7/2026, e por isso não traz a decisão sobre
      a prescrição (fim do recomeço pela metade e teto de 20 anos). A página não traz
      capítulos nem sumário do conteúdo. Opcional; sobre as decisões do STF, vale o texto
      da aula.
  - tipo: podcast
    titulo: "#EP192 - Supremo na Semana"
    url: https://podcasts.apple.com/br/podcast/ep192-supremo-na-semana/id1572243037?i=1000770326037
    autor: Supremo Tribunal Federal (podcast Supremo na Semana)
    duracao_min: 40
    descricao: >-
      Episódio de 30/5/2026. Ouça de 20:10 a 36:54: o resto do episódio trata de outros
      julgamentos. Pela descrição da página, o bloco é sobre a sessão de 28/5/2026 do julgamento
      das ADIs 7156 e 7236, em que o STF confirmou que só há improbidade com dolo e validou parte
      das mudanças de 2021. É boletim jornalístico do STF, não aula, e cobre só a primeira sessão:
      perda da função, indisponibilidade de bens e prescrição foram decididas depois. Não ouvimos
      o áudio, a informação vem da descrição do episódio; se algo divergir do texto da aula,
      valem o texto e a lei.
  - tipo: podcast
    titulo: "#EP196 - Supremo na Semana"
    url: https://podcasts.apple.com/br/podcast/ep196-supremo-na-semana/id1572243037?i=1000775442479
    autor: Supremo Tribunal Federal (podcast Supremo na Semana)
    duracao_min: 46
    descricao: >-
      Episódio de 4/7/2026. Ouça de 14:32 a 24:10: o resto do episódio trata de outros assuntos.
      Pela descrição da página, o bloco é sobre o fim do julgamento das ADIs 7156 e 7236, em
      1º/7/2026, quando o STF invalidou a regra que reduzia o prazo de prescrição depois de
      interrompido. A descrição não diz se o bloco fala do prazo máximo de 20 anos nem se retoma
      o dolo. É boletim jornalístico do STF, não aula. Não ouvimos o áudio, a informação vem da
      descrição do episódio; se algo divergir do texto da aula, valem o texto e a lei.
