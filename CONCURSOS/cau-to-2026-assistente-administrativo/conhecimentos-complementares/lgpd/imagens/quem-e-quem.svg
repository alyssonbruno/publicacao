<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#ffffff"/>

  <text x="20" y="32" font-size="16" font-weight="700" fill="#1c5cab">Quem é quem na LGPD (art. 5º)</text>
  <text x="20" y="52" font-size="12" fill="#52514e">Exemplo: o cadastro de profissionais de um conselho profissional (autarquia).</text>

  <!-- Linha 1: titular, controlador, operador -->
  <g transform="translate(20 72)">
    <rect width="200" height="96" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="14" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Titular</text>
    <text x="14" y="44" font-size="12" fill="#52514e">art. 5º, V</text>
    <text x="14" y="66" font-size="13" fill="#0b0b0b">pessoa natural dona</text>
    <text x="14" y="84" font-size="13" fill="#0b0b0b">dos dados: a arquiteta</text>
  </g>
  <g transform="translate(260 72)">
    <rect width="200" height="96" rx="10" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="14" y="26" font-size="15" font-weight="700" fill="#1c5cab">Controlador</text>
    <text x="14" y="44" font-size="12" fill="#52514e">art. 5º, VI</text>
    <text x="14" y="66" font-size="13" fill="#0b0b0b"><tspan font-weight="700">decide</tspan> sobre o tratamento:</text>
    <text x="14" y="84" font-size="13" fill="#0b0b0b">o conselho (a entidade)</text>
  </g>
  <g transform="translate(500 72)">
    <rect width="200" height="96" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="14" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Operador</text>
    <text x="14" y="44" font-size="12" fill="#52514e">art. 5º, VII; art. 39</text>
    <text x="14" y="66" font-size="13" fill="#0b0b0b"><tspan font-weight="700">trata em nome</tspan> do</text>
    <text x="14" y="84" font-size="13" fill="#0b0b0b">controlador: a contratada</text>
  </g>
  <line x1="222" y1="120" x2="256" y2="120" stroke="#52514e" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="239" y="110" font-size="11" fill="#52514e" text-anchor="middle">dados</text>
  <line x1="462" y1="120" x2="496" y2="120" stroke="#52514e" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="479" y="110" font-size="11" fill="#52514e" text-anchor="middle">ordens</text>

  <text x="260" y="190" font-size="12" fill="#52514e">Controlador + operador = agentes de tratamento (art. 5º, IX)</text>

  <!-- Linha 2: encarregado e ANPD -->
  <g transform="translate(20 210)">
    <rect width="440" height="96" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="14" y="26" font-size="15" font-weight="700" fill="#0b0b0b">Encarregado</text>
    <text x="110" y="26" font-size="12" fill="#52514e">art. 5º, VIII; art. 41; art. 23, III</text>
    <text x="14" y="50" font-size="13" fill="#0b0b0b">pessoa <tspan font-weight="700">indicada</tspan> pelo controlador e pelo operador, que é o</text>
    <text x="14" y="68" font-size="13" fill="#0b0b0b"><tspan font-weight="700">canal de comunicação</tspan> entre controlador, titulares e ANPD.</text>
    <text x="14" y="86" font-size="13" fill="#0b0b0b">Não é agente de tratamento.</text>
  </g>
  <g transform="translate(500 210)">
    <rect width="200" height="96" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="14" y="26" font-size="15" font-weight="700" fill="#0b0b0b">ANPD</text>
    <text x="14" y="44" font-size="12" fill="#52514e">art. 5º, XIX; art. 55-A</text>
    <text x="14" y="66" font-size="13" fill="#0b0b0b">zela pela lei, <tspan font-weight="700">fiscaliza</tspan></text>
    <text x="14" y="84" font-size="13" fill="#0b0b0b">e aplica sanções</text>
  </g>
  <line x1="462" y1="258" x2="496" y2="258" stroke="#52514e" stroke-width="1.5" marker-start="url(#seta)" marker-end="url(#seta)"/>

  <!-- Nota -->
  <g transform="translate(20 326)">
    <rect width="680" height="84" rx="10" fill="#fdeee6" stroke="#f3c9b4"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#9a3a12">Empregados e servidores não são operadores</text>
    <text x="16" y="48" font-size="13" fill="#0b0b0b">Agem subordinados à organização, que é a controladora. Quem digita o cadastro no</text>
    <text x="16" y="67" font-size="13" fill="#0b0b0b">conselho age em nome do próprio conselho (guia da ANPD sobre agentes de tratamento, 2022).</text>
  </g>
</svg>
