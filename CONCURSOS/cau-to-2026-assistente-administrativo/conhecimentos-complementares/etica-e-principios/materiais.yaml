      função pública" e "Ética no setor público" (os assuntos do item 1.1 deste edital), mas
      também traz as Leis nº 8.666/1993 e nº 10.520/2002, hoje revogadas, e a Lei nº 8.429/1992
      como era antes da reforma de 2021 (Lei nº 14.230/2021). Não use este curso para licitações
      nem para improbidade; em caso de divergência, vale o texto da aula.
