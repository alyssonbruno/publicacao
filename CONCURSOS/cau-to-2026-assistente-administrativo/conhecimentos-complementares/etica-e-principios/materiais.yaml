  - tipo: video
    titulo: ÉTICA - CONHECIMENTOS COMPLEMENTARES | BANCA QUADRIX | AULA 1
    url: https://www.youtube.com/watch?v=IV4CSMFaziM
    autor: Vinicius Elias
    duracao_min: 49
    descricao: >-
      Opcional, e só para a parte de ética. Primeira aula de um curso publicado em 27/07/2020 para
