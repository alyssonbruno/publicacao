    duracao_min: 25
    descricao: Aula curta, boa para uma primeira passada ou para revisão. Veja até o minuto 21. Processo
      administrativo e PODC até o minuto 7; níveis estratégico, tático e operacional do 14 ao 20; o
      restante são questões resolvidas, que não são identificadas como da Quadrix. Do minuto 21 em
      diante, o assunto é outro.
