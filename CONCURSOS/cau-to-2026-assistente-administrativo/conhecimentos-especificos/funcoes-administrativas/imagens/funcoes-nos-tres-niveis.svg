<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="340" fill="#ffffff"/>

  <text x="12" y="26" font-size="14" font-weight="700" fill="#0b0b0b">As quatro funções estão presentes nos três níveis</text>

  <!-- Nível estratégico -->
  <g transform="translate(12 44)">
    <rect width="256" height="80" rx="10" fill="#ece9f8" stroke="#4a3aa7"/>
    <text x="16" y="26" font-size="15" font-weight="700" fill="#4a3aa7">Estratégico <tspan font-size="12.5" font-weight="400" fill="#52514e">(ou institucional)</tspan></text>
    <text x="16" y="48" font-size="13" fill="#0b0b0b">diretores · longo prazo</text>
    <text x="16" y="67" font-size="13" fill="#52514e">a organização inteira</text>
  </g>
  <!-- Nível tático -->
  <g transform="translate(12 132)">
    <rect width="256" height="80" rx="10" fill="#e3edf9" stroke="#256abf"/>
    <text x="16" y="26" font-size="15" font-weight="700" fill="#1c5cab">Tático <tspan font-size="12.5" font-weight="400" fill="#52514e">(ou intermediário, gerencial)</tspan></text>
    <text x="16" y="48" font-size="13" fill="#0b0b0b">gerentes · médio prazo</text>
    <text x="16" y="67" font-size="13" fill="#52514e">cada área</text>
  </g>
  <!-- Nível operacional -->
  <g transform="translate(12 220)">
    <rect width="256" height="80" rx="10" fill="#fdf1d6" stroke="#c98500"/>
    <text x="16" y="26" font-size="15" font-weight="700" fill="#8a5a00">Operacional</text>
    <text x="16" y="48" font-size="13" fill="#0b0b0b">supervisores · curto prazo</text>
    <text x="16" y="67" font-size="13" fill="#52514e">as tarefas do dia a dia</text>
  </g>

  <!-- As quatro funções, iguais em cada nível -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <g transform="translate(280 64)">
      <rect x="0" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="51" y="25" fill="#1c5cab">Planejamento</text>
      <rect x="109" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="160" y="25" fill="#127a55">Organização</text>
      <rect x="217" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="268" y="25" fill="#b42727">Direção</text>
      <rect x="326" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="377" y="25" fill="#4a3aa7">Controle</text>
    </g>
    <g transform="translate(280 152)">
      <rect x="0" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="51" y="25" fill="#1c5cab">Planejamento</text>
      <rect x="109" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="160" y="25" fill="#127a55">Organização</text>
      <rect x="217" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="268" y="25" fill="#b42727">Direção</text>
      <rect x="326" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="377" y="25" fill="#4a3aa7">Controle</text>
    </g>
    <g transform="translate(280 240)">
      <rect x="0" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="51" y="25" fill="#1c5cab">Planejamento</text>
      <rect x="109" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="160" y="25" fill="#127a55">Organização</text>
      <rect x="217" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="268" y="25" fill="#b42727">Direção</text>
      <rect x="326" width="102" height="40" rx="20" fill="#fcfcfb" stroke="#c3c2b7"/>
      <text x="377" y="25" fill="#4a3aa7">Controle</text>
    </g>
  </g>

  <text x="12" y="326" font-size="13" fill="#52514e">O que muda é o peso e o alcance de cada uma: nenhuma função é exclusiva de um nível.</text>
</svg>
