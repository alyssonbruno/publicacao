<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="424" fill="#ffffff"/>
  <!-- Eixo x: mês 0 em x=170, 52 px por mês (mês 10 em x=690). Eixo y: 0 resmas em y=340, 2,4 px por resma (100 em y=100). -->

  <text x="16" y="26" font-size="14" font-weight="700" fill="#0b0b0b">Estoque de papel A4 ao longo do tempo (em resmas)</text>

  <!-- Eixos -->
  <line x1="170" y1="70" x2="170" y2="340" stroke="#8a8880" stroke-width="1.5"/>
  <line x1="170" y1="340" x2="700" y2="340" stroke="#8a8880" stroke-width="1.5"/>

  <!-- Níveis -->
  <g stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="170" y1="100" x2="700" y2="100" stroke="#256abf"/>
    <line x1="170" y1="196" x2="700" y2="196" stroke="#eb6834"/>
    <line x1="170" y1="292" x2="700" y2="292" stroke="#127a55"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="end">
    <text x="160" y="98" fill="#1c5cab">Estoque máximo</text>
    <text x="160" y="194" fill="#b84a1c">Ponto de pedido</text>
    <text x="160" y="290" fill="#127a55">Estoque mínimo</text>
  </g>
  <g font-size="12.5" text-anchor="end" fill="#52514e">
    <text x="160" y="114">100 resmas</text>
    <text x="160" y="210">60 resmas</text>
    <text x="160" y="306">20 resmas</text>
    <text x="160" y="344">0</text>
  </g>

  <!-- Faixa do estoque mínimo (reserva) -->
  <rect x="170" y="292" width="530" height="48" fill="#1baf7a" fill-opacity="0.10"/>
  <text x="694" y="322" font-size="12" fill="#127a55" text-anchor="end">reserva: em condições normais, não é usada</text>

  <!-- Dente de serra -->
  <polyline points="170,100 378,292 378,100 586,292 586,100 690,196" fill="none" stroke="#0b0b0b" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="196" y="92" font-size="12" fill="#52514e">consumo: 20 resmas por mês</text>

  <!-- Pedidos de compra (estoque chega ao ponto de pedido) -->
  <g fill="#eb6834" stroke="#ffffff" stroke-width="2">
    <circle cx="274" cy="196" r="6.5"/>
    <circle cx="482" cy="196" r="6.5"/>
    <circle cx="690" cy="196" r="6.5"/>
  </g>
  <g font-size="12" font-weight="600" fill="#b84a1c" text-anchor="end">
    <text x="262" y="216">pedido</text>
    <text x="262" y="231">de compra</text>
    <text x="470" y="216">pedido</text>
    <text x="470" y="231">de compra</text>
  </g>

  <!-- Chegada das compras -->
  <g font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="end">
    <text x="370" y="140">chegam</text>
    <text x="370" y="156">80 resmas</text>
    <text x="578" y="140">chegam</text>
    <text x="578" y="156">80 resmas</text>
  </g>

  <!-- Marcas dos meses -->
  <g stroke="#8a8880" stroke-width="1.5">
    <line x1="170" y1="340" x2="170" y2="346"/>
    <line x1="274" y1="340" x2="274" y2="346"/>
    <line x1="378" y1="340" x2="378" y2="346"/>
    <line x1="482" y1="340" x2="482" y2="346"/>
    <line x1="586" y1="340" x2="586" y2="346"/>
    <line x1="690" y1="340" x2="690" y2="346"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="170" y="361">mês 0</text>
    <text x="274" y="361">mês 2</text>
    <text x="378" y="361">mês 4</text>
    <text x="482" y="361">mês 6</text>
    <text x="586" y="361">mês 8</text>
    <text x="690" y="361">mês 10</text>
  </g>

  <!-- Tempo de aquisição (T) e intervalo de aquisição (I) -->
  <g stroke="#eb6834" stroke-width="2">
    <line x1="274" y1="378" x2="378" y2="378"/>
    <line x1="274" y1="372" x2="274" y2="384"/>
    <line x1="378" y1="372" x2="378" y2="384"/>
  </g>
  <text x="326" y="398" font-size="12" fill="#b84a1c" text-anchor="middle" font-weight="600">T = 2 meses</text>
  <text x="326" y="413" font-size="11.5" fill="#52514e" text-anchor="middle">do pedido à entrega</text>
  <g stroke="#256abf" stroke-width="2">
    <line x1="382" y1="378" x2="586" y2="378"/>
    <line x1="382" y1="372" x2="382" y2="384"/>
    <line x1="586" y1="372" x2="586" y2="384"/>
  </g>
  <text x="484" y="398" font-size="12" fill="#1c5cab" text-anchor="middle" font-weight="600">I = 4 meses</text>
  <text x="484" y="413" font-size="11.5" fill="#52514e" text-anchor="middle">de uma compra à seguinte</text>
</svg>
