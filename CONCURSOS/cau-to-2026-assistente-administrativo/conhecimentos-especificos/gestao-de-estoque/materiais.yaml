  - tipo: video
    titulo: 03.01. Aula de Noções de Gestão de Estoques (Administração de Recursos Materiais)
    url: https://www.youtube.com/watch?v=dHoegcRIJfc
    autor: TecConcursos
    duracao_min: 27
    descricao: >-
      Aula gravada, de janeiro de 2024. Pela descrição da página, trata da definição de estoque,
      do fluxo, das funções e dos tipos de estoque: serve de introdução. Níveis de estoque, ponto
      de pedido e inventário não estão na descrição desta aula; estude-os pelo texto.
  - tipo: podcast
    titulo: "Logística de suprimentos no contexto da produção | Episódio 12 - Conhecimento técnico e classificação da curva ABC"
    url: https://podcasters.spotify.com/pod/show/senai-play/episodes/Logstica-de-suprimentos-no-contexto-da-produo-Episdio-12---Conhecimento-tcnico-e-classificao-da-curva-ABC-e2guad8
