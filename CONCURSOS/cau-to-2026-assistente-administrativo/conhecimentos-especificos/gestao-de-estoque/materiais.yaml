    autor: SENAI Play (podcast)
    duracao_min: 14
    descricao: >-
      Episódio de março de 2024. Pela descrição da página, mostra como a curva ABC é aplicada e
      por que o conhecimento técnico importa para que a classificação não comprometa o estoque de
      itens críticos. O contexto é de indústria, e não de órgão público, e a descrição não diz se
      o episódio dá os percentuais das classes: para eles, vale o texto da aula.
  - tipo: podcast
    titulo: "O \"mundo perfeito\" do Almoxarifado | Episódio 10 - Gestão de Estoque"
