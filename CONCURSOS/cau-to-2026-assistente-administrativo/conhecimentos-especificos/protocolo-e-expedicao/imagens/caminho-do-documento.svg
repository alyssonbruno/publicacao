<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d3c39"/>
    </marker>
    <marker id="seta-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06f00"/>
    </marker>
  </defs>

  <text x="14" y="26" font-size="15" font-weight="700" fill="#0b0b0b">O caminho do documento no protocolo</text>

  <!-- Entrada -->
  <text x="14" y="56" font-size="13" font-weight="700" fill="#256abf">ENTRADA — o documento que chega ao órgão</text>

  <rect x="14" y="68" width="132" height="64" rx="8" fill="#e3edf9" stroke="#256abf"/>
  <text x="80" y="92" font-size="11" fill="#52514e" text-anchor="middle">1</text>
  <text x="80" y="108" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Recebimento</text>
  <text x="80" y="124" font-size="11" fill="#3d3c39" text-anchor="middle">confere e separa</text>

  <rect x="164" y="68" width="132" height="64" rx="8" fill="#e3edf9" stroke="#256abf"/>
  <text x="230" y="92" font-size="11" fill="#52514e" text-anchor="middle">2</text>
  <text x="230" y="108" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Classificação</text>
  <text x="230" y="124" font-size="11" fill="#3d3c39" text-anchor="middle">código do assunto</text>

  <rect x="314" y="68" width="132" height="64" rx="8" fill="#dff3ea" stroke="#137a55" stroke-width="2"/>
  <text x="380" y="92" font-size="11" fill="#52514e" text-anchor="middle">3</text>
  <text x="380" y="108" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Registro</text>
  <text x="380" y="124" font-size="11" fill="#3d3c39" text-anchor="middle">dados e NUP</text>

  <rect x="464" y="68" width="132" height="64" rx="8" fill="#e3edf9" stroke="#256abf"/>
  <text x="530" y="92" font-size="11" fill="#52514e" text-anchor="middle">4</text>
  <text x="530" y="108" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Distribuição</text>
  <text x="530" y="124" font-size="11" fill="#3d3c39" text-anchor="middle">1ª tramitação, interna</text>

  <rect x="614" y="68" width="132" height="64" rx="8" fill="#e3edf9" stroke="#256abf"/>
  <text x="680" y="92" font-size="11" fill="#52514e" text-anchor="middle">5</text>
  <text x="680" y="108" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Tramitação</text>
  <text x="680" y="124" font-size="11" fill="#3d3c39" text-anchor="middle">controle: onde está</text>

  <line x1="146" y1="100" x2="162" y2="100" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="296" y1="100" x2="312" y2="100" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="446" y1="100" x2="462" y2="100" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="596" y1="100" x2="612" y2="100" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Destaque: registro antes da distribuição -->
  <path d="M380,132 L380,150 L530,150 L530,132" fill="none" stroke="#137a55" stroke-width="2"/>
  <rect x="300" y="158" width="310" height="44" rx="6" fill="#dff3ea" stroke="#137a55"/>
  <text x="455" y="176" font-size="12" font-weight="700" fill="#0e5c40" text-anchor="middle">Primeiro registra, depois distribui</text>
  <text x="455" y="193" font-size="11" fill="#0e5c40" text-anchor="middle">sem registro, o documento não tramita (item 2.3)</text>

  <!-- Saída -->
  <text x="14" y="244" font-size="13" font-weight="700" fill="#7a4d00">SAÍDA — o documento que o órgão envia (expedição)</text>

  <rect x="14" y="256" width="170" height="64" rx="8" fill="#fdf1d6" stroke="#b06f00"/>
  <text x="99" y="282" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Setor de origem</text>
  <text x="99" y="300" font-size="11" fill="#3d3c39" text-anchor="middle">classifica e registra</text>

  <rect x="201" y="256" width="170" height="64" rx="8" fill="#fdf1d6" stroke="#b06f00"/>
  <text x="286" y="282" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Protocolo confere</text>
  <text x="286" y="300" font-size="10.5" fill="#3d3c39" text-anchor="middle">registro, classificação e anexos</text>

  <rect x="388" y="256" width="170" height="64" rx="8" fill="#fdf1d6" stroke="#b06f00"/>
  <text x="473" y="282" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Registra a expedição</text>
  <text x="473" y="300" font-size="11" fill="#3d3c39" text-anchor="middle">no sistema ou formulário</text>

  <rect x="575" y="256" width="171" height="64" rx="8" fill="#fdf1d6" stroke="#b06f00"/>
  <text x="660" y="282" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Envia</text>
  <text x="660" y="300" font-size="11" fill="#3d3c39" text-anchor="middle">invólucro com etiqueta</text>

  <line x1="184" y1="288" x2="199" y2="288" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="371" y1="288" x2="386" y2="288" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="558" y1="288" x2="573" y2="288" stroke="#3d3c39" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Devolução -->
  <path d="M286,320 L286,346 L99,346 L99,324" fill="none" stroke="#b06f00" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#seta-laranja)"/>
  <text x="192" y="364" font-size="11" fill="#7a4d00" text-anchor="middle">falha? volta ao setor para corrigir</text>

  <text x="14" y="396" font-size="11.5" fill="#52514e">Distribuição leva o documento para dentro do órgão; expedição, para fora. O protocolo não arquiva:</text>
  <text x="14" y="414" font-size="11.5" fill="#52514e">o arquivamento é da área de arquivo. Base: Anexo da Portaria Interministerial nº 1.677/2015, itens 2 a 2.4 e 3.4.</text>
</svg>
