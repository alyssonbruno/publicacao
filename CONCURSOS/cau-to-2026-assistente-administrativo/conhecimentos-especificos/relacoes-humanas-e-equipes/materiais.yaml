materiais:
  - tipo: texto
    titulo: 'Relações humanas, equipes, cidadania e relações públicas'
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: podcast
    titulo: INTRODUÇÃO ADM 1ª TEMPORADA 2021 - E5 (abordagem humanista)
    url: https://podcasts.apple.com/br/podcast/introdu%C3%A7%C3%A3o-adm-1%C2%AA-temporada-2021-e5/id1559332193?i=1000519327222
    audio: https://anchor.fm/s/51eac0e4/podcast/play/32518785/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2021-04-30%2Fd3f74aaaf7a211c32a0011dda505ac0c.m4a
    autor: Angela Rita Pedrollo Guerrero (podcast Introdução Administração)
    duracao_min: 11
    descricao: >-
      Episódio de 30/04/2021, para o item 2.2 do edital: a passagem da ênfase na tarefa para as
      pessoas, as quatro fases de Hawthorne, as conclusões e as críticas à escola de relações
      humanas (seções 2 a 4 do texto). Ouça depois de ler o texto. Três avisos: a fábrica de
      Hawthorne ficava em Cicero, Illinois, vizinha de Chicago, e não "em Chicago"; a supervisão
      branda e o ambiente amistoso, que o áudio atribui primeiro à "primeira fase", são
      conclusões da sala de montagem de relés (fase 2), como ele mesmo corrige logo depois; e o
      áudio diz que a escola "surgiu em 1929", mas, para a prova, guarde Mayo e 1927 a 1932.
  - tipo: podcast
    titulo: Você sabe a diferença entre grupo e equipe? (Brasil FM 107,7)
    url: https://podcasts.apple.com/br/podcast/voc%C3%AA-sabe-a-diferen%C3%A7a-entre-grupo-e-equipe-brasil-fm-107-7/id1538449500?i=1000496934603
    audio: https://anchor.fm/s/3d5d5aec/podcast/play/21884880/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2F2020-9-27%2F122524111-44100-2-17b54e67c0e35.mp3
    autor: Pollyanna Pedreira (podcast Aprendizagens em Liderança)
    duracao_min: 4
    descricao: >-
      Coluna de rádio de 30/10/2020, para o item 2.3 do edital: a diferença entre grupo e equipe,
      com o exemplo do time de futebol (equipe) e da torcida (grupo), e a sinergia que faz o
      resultado da equipe maior que a soma das partes (seção 7 do texto). Curto e sem erro de
      conceito; não trata dos estágios de desenvolvimento da equipe.
  - tipo: podcast
    titulo: O QUE É CIDADANIA? | História e Política #5 (Historiar-Se)
    url: https://podcasts.apple.com/br/podcast/o-que-%C3%A9-cidadania-hist%C3%B3ria-e-pol%C3%ADtica-5/id1514219350?i=1000488859087
    audio: https://anchor.fm/s/206a3f2c/podcast/play/18417147/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2020-7-22%2F100564839-44100-2-bdca7a0d25153.m4a
    autor: Historiar-Se (Anita Natividade Carneiro e Carlos Eduardo Barzotto)
    duracao_min: 11
    descricao: >-
      Episódio de 22/08/2020, para o item 2.4 do edital (noções de cidadania, seção 10 do texto).
      Ouça de 0:25 a 4:48: cidadania como relação com o Estado, com direitos e deveres, e a
      divisão em direitos civis (art. 5º), políticos (art. 14) e sociais (art. 6º), que
      complementa o texto. Dois erros: o art. 5º tem 79 incisos, e não 78, desde a Emenda
      Constitucional nº 115/2022, que incluiu o inciso LXXIX (proteção de dados pessoais); e as
      eleições acontecem de dois em dois anos, alternando as municipais e as gerais, e não "uma
      vez ao ano". O fim do episódio é comentário opinativo e não cai na prova.
