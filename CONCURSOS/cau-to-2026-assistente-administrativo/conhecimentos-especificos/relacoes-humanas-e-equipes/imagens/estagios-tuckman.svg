<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="12" y="26" font-size="14" font-weight="700" fill="#0b0b0b">Estágios de desenvolvimento da equipe</text>
  <text x="12" y="46" font-size="12.5" fill="#52514e">Tuckman (1965): estágios 1 a 4 · Tuckman e Jensen (1977): estágio 5</text>

  <g font-size="12" fill="#0b0b0b" text-anchor="middle">
    <!-- degraus: base em y=290 -->
    <rect x="12"  y="210" width="132" height="80"  rx="6" fill="#e3edf9" stroke="#256abf"/>
    <rect x="150" y="180" width="132" height="110" rx="6" fill="#e3edf9" stroke="#256abf"/>
    <rect x="288" y="150" width="132" height="140" rx="6" fill="#e3edf9" stroke="#256abf"/>
    <rect x="426" y="120" width="132" height="170" rx="6" fill="#256abf"/>
    <rect x="564" y="150" width="144" height="140" rx="6" fill="#fcfcfb" stroke="#8a8880" stroke-dasharray="5 4"/>

    <text x="78"  y="232" font-size="13.5" font-weight="700">1 Formação</text>
    <text x="78"  y="254">incerteza;</text>
    <text x="78"  y="270">testar o terreno</text>

    <text x="216" y="202" font-size="13.5" font-weight="700">2 Tormenta</text>
    <text x="216" y="224">conflitos; disputa</text>
    <text x="216" y="240">por quem lidera;</text>
    <text x="216" y="256">resistência às regras</text>

    <text x="354" y="172" font-size="13.5" font-weight="700">3 Normatização</text>
    <text x="354" y="194">coesão e identidade;</text>
    <text x="354" y="210">regras aceitas</text>
    <text x="354" y="226">por todos</text>

    <text x="492" y="142" font-size="13.5" font-weight="700" fill="#ffffff">4 Desempenho</text>
    <text x="492" y="164" fill="#ffffff">a estrutura funciona;</text>
    <text x="492" y="180" fill="#ffffff">a energia vai</text>
    <text x="492" y="196" fill="#ffffff">para a tarefa</text>

    <text x="636" y="172" font-size="13.5" font-weight="700">5 Dissolução</text>
    <text x="636" y="194">o trabalho termina</text>
    <text x="636" y="210">e o grupo se desfaz</text>
    <text x="636" y="226">(comissões e</text>
    <text x="636" y="242">forças-tarefa)</text>
  </g>

  <text x="360" y="320" font-size="12.5" fill="#0b0b0b" text-anchor="middle">Outros nomes: tempestade, conflito ou confrontação (2); normalização (3); atuação (4);</text>
  <text x="360" y="338" font-size="12.5" fill="#0b0b0b" text-anchor="middle">suspensão, interrupção ou encerramento (5). A ordem é a mesma.</text>
  <text x="360" y="362" font-size="12.5" font-weight="600" fill="#52514e" text-anchor="middle">Crítica: o grupo pode não seguir essa ordem nem passar por todos os estágios.</text>
</svg>
