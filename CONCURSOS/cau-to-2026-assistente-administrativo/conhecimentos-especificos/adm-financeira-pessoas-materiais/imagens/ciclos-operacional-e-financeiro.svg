<svg xmlns="http://www.w3.org/2000/svg" width="720" height="332" viewBox="0 0 720 332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="332" fill="#ffffff"/>
  <!-- Escala: 12 px por dia, do dia 0 (x = 70) ao dia 50 (x = 670). Compra 0, venda 20, pagamento 25, recebimento 50. -->

  <!-- Guias dos quatro momentos -->
  <g stroke="#c3c2b7" stroke-dasharray="4 4">
    <line x1="70" y1="20" x2="70" y2="180"/>
    <line x1="310" y1="60" x2="310" y2="180"/>
    <line x1="370" y1="100" x2="370" y2="180"/>
    <line x1="670" y1="20" x2="670" y2="180"/>
  </g>

  <!-- Os três ciclos -->
  <rect x="70" y="20" width="600" height="30" rx="4" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <text x="82" y="40" font-size="13" font-weight="700" fill="#1c5cab">Ciclo operacional: da compra ao recebimento</text>
  <text x="658" y="40" font-size="13" font-weight="700" fill="#1c5cab" text-anchor="end">20 + 30 = 50 dias</text>

  <rect x="70" y="60" width="240" height="30" rx="4" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
  <text x="82" y="80" font-size="13" font-weight="700" fill="#8a5a00">Ciclo econômico</text>
  <text x="298" y="80" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="end">20 dias</text>

  <rect x="370" y="100" width="300" height="30" rx="4" fill="#fbe3e3" stroke="#d03b3b" stroke-width="1.5"/>
  <text x="382" y="120" font-size="13" font-weight="700" fill="#b42727">Ciclo financeiro</text>
  <text x="658" y="120" font-size="13" font-weight="700" fill="#b42727" text-anchor="end">50 − 25 = 25 dias</text>
  <text x="380" y="150" font-size="12.5" fill="#b42727">a organização já pagou e ainda não recebeu</text>

  <!-- A linha do tempo -->
  <line x1="70" y1="180" x2="670" y2="180" stroke="#8a8880" stroke-width="2"/>
  <g fill="#52514e" stroke="#ffffff" stroke-width="2">
    <circle cx="70" cy="180" r="6"/>
    <circle cx="310" cy="180" r="6"/>
    <circle cx="370" cy="180" r="6"/>
    <circle cx="670" cy="180" r="6"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="70" y="202">dia 0</text>
    <text x="316" y="202" text-anchor="end">dia 20</text>
    <text x="364" y="202" text-anchor="start">dia 25</text>
    <text x="676" y="202" text-anchor="end">dia 50</text>
  </g>
  <g font-size="13" font-weight="700" fill="#0b0b0b">
    <text x="70" y="222" text-anchor="middle">Compra</text>
    <text x="316" y="222" text-anchor="end">Venda</text>
    <text x="364" y="222"><tspan x="364">Pagamento ao</tspan><tspan x="364" dy="16">fornecedor</tspan></text>
    <text x="676" y="222" text-anchor="end"><tspan x="676">Recebimento</tspan><tspan x="676" dy="16">do cliente</tspan></text>
  </g>

  <!-- Os prazos do exemplo -->
  <g stroke="#52514e" stroke-width="1.5" fill="none">
    <path d="M70,264 v-8 M70,260 H310 M310,264 v-8"/>
    <path d="M310,264 v-8 M310,260 H670 M670,264 v-8"/>
    <path d="M70,300 v-8 M70,296 H370 M370,300 v-8"/>
  </g>
  <g font-size="12.5" fill="#52514e" text-anchor="middle">
    <text x="190" y="280">20 dias em estoque</text>
    <text x="490" y="280">o cliente paga 30 dias depois da venda</text>
    <text x="220" y="316">o fornecedor concede 25 dias de prazo</text>
  </g>
</svg>
