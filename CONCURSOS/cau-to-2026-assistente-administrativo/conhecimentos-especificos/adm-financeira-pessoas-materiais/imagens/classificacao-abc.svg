<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="330" fill="#ffffff"/>
  <!-- Barras de 470 px (x = 160 a 630). Itens: A 20%, C 50%. Valor: A 80%, C 5%. B é o resto, sem número no texto. -->

  <!-- Rótulos das barras -->
  <text x="16" y="60" font-size="15" font-weight="700" fill="#0b0b0b">Itens</text>
  <text x="16" y="78" font-size="12.5" fill="#52514e">quantidade</text>
  <text x="16" y="180" font-size="15" font-weight="700" fill="#0b0b0b">Valor</text>
  <text x="16" y="198" font-size="12.5" fill="#52514e">consumido no período</text>

  <!-- Ligações: os mesmos itens, na quantidade e no valor -->
  <path d="M160,84 L254,84 L536,164 L160,164 Z" fill="#256abf" fill-opacity="0.10"/>
  <path d="M254,84 L395,84 L606.5,164 L536,164 Z" fill="#c98500" fill-opacity="0.10"/>
  <path d="M395,84 L630,84 L630,164 L606.5,164 Z" fill="#1baf7a" fill-opacity="0.10"/>

  <!-- Barra dos itens -->
  <rect x="160" y="40" width="94" height="44" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <rect x="254" y="40" width="141" height="44" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
  <rect x="395" y="40" width="235" height="44" fill="#1baf7a" fill-opacity="0.16" stroke="#1baf7a" stroke-width="1.5"/>

  <!-- Barra do valor -->
  <rect x="160" y="164" width="376" height="44" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <rect x="536" y="164" width="70.5" height="44" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
  <rect x="606.5" y="164" width="23.5" height="44" fill="#1baf7a" fill-opacity="0.16" stroke="#1baf7a" stroke-width="1.5"/>

  <!-- Letras e percentuais -->
  <g text-anchor="middle" font-weight="700" font-size="15">
    <text x="207" y="59" fill="#1c5cab">A</text>
    <text x="324.5" y="67" fill="#8a5a00">B</text>
    <text x="512.5" y="59" fill="#127a55">C</text>
    <text x="348" y="183" fill="#1c5cab">A</text>
    <text x="571.25" y="191" fill="#8a5a00">B</text>
    <text x="618.25" y="191" fill="#127a55">C</text>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="207" y="76" fill="#1c5cab">cerca de 20%</text>
    <text x="512.5" y="76" fill="#127a55">cerca de 50%</text>
    <text x="348" y="200" fill="#1c5cab">cerca de 80%</text>
  </g>
  <text x="638" y="190" font-size="12" fill="#127a55">cerca de 5%</text>

  <!-- O que cada classe quer dizer -->
  <g font-size="13.5" fill="#52514e">
    <text x="16" y="248"><tspan font-weight="700" fill="#1c5cab">Classe A:</tspan> poucos itens, que concentram a maior parte do valor. Controle mais rigoroso.</text>
    <text x="16" y="272"><tspan font-weight="700" fill="#8a5a00">Classe B:</tspan> situação intermediária.</text>
    <text x="16" y="296"><tspan font-weight="700" fill="#127a55">Classe C:</tspan> muitos itens, que somam pequena parte do valor. Controle mais simples.</text>
  </g>
  <text x="16" y="320" font-size="12" fill="#52514e">Os percentuais são aproximados, não fixos.</text>
</svg>
