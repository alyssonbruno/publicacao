materiais:
  - tipo: texto
    titulo: Noções de administração financeira, de pessoas e de materiais
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: Gestão de Pessoas - Adm de Recursos Humanos - Conceitos Básicos
    url: https://www.youtube.com/watch?v=2fBypccQLCo
    autor: Rodrigo Rennó
    duracao_min: 41
    descricao: >-
      Teoria e questões comentadas sobre os conceitos básicos de gestão de pessoas, segundo a
      descrição do vídeo. Complementa a seção 2 do texto. A aula não é específica da Quadrix.
  - tipo: video
    titulo: 01. Aula de Noções de Administração de Materiais (Administração de Recursos Materiais)
    url: https://www.youtube.com/watch?v=WSzViE4JOy8
    autor: TecConcursos
    duracao_min: 37
    descricao: >-
      Aula de introdução: o que são recursos e o conceito de administração de materiais, segundo
      a descrição do vídeo. Não trata de classificação, recebimento, armazenagem nem patrimônio,
      que estão na seção 3 do texto.
  - tipo: video
    titulo: "Concurso CRECI/SP: Administração Financeira | Noções de Fluxo de Caixa"
    url: https://www.youtube.com/watch?v=ankhiDpc7V8
    autor: Carranza Cursos
    duracao_min: 46
    descricao: >-
      Gravação de uma aula ao vivo de 21/9/2026, de um curso para assistente administrativo de
      conselho profissional. Segundo a descrição da página, trata só de fluxo de caixa: entradas
      e saídas, saldo de caixa e projeção. Acompanha a parte "Fluxo de caixa × resultado" do
      texto; capital de giro, ciclos e regime de competência não aparecem na descrição e ficam
      com o texto. Ninguém da equipe assistiu ao vídeo: o que está aqui vem da descrição da
      página. Se algo divergir do texto da aula, vale o texto. Opcional, para quem quiser
      reforço.
