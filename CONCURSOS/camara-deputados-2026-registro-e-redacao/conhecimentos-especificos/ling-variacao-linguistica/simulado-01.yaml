  - id: q06
    topico: conhecimentos-especificos/ling-variacao-linguistica
    enunciado: |-
      Texto para o item: trecho fictício de um roteiro de treinamento de um setor de registro de debates, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Ao comparar a gravação de um discurso com o texto revisado, o servidor
      > 2. nota diferenças previsíveis: na fala, há hesitações, repetições e
      > 3. frases refeitas; no texto escrito, elas desaparecem. Nota também que um
      > 4. mesmo orador conserva, na tribuna e na entrevista de corredor, a
      > 5. pronúncia e certas palavras da região onde cresceu, mas troca o
      > 6. tratamento cerimonioso por formas mais próximas quando deixa o plenário.
      > 7. Nos anais de um século atrás, por fim, encontra formas de tratamento e
      > 8. construções que já não se usam. Nada disso é desordem: quem ouve ou lê
      > 9. continua entendendo, e cabe apenas perguntar se cada forma convém à
      > 10. situação em que foi usada.

      Com base no texto e nos conceitos de variação linguística, julgue o item.

      As diferenças descritas nas linhas 1 a 3, entre a gravação do discurso e o texto revisado, correspondem à variação diamésica.
