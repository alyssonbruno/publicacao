# Treino de variação linguística (tipos de variação; dialetos e registros) — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Variação linguística, tipos de variação, dialetos e registros
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre dois textos próprios e fictícios (as falas de uma consultora legislativa em duas situações e um trecho de roteiro de treinamento de um setor de registro de debates) e sobre conceitos, no estilo de certo ou errado do Cebraspe: marcas do texto entre aspas, com remissão à linha, e uma afirmação por item.'
    - 'Referências de estilo, sem reprodução de itens: cadernos de conhecimentos específicos do CESPE/Cebraspe para Taquígrafo Legislativo da Câmara dos Deputados (2012), com o gabarito definitivo, e para Professor de Língua Portuguesa da SEDUC/AL (edital de 2017, aplicado em 2018) e da SEE/DF (edital de 2016, aplicado em 2017); padrão de resposta da prova discursiva da Prefeitura de São Luís (edital de 2016, aplicada em 2017).'
    - 'Bases do gabarito: Coelho, Görski, May e Souza, Sociolinguística (UFSC, 2010), item 2.2, capítulo 4 e glossário; Marinho e Costa Val, Variação lingüística e ensino: caderno do professor (Ceale/UFMG e MEC, 2006), seção 3. Consultados em 12/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-variacao-linguistica
    enunciado: |-
      Texto para o item: falas fictícias de uma mesma consultora legislativa, no mesmo dia, em duas situações, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Situação A — exposição oral, sem leitura, em audiência pública:
      > 2. “Senhor Presidente, senhoras e senhores deputados, agradeço o
      > 3. convite. Passo a resumir a nota técnica da consultoria. O
      > 4. substitutivo do relator acolhe três emendas e rejeita as demais; a
      > 5. matéria ainda está sujeita a pedido de vista.”
      > 6. Situação B — minutos depois, no café, com um colega de equipe:
      > 7. “Nossa, que sufoco! A gente quase estourou o tempo. Me avisa se
      > 8. pedirem vista, tá? Aí eu refaço a nota rapidinho.”

      Com base no texto e nos conceitos de variação linguística, julgue o item.

      O emprego de “substitutivo” e “emendas” (linha 4) e de “pedido de vista” (linha 5), termos próprios da atividade legislativa, constitui marca de variação diafásica, pois identifica o grupo profissional a que a falante pertence.
