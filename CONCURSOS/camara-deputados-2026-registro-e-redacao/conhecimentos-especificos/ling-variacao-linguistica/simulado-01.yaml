  - id: q11
    topico: conhecimentos-especificos/ling-variacao-linguistica
    enunciado: |-
      Julgue o item, relativo à variação linguística.

      Na alternância entre “Tem sessão hoje” e “Há sessão hoje”, as formas “tem” e “há” são duas variedades de uma mesma variante.
  - id: q12
    topico: conhecimentos-especificos/ling-variacao-linguistica
    enunciado: |-
      Julgue o item, relativo à variação linguística.

      Na Sociolinguística, o termo dialeto equivale a variedade e aplica-se tanto às variedades regionais quanto às sociais, incluída a de prestígio.
