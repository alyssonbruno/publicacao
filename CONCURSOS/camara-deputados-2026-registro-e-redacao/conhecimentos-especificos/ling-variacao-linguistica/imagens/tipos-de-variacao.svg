<svg xmlns="http://www.w3.org/2000/svg" width="912" height="640" viewBox="0 0 912 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="912" height="640" fill="#ffffff"/>

  <!-- Título -->
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Os tipos de variação: cada nome responde a uma pergunta</text>
  <text x="24" y="62" font-size="14" fill="#52514e">O que separa as duas formas de dizer a mesma coisa?</text>

  <!-- Cabeçalhos -->
  <g font-size="14" font-weight="700" fill="#52514e">
    <text x="40" y="100">Nome</text>
    <text x="222" y="100">Pergunta</text>
    <text x="462" y="100">Exemplo</text>
    <text x="712" y="100">Para lembrar</text>
  </g>

  <!-- Diatópica -->
  <g transform="translate(24 112)">
    <rect width="864" height="84" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="36" font-size="17" font-weight="700" fill="#1c5cab">Diatópica</text>
    <text x="16" y="60" font-size="13" fill="#52514e">regional, geográfica</text>
    <text x="198" y="36" font-size="15" font-weight="700" fill="#0b0b0b">De onde é quem fala?</text>
    <text x="198" y="60" font-size="13" fill="#52514e">o lugar</text>
    <text x="438" y="36" font-size="14" fill="#0b0b0b">mandioca · aipim · macaxeira</text>
    <text x="438" y="60" font-size="14" fill="#0b0b0b">o r de "porta" em cada região</text>
    <text x="688" y="36" font-size="14" fill="#0b0b0b"><tspan font-weight="700">topos</tspan> = lugar</text>
    <text x="688" y="60" font-size="13" fill="#52514e">como em topografia</text>
  </g>

  <!-- Diastrática -->
  <g transform="translate(24 204)">
    <rect width="864" height="84" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="36" font-size="17" font-weight="700" fill="#1c5cab">Diastrática</text>
    <text x="16" y="60" font-size="13" fill="#52514e">social</text>
    <text x="198" y="36" font-size="15" font-weight="700" fill="#0b0b0b">De que grupo é quem fala?</text>
    <text x="198" y="60" font-size="13" fill="#52514e">escolaridade, idade, profissão...</text>
    <text x="438" y="36" font-size="14" fill="#0b0b0b">nós vamos · nós vai</text>
    <text x="438" y="60" font-size="14" fill="#0b0b0b">jargão de uma profissão, gíria</text>
    <text x="688" y="36" font-size="14" fill="#0b0b0b"><tspan font-weight="700">estrato</tspan> = camada</text>
    <text x="688" y="60" font-size="13" fill="#52514e">como em estrato social</text>
  </g>

  <!-- Diafásica -->
  <g transform="translate(24 296)">
    <rect width="864" height="84" rx="10" fill="#fdf0e6" stroke="#f0c3a6"/>
    <text x="16" y="36" font-size="17" font-weight="700" fill="#b4501f">Diafásica</text>
    <text x="16" y="60" font-size="13" fill="#52514e">estilística, de registro</text>
    <text x="198" y="36" font-size="15" font-weight="700" fill="#0b0b0b">Em que situação se fala?</text>
    <text x="198" y="60" font-size="13" fill="#52514e">a mesma pessoa muda a fala</text>
    <text x="438" y="36" font-size="14" fill="#0b0b0b">na tribuna: "Peço a palavra"</text>
    <text x="438" y="60" font-size="14" fill="#0b0b0b">no corredor: "Me dá um minuto?"</text>
    <text x="688" y="36" font-size="14" fill="#0b0b0b"><tspan font-weight="700">fásica</tspan> lembra fala</text>
    <text x="688" y="60" font-size="13" fill="#52514e">a fala de cada ocasião</text>
  </g>

  <!-- Diamésica -->
  <g transform="translate(24 388)">
    <rect width="864" height="84" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="36" font-size="17" font-weight="700" fill="#1c5cab">Diamésica</text>
    <text x="16" y="60" font-size="13" fill="#52514e">fala e escrita</text>
    <text x="198" y="36" font-size="15" font-weight="700" fill="#0b0b0b">Por que meio se diz?</text>
    <text x="198" y="60" font-size="13" fill="#52514e">falando ou escrevendo</text>
    <text x="438" y="36" font-size="14" fill="#0b0b0b">o discurso falado em plenário</text>
    <text x="438" y="60" font-size="14" fill="#0b0b0b">e a ata escrita da mesma sessão</text>
    <text x="688" y="36" font-size="14" fill="#0b0b0b"><tspan font-weight="700">mésica</tspan> lembra meio</text>
    <text x="688" y="60" font-size="13" fill="#52514e">o meio: fala ou escrita</text>
  </g>

  <!-- Diacrônica -->
  <g transform="translate(24 480)">
    <rect width="864" height="84" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="36" font-size="17" font-weight="700" fill="#1c5cab">Diacrônica</text>
    <text x="16" y="60" font-size="13" fill="#52514e">histórica</text>
    <text x="198" y="36" font-size="15" font-weight="700" fill="#0b0b0b">De que época é o texto?</text>
    <text x="198" y="60" font-size="13" fill="#52514e">o tempo</text>
    <text x="438" y="36" font-size="14" fill="#0b0b0b">vossa mercê, que deu você</text>
    <text x="438" y="60" font-size="14" fill="#0b0b0b">um discurso de 1900 e um de hoje</text>
    <text x="688" y="36" font-size="14" fill="#0b0b0b"><tspan font-weight="700">cronos</tspan> = tempo</text>
    <text x="688" y="60" font-size="13" fill="#52514e">como em cronologia</text>
  </g>

  <!-- Pé -->
  <line x1="24" y1="580" x2="888" y2="580" stroke="#e1e0d9"/>
  <text x="24" y="604" font-size="14" fill="#0b0b0b">Só na <tspan font-weight="700">diafásica</tspan> quem fala é a mesma pessoa. Nas outras, comparam-se falantes, meios ou épocas.</text>
  <text x="24" y="626" font-size="14" fill="#0b0b0b">Os tipos <tspan font-weight="700">se combinam</tspan>: a mesma fala tem marcas de lugar, de grupo e de situação.</text>
</svg>
