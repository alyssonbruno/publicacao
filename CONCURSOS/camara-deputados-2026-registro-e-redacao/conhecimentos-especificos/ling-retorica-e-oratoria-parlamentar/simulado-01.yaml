      A retomada de “Ponte que cai” em duas frases curtas e seguidas (linhas 13 e 14) é recurso compatível com um texto escrito para ser ouvido, uma vez que o ouvinte, ao contrário do leitor, não pode voltar ao que já foi dito.
  - id: q06
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Acerca dos conceitos de retórica e de oratória parlamentar, julgue o item.

      Um pronunciamento feito em sessão do Parlamento para censurar publicamente, no presente, uma conduta tida como indigna não se classifica como epidítico, uma vez que esse gênero, na retórica clássica, se limita ao louvor.
  - id: q07
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Acerca dos conceitos de retórica e de oratória parlamentar, julgue o item.

      Na origem, a retórica ocupa-se da argumentação como um todo, isto é, do que dizer, em que ordem e de que modo, de sorte que sua identificação com um repertório de figuras de linguagem resulta de redução ocorrida ao longo da história.
  - id: q08
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Acerca dos conceitos de retórica e de oratória parlamentar, julgue o item.

      Entre as cinco operações em que a tradição retórica divide o trabalho do orador, a invenção é aquela em que se dá forma ao texto, com a escolha das palavras, do estilo e das figuras.
