# Treino de retórica e oratória parlamentar — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Retórica e oratória parlamentar
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, cinco delas sobre um texto próprio e fictício (trecho do pronunciamento de uma deputada em sessão solene, sem pessoa, partido nem município reais) e três conceituais, no estilo de certo ou errado do Cebraspe: remissão às linhas do texto e uma afirmação por item.'
    - 'Não há item do Cebraspe sobre retórica e oratória parlamentar nas provas levantadas. O estilo segue o molde geral de certo ou errado da banca, em que o item nomeia um recurso do texto e afirma a sua função, como no caderno de conhecimentos específicos de Analista Legislativo, Taquígrafo Legislativo, da Câmara dos Deputados (CESPE/UnB, 2012), referência de estilo, sem reprodução de itens.'
    - 'Bases do gabarito, pela aula do tópico: Manual de Redação Parlamentar e Legislativa (Consultoria Legislativa do Senado Federal, 2006), seção Pronunciamentos; Mateus, Introdução à Retórica no Séc. XXI (LabCom.IFP, Universidade da Beira Interior, 2018); Aristóteles, Retórica, livro I, cap. 2 (tradução inglesa de W. Rhys Roberts, edição em hipertexto de Lee Honeycutt); Regimento Interno da Câmara dos Deputados, art. 68. Aula consultada em 13/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Texto para o item: trecho fictício do pronunciamento de uma deputada em sessão solene pelo centenário de uma biblioteca pública municipal, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Senhor Presidente, Senhoras e Senhores Deputados, esta sessão solene
      > 2. celebra os cem anos da biblioteca pública de um pequeno município de
      > 3. serra.
      > 4. A ata de fundação, de que trago cópia, registra que ela abriu com
      > 5. trezentos livros doados, numa sala emprestada pela estação de trem.
      > 6. Fechou-se a ferrovia; a biblioteca continuou. Veio a enchente; a
      > 7. biblioteca continuou. Mudaram as gerações; a biblioteca continuou.
      > 8. Foi nela que aprendi a ler, aos seis anos, pela mão de uma
      > 9. bibliotecária que nunca me perguntou de que família eu vinha.
      > 10. Honramos hoje quem guardou esses livros por um século: gente que
      > 11. abriu a porta todos os dias, sem plateia e sem aplauso.
      > 12. Que o exemplo nos sirva. Cada cidade deste País merece uma porta
      > 13. assim, aberta a quem chega.

      Com base no texto e nos conceitos de retórica e de oratória parlamentar, julgue o item.

      Ao louvar, no presente, as pessoas que mantiveram a biblioteca (linhas 10 e 11), a oradora pratica o ato próprio do gênero que a retórica clássica denomina epidítico.
