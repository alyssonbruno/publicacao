  - id: q04
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Texto para o item: trecho fictício do pronunciamento de uma deputada em sessão solene pelo centenário de uma biblioteca pública municipal, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Senhor Presidente, Senhoras e Senhores Deputados, esta sessão solene
      > 2. celebra os cem anos da biblioteca pública de um pequeno município de
      > 3. serra.
      > 4. A ata de fundação, de que trago cópia, registra que ela abriu com
      > 5. trezentos livros doados, numa sala emprestada pela estação de trem.
      > 6. Fechou-se a ferrovia; a biblioteca continuou. Veio a enchente; a
      > 7. biblioteca continuou. Mudaram as gerações; a biblioteca continuou.
      > 8. Foi nela que aprendi a ler, aos seis anos, pela mão de uma
      > 9. bibliotecária que nunca me perguntou de que família eu vinha.
      > 10. Honramos hoje quem guardou esses livros por um século: gente que
      > 11. abriu a porta todos os dias, sem plateia e sem aplauso.
      > 12. Que o exemplo nos sirva. Cada cidade deste País merece uma porta
      > 13. assim, aberta a quem chega.

      Com base no texto e nos conceitos de retórica e de oratória parlamentar, julgue o item.

      A ata de fundação mencionada pela oradora (linhas 4 e 5) exemplifica o tipo de prova que, na retórica clássica, existe antes do discurso e é apenas utilizado pelo orador, diferentemente das provas que ele constrói ao falar.
  - id: q05
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Texto para o item: trecho fictício do pronunciamento de uma deputada em sessão solene pelo centenário de uma biblioteca pública municipal, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Senhor Presidente, Senhoras e Senhores Deputados, esta sessão solene
      > 2. celebra os cem anos da biblioteca pública de um pequeno município de
      > 3. serra.
      > 4. A ata de fundação, de que trago cópia, registra que ela abriu com
      > 5. trezentos livros doados, numa sala emprestada pela estação de trem.
      > 6. Fechou-se a ferrovia; a biblioteca continuou. Veio a enchente; a
      > 7. biblioteca continuou. Mudaram as gerações; a biblioteca continuou.
      > 8. Foi nela que aprendi a ler, aos seis anos, pela mão de uma
      > 9. bibliotecária que nunca me perguntou de que família eu vinha.
      > 10. Honramos hoje quem guardou esses livros por um século: gente que
      > 11. abriu a porta todos os dias, sem plateia e sem aplauso.
