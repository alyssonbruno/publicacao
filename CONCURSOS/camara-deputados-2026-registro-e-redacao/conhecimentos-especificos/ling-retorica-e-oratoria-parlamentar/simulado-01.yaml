# Treino de retórica e oratória parlamentar — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Retórica e oratória parlamentar
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, cinco delas sobre um texto próprio e fictício (trecho do pronunciamento de um deputado, sem pessoa nem partido reais) e três conceituais, no estilo de certo ou errado do Cebraspe: remissão às linhas do texto e uma afirmação por item.'
    - 'Não há item do Cebraspe sobre retórica e oratória parlamentar nas provas levantadas. O estilo segue o molde geral de certo ou errado da banca, em que o item nomeia um recurso do texto e afirma a sua função, como no caderno de conhecimentos específicos de Analista Legislativo, Taquígrafo Legislativo, da Câmara dos Deputados (CESPE/UnB, 2012), referência de estilo, sem reprodução de itens.'
    - 'Bases do gabarito, pela aula do tópico: Manual de Redação Parlamentar e Legislativa (Consultoria Legislativa do Senado Federal, 2006), seção Pronunciamentos; Mateus, Introdução à Retórica no Séc. XXI (LabCom.IFP, Universidade da Beira Interior, 2018); Fiorin, Argumentação e discurso (Bakhtiniana, v. 9, n. 1, 2014). Aula consultada em 12/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Texto para o item: trecho fictício do pronunciamento de um deputado sobre projeto que cria um programa de conservação de pontes em estradas rurais, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Senhor Presidente, Senhoras e Senhores Deputados, antes de chegar a
      > 2. esta Casa, trabalhei dezoito anos como engenheiro de estradas no
      > 3. interior. Conheço de perto as pontes de que vou falar.
      > 4. Em março do ano passado, a ponte de madeira de um distrito rural
      > 5. cedeu depois de uma semana de chuva. Durante quarenta dias, o ônibus
      > 6. escolar não passou, e o leite das propriedades ficou do outro lado
      > 7. do rio.
      > 8. O laudo da defesa civil do município, que tenho em mãos, atesta que
      > 9. a ponte estava havia doze anos sem manutenção. Conservar custa uma
      > 10. fração do que custa reconstruir. Dirão que os municípios já têm essa
      > 11. obrigação; têm a obrigação, mas não têm o engenheiro nem a máquina,
      > 12. e é isso que o programa oferece.
      > 13. Por isso, peço a este Plenário: aprovemos o projeto. Ponte que cai
      > 14. isola. Ponte que cai empobrece. Que nenhuma família volte a esperar,
      > 15. na margem, por um socorro que não consegue atravessar.

      Com base no texto e nos conceitos de retórica e de oratória parlamentar, julgue o item.

      Ao mencionar a própria experiência profissional (linhas 1 a 3), o orador constrói, no discurso, a imagem de pessoa competente para tratar do assunto, o que caracteriza a prova que a retórica clássica denomina ethos.
