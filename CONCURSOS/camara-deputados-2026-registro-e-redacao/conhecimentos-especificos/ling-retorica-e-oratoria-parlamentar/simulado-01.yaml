      > 13. assim, aberta a quem chega.

      Com base no texto e nos conceitos de retórica e de oratória parlamentar, julgue o item.

      A retomada de “a biblioteca continuou” ao fim de três períodos seguidos (linhas 6 e 7) é recurso compatível com um texto escrito para ser ouvido, uma vez que o ouvinte, ao contrário do leitor, não pode voltar ao que já foi dito.
  - id: q06
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Acerca dos conceitos de retórica e de oratória parlamentar, julgue o item.

      Um pronunciamento feito em sessão do Parlamento para censurar publicamente, no presente, uma conduta tida como indigna não se classifica como epidítico, uma vez que esse gênero, na retórica clássica, se limita ao louvor.
  - id: q07
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Acerca dos conceitos de retórica e de oratória parlamentar, julgue o item.

      A lista de tipos de pronunciamento adotada no Manual de Redação Parlamentar e Legislativa do Senado Federal (deliberativo, de propaganda e epidítico) não coincide com a classificação da retórica clássica, da qual faz parte o gênero judiciário.
  - id: q08
    topico: conhecimentos-especificos/ling-retorica-e-oratoria-parlamentar
    enunciado: |-
      Acerca dos conceitos de retórica e de oratória parlamentar, julgue o item.

      Em retórica, o auditório de um pronunciamento restringe-se às pessoas presentes no recinto em que o orador fala.
