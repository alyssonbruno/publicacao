<svg xmlns="http://www.w3.org/2000/svg" width="912" height="650" viewBox="0 0 912 650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="912" height="650" fill="#ffffff"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">O plano de cinco gêneros próximos do cargo</text>
  <text x="24" y="62" font-size="14" fill="#52514e">As partes que o leitor espera encontrar em cada um</text>
  <g transform="translate(24 84)">
    <rect width="280" height="232" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="32" font-size="17" font-weight="700" fill="#1c5cab">Notícia</text>
    <text x="16" y="64" font-size="14" fill="#0b0b0b" xml:space="preserve">1. Lide: o primeiro parágrafo,</text>
    <text x="16" y="88" font-size="14" fill="#0b0b0b" xml:space="preserve">    com a informação principal</text>
    <text x="16" y="112" font-size="14" fill="#0b0b0b" xml:space="preserve">2. O resto, em ordem decrescente</text>
    <text x="16" y="136" font-size="14" fill="#0b0b0b" xml:space="preserve">    de importância</text>
    <line x1="16" y1="182" x2="264" y2="182" stroke="#b8cfee"/>
    <text x="16" y="206" font-size="12" fill="#52514e">Manual de Comunicação do Senado (lide)</text>
  </g>
  <g transform="translate(316 84)">
    <rect width="280" height="232" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="32" font-size="17" font-weight="700" fill="#1c5cab">Artigo de opinião</text>
    <text x="16" y="64" font-size="14" fill="#0b0b0b" xml:space="preserve">1. Tese: a posição defendida</text>
    <text x="16" y="88" font-size="14" fill="#0b0b0b" xml:space="preserve">2. Argumentos que a sustentam</text>
    <text x="16" y="112" font-size="14" fill="#0b0b0b" xml:space="preserve">3. Fecho</text>
    <text x="16" y="136" font-size="14" fill="#0b0b0b" xml:space="preserve">Opinativo e, em geral, assinado</text>
    <line x1="16" y1="182" x2="264" y2="182" stroke="#b8cfee"/>
    <text x="16" y="206" font-size="12" fill="#52514e">Síntese desta aula; definição do Senado</text>
  </g>
  <g transform="translate(608 84)">
    <rect width="280" height="232" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="32" font-size="17" font-weight="700" fill="#1c5cab">Ata</text>
    <text x="16" y="64" font-size="14" fill="#0b0b0b" xml:space="preserve">1. Título</text>
    <text x="16" y="88" font-size="14" fill="#0b0b0b" xml:space="preserve">2. Texto num único parágrafo:</text>
    <text x="16" y="112" font-size="14" fill="#0b0b0b" xml:space="preserve">    preâmbulo, registro, fecho</text>
    <text x="16" y="136" font-size="14" fill="#0b0b0b" xml:space="preserve">3. Local e data · 4. Assinatura</text>
    <line x1="16" y1="182" x2="264" y2="182" stroke="#b8cfee"/>
    <text x="16" y="206" font-size="12" fill="#52514e">Manual de Redação da Câmara, 3.4.2</text>
  </g>
  <g transform="translate(24 330)">
    <rect width="280" height="232" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="32" font-size="17" font-weight="700" fill="#1c5cab">Lei</text>
    <text x="16" y="64" font-size="14" fill="#0b0b0b" xml:space="preserve">1. Parte preliminar: epígrafe, ementa,</text>
    <text x="16" y="88" font-size="14" fill="#0b0b0b" xml:space="preserve">    preâmbulo, objeto e âmbito</text>
    <text x="16" y="112" font-size="14" fill="#0b0b0b" xml:space="preserve">2. Parte normativa</text>
    <text x="16" y="136" font-size="14" fill="#0b0b0b" xml:space="preserve">3. Parte final: vigência, revogação</text>
    <line x1="16" y1="182" x2="264" y2="182" stroke="#b8cfee"/>
    <text x="16" y="206" font-size="12" fill="#52514e">LC 95/1998, art. 3º</text>
  </g>
  <g transform="translate(316 330)">
    <rect width="280" height="232" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="16" y="32" font-size="17" font-weight="700" fill="#1c5cab">Discurso em plenário</text>
    <text x="16" y="64" font-size="14" fill="#0b0b0b" xml:space="preserve">Palavra dirigida ao Presidente</text>
    <text x="16" y="88" font-size="14" fill="#0b0b0b" xml:space="preserve">ou aos Deputados de modo geral</text>
    <text x="16" y="112" font-size="14" fill="#0b0b0b" xml:space="preserve">Colega: Senhor ou Deputado;</text>
    <text x="16" y="136" font-size="14" fill="#0b0b0b" xml:space="preserve">ao dirigir-se a ele, Excelência</text>
    <line x1="16" y1="182" x2="264" y2="182" stroke="#b8cfee"/>
    <text x="16" y="206" font-size="12" fill="#52514e">RICD, art. 73, X e XI</text>
  </g>
  <g transform="translate(608 330)">
    <rect width="280" height="232" rx="10" fill="#fdf0e6" stroke="#f0c3a6"/>
    <text x="16" y="32" font-size="17" font-weight="700" fill="#b4501f">Como usar no item</text>
    <text x="16" y="64" font-size="14" fill="#0b0b0b">1. Ache a parte no texto.</text>
    <text x="16" y="88" font-size="14" fill="#0b0b0b">2. Veja o que ela faz ali.</text>
    <text x="16" y="112" font-size="14" fill="#0b0b0b">3. Confira se o item descreve</text>
    <text x="16" y="136" font-size="14" fill="#0b0b0b" xml:space="preserve">    a parte certa e a função certa.</text>
    <line x1="16" y1="182" x2="264" y2="182" stroke="#f0c3a6"/>
    <text x="16" y="206" font-size="12" fill="#52514e">Plano conhecido, leitura mais rápida</text>
  </g>
  <line x1="24" y1="586" x2="888" y2="586" stroke="#e1e0d9"/>
  <text x="24" y="614" font-size="14" fill="#0b0b0b">A ordem também é recurso: notícia, <tspan font-weight="700">o mais importante primeiro</tspan>; ata, <tspan font-weight="700">a ordem dos trabalhos</tspan>; instruções, <tspan font-weight="700">a ordem do tempo</tspan>.</text>
  <text x="24" y="636" font-size="13" fill="#52514e">Ordem decrescente de importância e ordem cronológica das instruções: Manual de linguagem simples da Câmara.</text>
</svg>
