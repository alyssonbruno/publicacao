      De acordo com a estrutura fixada pela Lei Complementar nº 95/1998, a ementa (linha 2) e o artigo que trata da vigência (linha 10) integram a parte preliminar da lei.
  - id: q08
    topico: conhecimentos-especificos/ling-recursos-de-producao-de-textos
    enunciado: |-
      Considere o seguinte trecho de um expediente administrativo fictício: “Urge que esta Coordenação envide ingentes esforços a fim de obviar os óbices ao funcionamento das bibliotecas.”

      A respeito da adequação da linguagem ao gênero, julgue o item.

      A reescrita “Esta Coordenação deve empenhar-se em remover os obstáculos ao funcionamento das bibliotecas” preservaria a formalidade exigida pelo gênero, uma vez que o uso do padrão culto da língua não se confunde com o emprego de vocabulário raro.
