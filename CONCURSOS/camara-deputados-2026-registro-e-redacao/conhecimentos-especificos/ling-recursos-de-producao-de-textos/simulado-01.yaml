# Treino de recursos de produção de textos e adequação ao gênero — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Recursos de produção de textos e adequação ao gênero
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre textos próprios e fictícios (trecho de discurso em Plenário, projeto de lei, títulos de notícia e trecho de expediente), no estilo de certo ou errado do Cebraspe: o item aponta um recurso presente no texto, com remissão à linha, e afirma o efeito dele.'
    - 'Referências de estilo, sem reprodução de itens: caderno de conhecimentos específicos do Cespe/UnB para Analista Legislativo, atribuição Taquígrafo Legislativo, da Câmara dos Deputados (2012), e caderno de Conhecimentos Gerais do Cebraspe para a Câmara dos Deputados (Edital nº 1/2025, aplicado em 8/3/2026), com os gabaritos definitivos, pelo registro da curadoria do tópico.'
    - 'Bases do gabarito: Manual de redação: documentos administrativos, 2ª ed. (Câmara dos Deputados, 2023); Manual de Redação da Presidência da República, 3ª ed. (2018); Lei Complementar nº 95/1998, arts. 3º e 11. Consultados em 12/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-recursos-de-producao-de-textos
    enunciado: |-
      Texto para o item: trecho fictício de discurso proferido em sessão do Plenário, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Senhor Presidente, Senhoras e Senhores Deputados, o parecer afirma que
      > 2. o fechamento das bibliotecas municipais representa “economia” para os
      > 3. cofres públicos. Segundo o relator, a medida seria inevitável. Não é.
      > 4. Fechar biblioteca para equilibrar o orçamento é como vender as janelas
      > 5. da casa para pagar a conta de luz: a despesa diminui, e a casa fica às
      > 6. escuras. Em Vila Serena, a biblioteca é o único lugar em que os alunos
      > 7. da zona rural têm acesso a livros e à internet. É preciso manter essas
      > 8. portas abertas. É preciso ouvir os prefeitos. É preciso, sobretudo,
      > 9. ler o parecer com atenção antes de votar.

      Com base no texto e nos recursos de produção de textos nele empregados, julgue o item.

      O emprego das aspas em “economia” (linha 2) indica que o orador assume como sua a avaliação que o parecer faz do resultado financeiro da medida.
