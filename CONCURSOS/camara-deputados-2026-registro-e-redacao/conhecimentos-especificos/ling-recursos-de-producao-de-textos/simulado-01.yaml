  - id: q05
    topico: conhecimentos-especificos/ling-recursos-de-producao-de-textos
    enunciado: |-
      Considere dois títulos, ambos gramaticalmente corretos, propostos para uma notícia fictícia sobre o mesmo fato: “Relator enxuga projeto das feiras livres” e “Relator esvazia projeto das feiras livres”.

      A respeito dos recursos de produção de textos, julgue o item.

      Embora os dois títulos noticiem o mesmo fato, a forma “esvazia” sugere avaliação desfavorável da mudança feita pelo relator, ao passo que “enxuga” a apresenta de modo favorável.
  - id: q06
    topico: conhecimentos-especificos/ling-recursos-de-producao-de-textos
    enunciado: |-
      Texto para o item: projeto de lei fictício, com as linhas numeradas.

      > **Texto II**
      >
      > 1. PROJETO DE LEI Nº 987, DE 2026
      > 2. Institui o Programa Leitura em Rede nas bibliotecas públicas municipais.
      > 3. O Congresso Nacional decreta:
      > 4. Art. 1º Esta Lei institui o Programa Leitura em Rede, destinado às
      > 5. bibliotecas públicas municipais.
      > 6. Art. 2º As casas de leitura participantes do Programa manterão acervo
      > 7. digital de acesso gratuito.
      > 8. Art. 3º Os equipamentos culturais de que trata esta Lei funcionarão,
      > 9. no mínimo, quarenta horas por semana.
      > 10. Art. 4º Esta Lei entra em vigor na data de sua publicação.

      Com base no texto e nos recursos de produção de textos nele empregados, julgue o item.

      Admitindo-se que “bibliotecas públicas municipais” (linha 5), “casas de leitura” (linha 6) e “equipamentos culturais” (linha 8) designem o mesmo objeto, a variação entre essas expressões atende à Lei Complementar nº 95/1998, que recomenda evitar a repetição de palavras no texto legal.
