<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="580" fill="#ffffff"/>

  <!-- Título -->
  <text x="24" y="36" font-size="21" font-weight="700" fill="#0b0b0b">Hiperônimos e hipônimos no Regimento Interno da Câmara</text>

  <!-- Ligações -->
  <g stroke="#8c8b85" stroke-width="1.5" fill="none">
    <!-- proposição -> 8 espécies -->
    <line x1="500" y1="110" x2="500" y2="128"/>
    <line x1="80" y1="128" x2="920" y2="128"/>
    <line x1="80" y1="128" x2="80" y2="142"/>
    <line x1="200" y1="128" x2="200" y2="142"/>
    <line x1="320" y1="128" x2="320" y2="142"/>
    <line x1="440" y1="128" x2="440" y2="142"/>
    <line x1="560" y1="128" x2="560" y2="142"/>
    <line x1="680" y1="128" x2="680" y2="142"/>
    <line x1="800" y1="128" x2="800" y2="142"/>
    <line x1="920" y1="128" x2="920" y2="142"/>
    <!-- projeto -> 3 espécies -->
    <line x1="200" y1="204" x2="200" y2="226"/>
    <line x1="110" y1="226" x2="430" y2="226"/>
    <line x1="110" y1="226" x2="110" y2="242"/>
    <line x1="270" y1="226" x2="270" y2="242"/>
    <line x1="430" y1="226" x2="430" y2="242"/>
    <!-- projeto de lei -> 2 espécies -->
    <line x1="110" y1="294" x2="110" y2="316"/>
    <line x1="110" y1="316" x2="270" y2="316"/>
    <line x1="110" y1="316" x2="110" y2="332"/>
    <line x1="270" y1="316" x2="270" y2="332"/>
  </g>

  <!-- Nível 1 -->
  <rect x="360" y="56" width="280" height="54" rx="10" fill="#1c5cab"/>
  <text x="500" y="80" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">proposição</text>
  <text x="500" y="100" font-size="12" fill="#ffffff" text-anchor="middle">toda matéria sujeita à deliberação (art. 100)</text>

  <!-- Nível 2: as espécies do art. 100, § 1º -->
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <rect x="24" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="80" y="164">proposta de</text>
    <text x="80" y="180">emenda à</text>
    <text x="80" y="196">Constituição</text>

    <rect x="144" y="142" width="112" height="62" rx="8" fill="#1c5cab"/>
    <text x="200" y="178" font-size="15" font-weight="700" fill="#ffffff">projeto</text>

    <rect x="264" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="320" y="178">emenda</text>

    <rect x="384" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="440" y="178">indicação</text>

    <rect x="504" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="560" y="178">requerimento</text>

    <rect x="624" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="680" y="178">recurso</text>

    <rect x="744" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="800" y="178">parecer</text>

    <rect x="864" y="142" width="112" height="62" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="920" y="164">proposta de</text>
    <text x="920" y="180">fiscalização</text>
    <text x="920" y="196">e controle</text>
  </g>

  <!-- Nível 3: projetos (arts. 108 e 109) -->
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <rect x="35" y="242" width="150" height="52" rx="8" fill="#1c5cab"/>
    <text x="110" y="273" font-size="14" font-weight="700" fill="#ffffff">projeto de lei</text>

    <rect x="195" y="242" width="150" height="52" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="270" y="264">projeto de decreto</text>
    <text x="270" y="281">legislativo</text>

    <rect x="355" y="242" width="150" height="52" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="430" y="264">projeto de</text>
    <text x="430" y="281">resolução</text>
  </g>

  <!-- Nível 4: projetos de lei (art. 108) -->
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <rect x="35" y="332" width="150" height="52" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="110" y="354">projeto de lei</text>
    <text x="110" y="371">ordinária</text>

    <rect x="195" y="332" width="150" height="52" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="270" y="354">projeto de lei</text>
    <text x="270" y="371">complementar</text>
  </g>

  <!-- Como ler -->
  <g transform="translate(540 242)">
    <rect width="436" height="160" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text x="16" y="28" font-size="15" font-weight="700" fill="#1c5cab">Como ler a árvore</text>
    <g font-size="14" fill="#0b0b0b">
      <text x="16" y="54">↑ Para cima, o termo mais geral: <tspan font-weight="700">hiperônimo</tspan>.</text>
      <text x="16" y="76">↓ Para baixo, o mais específico: <tspan font-weight="700">hipônimo</tspan>.</text>
      <text x="16" y="102">Teste: “X é um tipo de Y”.</text>
      <text x="16" y="124"><tspan font-style="italic">Projeto</tspan> é hipônimo de <tspan font-style="italic">proposição</tspan></text>
      <text x="16" y="144">e hiperônimo de <tspan font-style="italic">projeto de lei</tspan>.</text>
    </g>
  </g>

  <!-- Parte não é tipo -->
  <g transform="translate(540 418)">
    <rect width="436" height="104" rx="10" fill="#fdf0e6" stroke="#b4501f" stroke-dasharray="6 4"/>
    <text x="16" y="28" font-size="15" font-weight="700" fill="#b4501f">Parte não é tipo</text>
    <g font-size="14" fill="#0b0b0b">
      <text x="16" y="52">Artigo, parágrafo e inciso são <tspan font-weight="700">partes</tspan> do projeto</text>
      <text x="16" y="72">(meronímia), não hipônimos dele: “o artigo é um tipo</text>
      <text x="16" y="92">de projeto” não faz sentido.</text>
    </g>
  </g>

  <!-- Fonte -->
  <text x="24" y="560" font-size="12" fill="#52514e">Fonte: Regimento Interno da Câmara dos Deputados (Resolução nº 17/1989), arts. 100, § 1º, 108 e 109.</text>
</svg>
