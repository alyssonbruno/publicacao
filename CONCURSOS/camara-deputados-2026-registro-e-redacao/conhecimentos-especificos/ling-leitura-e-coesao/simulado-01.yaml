      > 17. razões para quem um dia quiser entender por que a lei foi
      > 18. aprovada daquela forma.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No terceiro parágrafo, a ideia principal é a de que a minoria, nas horas de obstrução, expõe argumentos que não teria espaço para expor numa votação rápida; os períodos “Há quem veja nisso um desperdício. Não é.” (linha 14) funcionam como detalhe de apoio dessa ideia.
  - id: q08
    topico: conhecimentos-especificos/ling-leitura-e-coesao
    enunciado: |-
      Texto para o item: trecho fictício de discurso em plenário, como registrado nas notas taquigráficas, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Sr. Presidente, em 2019 esta Casa aprovou um fundo para as
      > 2. escolas do campo; no ano seguinte, o Senado fez o mesmo.
      > 3. O fundo existe no papel. Nas escolas, o telhado continua
      > 4. furado, a merenda continua chegando atrasada, o ônibus
      > 5. continua quebrado. Não peço um fundo novo: peço que o antigo
      > 6. funcione. Venho de uma cidade de 8 mil habitantes; de lá até
      > 7. a escola estadual mais próxima são 40 quilômetros de estrada
      > 8. de terra. Quem percorre essa distância todos os dias não
      > 9. precisa de discurso. Precisa de ônibus.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      Em “o Senado fez o mesmo” (linha 2), a expressão “fez o mesmo” ocupa o lugar do segmento “aprovou um fundo para as escolas do campo” (linhas 1 e 2), caso do mecanismo coesivo que Halliday e Hasan denominam substituição.
  - id: q09
    topico: conhecimentos-especificos/ling-leitura-e-coesao
    enunciado: |-
      Texto para o item: trecho fictício de discurso em plenário, como registrado nas notas taquigráficas, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Sr. Presidente, em 2019 esta Casa aprovou um fundo para as
      > 2. escolas do campo; no ano seguinte, o Senado fez o mesmo.
      > 3. O fundo existe no papel. Nas escolas, o telhado continua
      > 4. furado, a merenda continua chegando atrasada, o ônibus
      > 5. continua quebrado. Não peço um fundo novo: peço que o antigo
      > 6. funcione. Venho de uma cidade de 8 mil habitantes; de lá até
      > 7. a escola estadual mais próxima são 40 quilômetros de estrada
      > 8. de terra. Quem percorre essa distância todos os dias não
      > 9. precisa de discurso. Precisa de ônibus.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      A repetição da forma verbal “continua” (linhas 3 a 5) é recurso de ênfase que, na classificação de Koch, pertence à coesão referencial, uma vez que cada ocorrência do verbo retoma o mesmo referente.
  - id: q10
    topico: conhecimentos-especificos/ling-leitura-e-coesao
    enunciado: |-
      Texto para o item: trecho fictício de discurso em plenário, como registrado nas notas taquigráficas, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Sr. Presidente, em 2019 esta Casa aprovou um fundo para as
      > 2. escolas do campo; no ano seguinte, o Senado fez o mesmo.
      > 3. O fundo existe no papel. Nas escolas, o telhado continua
      > 4. furado, a merenda continua chegando atrasada, o ônibus
      > 5. continua quebrado. Não peço um fundo novo: peço que o antigo
      > 6. funcione. Venho de uma cidade de 8 mil habitantes; de lá até
      > 7. a escola estadual mais próxima são 40 quilômetros de estrada
      > 8. de terra. Quem percorre essa distância todos os dias não
      > 9. precisa de discurso. Precisa de ônibus.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      Entre os períodos “O fundo existe no papel.” e “Nas escolas, o telhado continua furado (...)” (linhas 3 a 5), há relação de contraste sem conector que a explicite, o que é compatível com a posição de Koch e Travaglia de que a coesão não é condição necessária da coerência.
