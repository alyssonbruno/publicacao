# Treino de leitura: compreensão literal, coesão, coerência e relações coesivas — Câmara dos Deputados 2026, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Leitura, coesão e coerência
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre dois textos próprios e fictícios (um texto sobre a obstrução
      parlamentar e um trecho de discurso em plenário), no estilo de certo ou errado do Cebraspe:
      remissão à linha e item que junta a identificação do mecanismo a uma justificativa.'
    - 'Referência de estilo, sem cópia de itens: caderno de conhecimentos específicos do Analista
      Legislativo – Taquígrafo Legislativo da Câmara dos Deputados, 2012 (Cespe/UnB), itens 71 a 95,
      e o gabarito definitivo.'
    - 'Bases do gabarito: Koch, “O desenvolvimento da Linguística Textual no Brasil” (D.E.L.T.A.,
      1999); Tavares, “Mecanismos de coesão no texto Aula de Inglês, de Rubem Braga” (Revista
      Arredia, 2012); UFS/CESAD, Produção e Recepção de Texto I, aulas 5 e 20, e Fundamentos para o
      Ensino da Leitura e da Escrita, aula 5; Manual de Redação da Presidência da República, 3ª ed.,
      item 3.4; Brasil Escola, “Coesão textual”. Consultados em 11/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-leitura-e-coesao
    enunciado: |-
      Texto para o item: texto fictício sobre a obstrução parlamentar, em três parágrafos (linhas 1 a 6, 7 a 13 e 14 a 18), com as linhas numeradas.

      > **Texto I**
      >
      > 1. Em dias de votação polêmica, a sessão pode atravessar a
      > 2. madrugada. A minoria apresenta requerimentos de adiamento,
      > 3. pede verificação de votação e inscreve oradores em série. Essa
      > 4. estratégia tem nome no jargão parlamentar: obstrução. Ela não
      > 5. impede a aprovação de matéria que tenha maioria; o que faz é
      > 6. cobrar um preço em tempo, e tempo, no Parlamento, vale muito.
      > 7. Para quem registra os debates, a obstrução é outra coisa.
      > 8. Cada requerimento gera um encaminhamento, cada encaminhamento
      > 9. gera uma réplica, e o texto cresce como uma maré que sobe sem
      > 10. pressa. Os taquígrafos se revezam em turnos curtos; os
      > 11. revisores, em turnos longos. Ao amanhecer, a ata registra
      > 12. poucas decisões, mas as notas taquigráficas somam centenas de
      > 13. páginas.
      > 14. Há quem veja nisso um desperdício. Não é. Nas horas de
      > 15. obstrução, a minoria expõe argumentos que não teria espaço
      > 16. para expor numa votação rápida, e o registro guarda essas
      > 17. razões para quem um dia quiser entender por que a lei foi
      > 18. aprovada daquela forma.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      De acordo com o texto, a obstrução não impede a aprovação de matéria que conte com maioria, mas torna mais demorada a sua votação.
