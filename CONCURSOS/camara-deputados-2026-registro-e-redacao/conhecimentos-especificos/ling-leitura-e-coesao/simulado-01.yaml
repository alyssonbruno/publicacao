      > 18. aprovada daquela forma.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      A expressão “outra coisa” (linha 7) funciona como elemento coesivo, pois só se interpreta por comparação com o que se disse da obstrução no primeiro parágrafo, caso do que Halliday e Hasan chamam de referência comparativa.
