materiais:
  - tipo: texto
    titulo: "Leitura: compreensão literal, coesão, coerência e relações coesivas"
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: Leitura e Produção de textos — A coesão textual
    url: https://www.youtube.com/watch?v=N1F6Q-eSAUg
    autor: UNIVESP (aula da professora Vanessa Martins do Monte)
    duracao_min: 19
    descricao: >-
      Aula de universidade pública que segue a sequência de Halliday e Hasan: critérios de
      textualidade (1:38), coesão (2:35), coesão referencial (8:16), substituição (11:00),
      conjunções (13:44) e coesão lexical (15:25). Assista depois de ler as partes de coesão do
      texto; se um rótulo ou exemplo diferir do texto, lembre que os rótulos mudam de autor para
      autor e confira o que a forma retoma. O canal tem versões com Libras e com audiodescrição.
  - tipo: video
    titulo: COESÃO referencial & sequencial
    url: https://www.youtube.com/watch?v=Tyr3Ko3AlRE
    autor: Daniel Glaydson & Grupo Cocares (Prof. Daniel Glaydson Ribeiro, IFPI)
    duracao_min: 15
    descricao: >-
      A divisão de Koch em coesão referencial e sequencial: o que é coesão (0:45), coesão
      referencial (2:15), hipônimos e hiperônimos (3:20), conectores argumentativos (8:45) e de
      ressalva (9:30) e coesão sequencial por justaposição (11:35). As referências do vídeo
      incluem Halliday e Hasan, Koch e Beaugrande e Dressler. Para esta aula, veja até 8:45 e
      depois a justaposição (11:35); os conectores do meio estão na aula de Coesão textual, de
      Português.
  - tipo: video
    titulo: "Coerência: o principal fator de textualidade"
    url: https://www.youtube.com/watch?v=GAKbrrfU9DY
    autor: Daniel Glaydson & Grupo Cocares (Prof. Daniel Glaydson Ribeiro, IFPI)
    duracao_min: 15
    descricao: >-
      A coerência como fator central da textualidade e os tipos de coerência: o que é coerência
      (1:32), o fator da coerência (2:50), coerência sintática (3:36), semântica (5:04),
      pragmática (6:15), estilística (8:11) e temática (11:23). A divisão em tipos é outra forma
      de apresentar o assunto, que não é a do texto da aula: para os itens que citam autores,
      fique com os fatores de coerência de Koch e Travaglia e as metarregras de Charolles.
  - tipo: video
    titulo: "Interpretação de texto: ideia principal e ideia secundária"
    url: https://www.youtube.com/watch?v=wdFrnEkV9V0
    autor: Mario Tossan (Escola de Concursados)
    duracao_min: 12
    descricao: >-
      O item 3.2 do edital: o que é a ideia principal e como resumi-la numa frase (0:32), um
      exemplo com notícia (3:41), ideia principal explícita (4:34), ideias secundárias (5:10) e
      como anotá-las (5:53). O trecho de 1:23 a 3:41 trata da redação; se o tempo for curto,
      comece em 3:41. Ignore a venda de cursos da descrição.
  - tipo: podcast
    titulo: "COESÃO e COERÊNCIA | Qualidades essenciais de um texto coeso e coerente"
    url: https://podcasts.apple.com/br/podcast/coes%C3%A3o-e-coer%C3%AAncia-qualidade-essenciais-de-um-texto/id1534371896?i=1000527278342
    autor: Português com Letícia (professora Letícia Góes)
    duracao_min: 20
    descricao: >-
      Áudio de uma videoaula: a diferença entre coesão e coerência, a coesão referencial e a
      sequencial e os fatores de coerência. Bom para revisar no caminho, depois do texto; as
      categorias de Halliday e Hasan e a ideia principal ficam com o texto da aula. O volume da
      gravação é baixo: aumente o som.
  - tipo: podcast
    titulo: "T1E11 — Coesão e Coerência Textuais, de Leonor Lopes Fávero"
    url: https://podcasts.apple.com/br/podcast/t1e11-coes%C3%A3o-e-coer%C3%AAncia-textuais-de-leonor-lopes-f%C3%A1vero/id1607472962?i=1000558188919
    autor: Onde a coruja lê (Rodolfo Rossi e Juliano Amaral)
    duracao_min: 23
    descricao: >-
      Conversa sobre o livro Coesão e coerência textuais, de Leonor Lopes Fávero, que revê as
      categorias de Halliday e Hasan e propõe a coesão referencial, recorrencial e sequencial. É
      um bate-papo, não uma aula: ouça depois do texto, para fixar a classificação de Fávero.
  - tipo: link
    titulo: "Mecanismos de coesão no texto Aula de Inglês, de Rubem Braga"
    url: https://ojs.ufgd.edu.br/arredia/article/view/1744
    autor: Marilze Tavares (Revista Arredia, UFGD, 2012)
    descricao: >-
      Artigo de aprofundamento, opcional. A parte teórica (p. 103 a 106) resume com clareza as
      categorias de Halliday e Hasan, a crítica de Fávero e a divisão de Koch; depois, aplica a
      de Koch a uma crônica de Rubem Braga, comentando elipses, repetições e pronomes como
      "disso" e "nisso", que retomam trechos inteiros. Apresenta Halliday e Hasan por meio de
      Koch, e não pelo livro original; por isso, a substituição ali inclui casos que o texto da
      aula trata como elipse nominal (o nome omitido depois de numeral ou indefinido) ou como
      reiteração (o nome genérico).
