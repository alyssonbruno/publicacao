<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="780" height="500" fill="#ffffff"/>

  <text x="20" y="28" font-size="14" font-weight="700" fill="#0b0b0b">Hjelmslev e Barthes — E: expressão; C: conteúdo</text>
  <line x1="12" y1="40" x2="768" y2="40" stroke="#0b0b0b" stroke-width="1.2"/>

  <!-- ===== Denotação ===== -->
  <g font-size="12.5" fill="#0b0b0b">
    <text x="20" y="74" font-size="14" font-weight="700" fill="#1c5cab">DENOTAÇÃO</text>
    <text x="20" y="94">um sistema só: expressão</text>
    <text x="20" y="111">e conteúdo</text>
  </g>
  <g transform="translate(250 56)">
    <rect width="200" height="64" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="12" y="20" font-size="12" font-weight="700" fill="#8a5a00">E</text>
    <text x="100" y="42" font-size="14" fill="#0b0b0b" text-anchor="middle">“Vossa Excelência”</text>
    <rect x="210" width="298" height="64" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="222" y="20" font-size="12" font-weight="700" fill="#1c5cab">C</text>
    <text x="359" y="42" font-size="14" fill="#0b0b0b" text-anchor="middle">o deputado a quem se fala</text>
  </g>

  <line x1="12" y1="140" x2="768" y2="140" stroke="#d6d4cf" stroke-width="1"/>

  <!-- ===== Conotação ===== -->
  <g font-size="12.5" fill="#0b0b0b">
    <text x="20" y="176" font-size="14" font-weight="700" fill="#0e6b4b">CONOTAÇÃO</text>
    <text x="20" y="196">o sistema inteiro vira a</text>
    <text x="20" y="213"><tspan font-weight="700">expressão</tspan> de um segundo</text>
    <text x="20" y="230">sistema</text>
  </g>
  <g transform="translate(250 154)">
    <rect width="356" height="104" rx="10" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
    <text x="12" y="20" font-size="12" font-weight="700" fill="#0e6b4b">E (do segundo sistema)</text>
    <rect x="10" y="30" width="150" height="62" rx="6" fill="#fdf1d6" stroke="#c98500"/>
    <text x="20" y="46" font-size="11.5" font-weight="700" fill="#8a5a00">E</text>
    <text x="85" y="68" font-size="13" fill="#0b0b0b" text-anchor="middle">“Vossa Excelência”</text>
    <rect x="168" y="30" width="178" height="62" rx="6" fill="#e3edf9" stroke="#256abf"/>
    <text x="178" y="46" font-size="11.5" font-weight="700" fill="#1c5cab">C</text>
    <text x="257" y="68" font-size="13" fill="#0b0b0b" text-anchor="middle">o deputado a quem se fala</text>

    <rect x="366" width="142" height="104" rx="10" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
    <text x="378" y="20" font-size="12" font-weight="700" fill="#0e6b4b">C</text>
    <text x="437" y="50" font-size="13" fill="#0b0b0b" text-anchor="middle">registro formal,</text>
    <text x="437" y="68" font-size="13" fill="#0b0b0b" text-anchor="middle">linguagem</text>
    <text x="437" y="86" font-size="13" fill="#0b0b0b" text-anchor="middle">parlamentar</text>
  </g>

  <line x1="12" y1="276" x2="768" y2="276" stroke="#d6d4cf" stroke-width="1"/>

  <!-- ===== Metalinguagem ===== -->
  <g font-size="12.5" fill="#0b0b0b">
    <text x="20" y="312" font-size="14" font-weight="700" fill="#4a3aa7">METALINGUAGEM</text>
    <text x="20" y="332">o sistema inteiro vira o</text>
    <text x="20" y="349"><tspan font-weight="700">conteúdo</tspan> de um segundo</text>
    <text x="20" y="366">sistema</text>
  </g>
  <g transform="translate(250 290)">
    <rect width="142" height="104" rx="10" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="12" y="20" font-size="12" font-weight="700" fill="#4a3aa7">E</text>
    <text x="71" y="56" font-size="13" fill="#0b0b0b" text-anchor="middle">“pronome de</text>
    <text x="71" y="74" font-size="13" fill="#0b0b0b" text-anchor="middle">tratamento”</text>

    <rect x="152" width="356" height="104" rx="10" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="164" y="20" font-size="12" font-weight="700" fill="#4a3aa7">C (do segundo sistema)</text>
    <rect x="162" y="30" width="150" height="62" rx="6" fill="#fdf1d6" stroke="#c98500"/>
    <text x="172" y="46" font-size="11.5" font-weight="700" fill="#8a5a00">E</text>
    <text x="237" y="68" font-size="13" fill="#0b0b0b" text-anchor="middle">“Vossa Excelência”</text>
    <rect x="320" y="30" width="178" height="62" rx="6" fill="#e3edf9" stroke="#256abf"/>
    <text x="330" y="46" font-size="11.5" font-weight="700" fill="#1c5cab">C</text>
    <text x="409" y="68" font-size="13" fill="#0b0b0b" text-anchor="middle">o deputado a quem se fala</text>
  </g>

  <!-- ===== Pé ===== -->
  <g transform="translate(12 414)">
    <rect width="756" height="74" rx="10" fill="#fbe3e3"/>
    <text font-size="13.5" fill="#b42727">
      <tspan x="20" y="28" font-weight="700">Na gramática escolar, conotação é o sentido figurado.</tspan>
      <tspan x="20" dy="24">Em Hjelmslev e Barthes, é um segundo sistema, que pode existir sem figura nenhuma.</tspan>
    </text>
  </g>
</svg>
