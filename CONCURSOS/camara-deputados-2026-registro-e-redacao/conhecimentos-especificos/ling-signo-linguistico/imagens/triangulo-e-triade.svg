<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="780" height="540" fill="#ffffff"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- ===== Ogden e Richards ===== -->
  <text x="192" y="28" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Ogden e Richards (1923)</text>
  <line x1="12" y1="40" x2="372" y2="40" stroke="#0b0b0b" stroke-width="1.2"/>

  <!-- lados -->
  <line x1="150" y1="114" x2="95" y2="318" stroke="#256abf" stroke-width="2"/>
  <line x1="234" y1="114" x2="289" y2="318" stroke="#256abf" stroke-width="2"/>
  <line x1="150" y1="343" x2="234" y2="343" stroke="#b42727" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- vértices -->
  <g text-anchor="middle">
    <rect x="82" y="60" width="220" height="54" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="192" y="82" font-size="13.5" font-weight="700" fill="#1c5cab">PENSAMENTO OU</text>
    <text x="192" y="101" font-size="13.5" font-weight="700" fill="#1c5cab">REFERÊNCIA</text>

    <rect x="16" y="318" width="134" height="52" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="83" y="339" font-size="13.5" font-weight="700" fill="#8a5a00">SÍMBOLO</text>
    <text x="83" y="358" font-size="12.5" fill="#0b0b0b">a palavra “cão”</text>

    <rect x="234" y="318" width="134" height="52" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
    <text x="301" y="339" font-size="13.5" font-weight="700" fill="#0e6b4b">REFERENTE</text>
    <text x="301" y="358" font-size="12.5" fill="#0b0b0b">os cães da rua</text>
  </g>

  <!-- rótulos dos lados -->
  <g font-size="12.5" fill="#0b0b0b">
    <text x="113" y="196" text-anchor="end" font-weight="700">simboliza</text>
    <text x="113" y="213" text-anchor="end" fill="#52514e">(relação</text>
    <text x="113" y="229" text-anchor="end" fill="#52514e">causal)</text>

    <text x="272" y="196" font-weight="700">refere-se a</text>
    <text x="272" y="213" fill="#52514e">(outras relações</text>
    <text x="272" y="229" fill="#52514e">causais)</text>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="192" y="394" font-weight="700" fill="#b42727">está por</text>
    <text x="192" y="411" fill="#52514e">(relação apenas imputada:</text>
    <text x="192" y="427" fill="#52514e">não há ligação direta)</text>
  </g>

  <!-- divisória -->
  <line x1="390" y1="20" x2="390" y2="436" stroke="#d6d4cf" stroke-width="1.2"/>

  <!-- ===== Frege ===== -->
  <text x="584" y="28" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Frege (1892), com o telescópio</text>
  <line x1="408" y1="40" x2="768" y2="40" stroke="#0b0b0b" stroke-width="1.2"/>

  <g transform="translate(414 52)">
    <rect width="350" height="52" rx="8" fill="#f4f4f2" stroke="#52514e" stroke-width="1.5"/>
    <text x="14" y="21" font-size="13.5" font-weight="700" fill="#0b0b0b">NOME</text>
    <text x="14" y="41" font-size="13" fill="#0b0b0b">“a estrela da manhã” ou “a estrela da tarde”</text>
  </g>
  <line x1="460" y1="106" x2="460" y2="124" stroke="#52514e" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="472" y="120" font-size="12" fill="#52514e">exprime</text>

  <g transform="translate(414 128)">
    <rect width="350" height="70" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="14" y="21" font-size="13.5" font-weight="700" fill="#8a5a00">SENTIDO (Sinn)</text>
    <text x="14" y="40" font-size="13" fill="#0b0b0b">modo de apresentação (um para cada nome)</text>
    <text x="14" y="59" font-size="13" fill="#52514e">objetivo ≈ a imagem na lente do telescópio</text>
  </g>
  <line x1="460" y1="200" x2="460" y2="218" stroke="#52514e" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="472" y="214" font-size="12" fill="#52514e">designa</text>

  <g transform="translate(414 222)">
    <rect width="350" height="70" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
    <text x="14" y="21" font-size="13.5" font-weight="700" fill="#0e6b4b">REFERÊNCIA (Bedeutung)</text>
    <text x="14" y="40" font-size="13" fill="#0b0b0b">o objeto: Vênus, o mesmo para os dois nomes</text>
    <text x="14" y="59" font-size="13" fill="#52514e">≈ a própria Lua</text>
  </g>

  <g transform="translate(414 316)">
    <rect width="350" height="70" rx="8" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="14" y="21" font-size="13.5" font-weight="700" fill="#4a3aa7">REPRESENTAÇÃO (Vorstellung)</text>
    <text x="14" y="40" font-size="13" fill="#0b0b0b">imagem interna e subjetiva, de cada pessoa</text>
    <text x="14" y="59" font-size="13" fill="#52514e">≈ a imagem na retina de cada observador</text>
  </g>
  <text x="589" y="410" font-size="12" fill="#52514e" text-anchor="middle">A representação acompanha o nome, mas não é</text>
  <text x="589" y="426" font-size="12" fill="#52514e" text-anchor="middle">o sentido nem a referência.</text>

  <!-- ===== Pé ===== -->
  <g transform="translate(12 448)">
    <rect width="756" height="80" rx="10" fill="#fbe3e3"/>
    <text font-size="13.5" fill="#b42727">
      <tspan x="20" y="25" font-weight="700">“Referência” muda de lugar.</tspan>
      <tspan x="20" dy="22">Ogden e Richards: referência é o pensamento; o objeto é o referente.</tspan>
      <tspan x="20" dy="22">Frege (tradução brasileira): referência é o próprio objeto.</tspan>
    </text>
  </g>
</svg>
