materiais:
  - tipo: texto
    titulo: Signo linguístico, língua e fala, sentido e referência, denotação e conotação
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: 'Signo linguístico: o que é mesmo "imagem acústica"?'
    url: https://www.youtube.com/watch?v=GVCe1Y82omU
    autor: Rerisson Cavalcante (canal Linguística – Prof. Rerisson Cavalcante; licença Creative Commons Atribuição)
    duracao_min: 12
    descricao: >-
      Comece por este. Aula de introdução aos estudos linguísticos sobre o signo de Saussure,
      com ênfase na expressão "imagem acústica": os equívocos comuns sobre o signo (2:38), o que
      é de fato a imagem acústica (5:34) e a separação entre o sistema linguístico e a realidade
      extralinguística (7:01), que é o referente fora do signo. Depois de assistir, confira a
      figura do signo "veto" no texto da aula.
  - tipo: video
    titulo: "Signo linguístico: Aristóteles versus Saussure"
    url: https://www.youtube.com/watch?v=eGv1kMmGoAo
    autor: Rerisson Cavalcante (canal Linguística – Prof. Rerisson Cavalcante; licença Creative Commons Atribuição)
    duracao_min: 11
    descricao: >-
      Compara o signo de Aristóteles, que liga a escrita, a fala, as afecções da alma e as
      coisas, ao signo de duas faces psíquicas de Saussure, com um erro comum (1:44) e a pergunta
      "quem está certo?" (8:54). Serve de ponte entre o signo saussuriano e o triângulo de Ogden e
      Richards: em seguida, leia a parte do texto sobre o referente.
  - tipo: video
    titulo: Introdução à Linguística - As dicotomias saussureanas
    url: https://www.youtube.com/watch?v=BVOHiqxi0LM
    autor: UNIVESP (disciplina Introdução à Linguística, Profa. Elaine Assolini)
    duracao_min: 19
    descricao: >-
      Aula da disciplina Introdução à Linguística, do ciclo básico da Univesp, sobre as
      dicotomias saussureanas. Assista com o texto da aula ao lado e anote como aparece cada par;
      para a motivação relativa e a linearidade, fique com o texto da aula.
  - tipo: video
    titulo: Sentido e referência
    url: https://www.youtube.com/watch?v=rB3y0ze4aEU
    autor: Roberlei Alves Bertucci (disciplina de Semântica e Pragmática, Letras, UTFPR)
    duracao_min: 16
    descricao: >-
      A distinção de Frege numa aula de Semântica e Pragmática do curso de Letras da UTFPR:
      sentido e referência (2:14), referência (6:13) e exercícios (11:05). Pause antes de cada
      exercício e tente resolvê-lo sozinho. Para a representação, a terceira noção de Frege no
      edital, use o texto da aula (a analogia do telescópio).
  - tipo: podcast
    titulo: Arbitrário do signo linguístico | Linguística em Foco
    url: https://podcasts.apple.com/br/podcast/arbitr%C3%A1rio-do-signo-lingu%C3%ADstico-lingu%C3%ADstica-em-foco/id1514532604?i=1000580780857
    audio: https://anchor.fm/s/20c1341c/podcast/play/58175042/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2022-8-26%2F287839022-44100-2-55fd5221b3f7e.m4a
    autor: Sopa de Letras (PETcast Letras, UFRGS); leitura da Profa. Elisa Battisti
    duracao_min: 9
    descricao: >-
      Leitura do verbete sobre o arbitrário do livro "Conceitos básicos de linguística: sistemas
      conceituais" (Battisti, Othero e Flores, Contexto, 2021), pela professora Elisa Battisti,
      uma das organizadoras. É texto de manual lido em voz alta: ouça com atenção, de preferência
      duas vezes. O volume é baixo; aumente o som.
  - tipo: podcast
    titulo: Caráter Linear do Significante | Linguística em Foco
    url: https://podcasts.apple.com/br/podcast/car%C3%A1ter-linear-do-significante-lingu%C3%ADstica-em-foco/id1514532604?i=1000583097717
    audio: https://anchor.fm/s/20c1341c/podcast/play/59275470/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2022-9-19%2F291923440-44100-2-942f941c0bc08.m4a
    autor: Sopa de Letras (PETcast Letras, UFRGS); leitura da Profa. Elisa Battisti
    duracao_min: 9
    descricao: >-
      Leitura do verbete sobre a linearidade, do mesmo livro, pela mesma professora. O título já
      marca o ponto central: a linearidade é do significante, e não do significado.
  - tipo: link
    titulo: Cours de linguistique générale — Introdução (língua, fala e linguagem)
    url: https://fr.wikisource.org/wiki/Cours_de_linguistique_g%C3%A9n%C3%A9rale/Introduction
    autor: Ferdinand de Saussure (ed. Bally e Sechehaye; Wikisource)
    descricao: >-
      O original em francês. Leia o capítulo III (o objeto da linguística: a linguagem
      "multiforme e heteróclita" e a língua como sua parte social) e o IV (linguística da língua
      e linguística da fala). Opcional, para quem lê francês; em português, o livro tem as
      traduções da Cultrix e da Parábola.
  - tipo: link
    titulo: Cours de linguistique générale — Primeira parte (a natureza do signo)
    url: https://fr.wikisource.org/wiki/Cours_de_linguistique_g%C3%A9n%C3%A9rale/Premi%C3%A8re_partie
    autor: Ferdinand de Saussure (ed. Bally e Sechehaye; Wikisource)
    descricao: >-
      O original em francês dos capítulos I (o signo, o arbitrário, as onomatopeias, o símbolo e
      a linearidade) e II (imutabilidade e mutabilidade). São poucas páginas e decidem quase todos
      os itens sobre Saussure. Opcional, para quem lê francês.
  - tipo: link
    titulo: Sobre o sentido e a referência (Frege, tradução de Sérgio R. N. Miranda)
    url: https://seer.ufrgs.br/index.php/resseveraverumgaudium/article/view/147224
    autor: Gottlob Frege; tradução de Sérgio R. N. Miranda (Res Severa Verum Gaudium, UFRGS)
    descricao: >-
      O artigo de 1892 em português, em PDF. Leia só as primeiras páginas: a estrela da manhã e
      a da tarde, a representação (Bucéfalo) e a analogia do telescópio. O título e o resumo em
      inglês são da revista, não de Frege, e há erros de digitação ("a estrela a manhã").
