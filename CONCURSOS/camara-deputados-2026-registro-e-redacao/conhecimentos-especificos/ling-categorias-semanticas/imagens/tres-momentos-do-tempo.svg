<svg xmlns="http://www.w3.org/2000/svg" width="760" height="612" viewBox="0 0 760 612" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="612" fill="#ffffff"/>

  <!-- Título -->
  <text x="24" y="32" font-size="17" font-weight="700" fill="#0b0b0b">Os três momentos do tempo</text>
  <g font-size="13" fill="#52514e">
    <text x="24" y="54"><tspan font-weight="700" fill="#1c5cab">ME</tspan> = momento do evento   ·   <tspan font-weight="700" fill="#8a5a00">MR</tspan> = momento de referência   ·   <tspan font-weight="700" fill="#0e6b4b">MF</tspan> = momento da fala</text>
  </g>

  <!-- Painel de cima: exemplo -->
  <rect x="16" y="70" width="728" height="132" rx="10" fill="#f6f5f1" stroke="#d9d6cc"/>
  <text x="380" y="96" font-size="14.5" text-anchor="middle" fill="#0b0b0b">“<tspan font-weight="700" fill="#8a5a00">Quando o relator chegou</tspan>, <tspan font-weight="700" fill="#1c5cab">a comissão já votara o parecer</tspan>.”</text>
  <line x1="44" y1="146" x2="704" y2="146" stroke="#0b0b0b" stroke-width="2"/>
  <path d="M704 139 L718 146 L704 153 Z" fill="#0b0b0b"/>
  <circle cx="170" cy="146" r="8" fill="#256abf"/>
  <circle cx="390" cy="146" r="8" fill="#c98500"/>
  <circle cx="610" cy="146" r="8" fill="#12805a"/>
  <g font-size="13" text-anchor="middle">
    <text x="170" y="128" font-weight="700" fill="#1c5cab">ME</text>
    <text x="390" y="128" font-weight="700" fill="#8a5a00">MR</text>
    <text x="610" y="128" font-weight="700" fill="#0e6b4b">MF</text>
    <text x="170" y="172" fill="#0b0b0b">a votação</text>
    <text x="390" y="172" fill="#0b0b0b">a chegada do relator</text>
    <text x="610" y="172" fill="#0b0b0b">agora: quem conta o fato</text>
    <text x="170" y="190" font-size="12" fill="#52514e">primeiro</text>
    <text x="390" y="190" font-size="12" fill="#52514e">depois</text>
    <text x="610" y="190" font-size="12" fill="#52514e">por último</text>
  </g>

  <!-- Cabeçalho da tabela -->
  <text x="24" y="236" font-size="13" font-weight="700" fill="#0b0b0b">Tempo do indicativo</text>
  <text x="250" y="236" font-size="13" font-weight="700" fill="#0b0b0b">Fórmula</text>
  <text x="430" y="236" font-size="12" fill="#52514e">passado</text>
  <text x="590" y="236" font-size="12" font-weight="700" fill="#0e6b4b" text-anchor="middle">agora</text>
  <text x="720" y="236" font-size="12" fill="#52514e" text-anchor="end">futuro</text>

  <!-- Linha 1: presente -->
  <g transform="translate(0 250)">
    <rect x="16" y="0" width="728" height="56" rx="6" fill="#ffffff" stroke="#e6e3da"/>
    <text x="24" y="23" font-size="13.5" font-weight="700" fill="#0b0b0b">Presente</text>
    <text x="24" y="43" font-size="13" font-style="italic" fill="#52514e">a comissão vota</text>
    <text x="250" y="33" font-size="13" fill="#0b0b0b">ME = MR = MF</text>
    <line x1="420" y1="36" x2="712" y2="36" stroke="#8c8a83" stroke-width="1.5"/>
    <circle cx="590" cy="36" r="7" fill="#12805a"/>
    <text x="590" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">ME = MR = MF</text>
  </g>

  <!-- Linha 2: perfeito -->
  <g transform="translate(0 312)">
    <rect x="16" y="0" width="728" height="56" rx="6" fill="#ffffff" stroke="#e6e3da"/>
    <text x="24" y="23" font-size="13.5" font-weight="700" fill="#0b0b0b">Pretérito perfeito</text>
    <text x="24" y="43" font-size="13" font-style="italic" fill="#52514e">a comissão votou</text>
    <text x="250" y="33" font-size="13" fill="#0b0b0b">ME antes de MR = MF</text>
    <line x1="420" y1="36" x2="712" y2="36" stroke="#8c8a83" stroke-width="1.5"/>
    <circle cx="480" cy="36" r="7" fill="#256abf"/>
    <circle cx="590" cy="36" r="7" fill="#12805a"/>
    <text x="480" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1c5cab">ME</text>
    <text x="590" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">MR = MF</text>
  </g>

  <!-- Linha 3: imperfeito -->
  <g transform="translate(0 374)">
    <rect x="16" y="0" width="728" height="56" rx="6" fill="#ffffff" stroke="#e6e3da"/>
    <text x="24" y="23" font-size="13.5" font-weight="700" fill="#0b0b0b">Pretérito imperfeito</text>
    <text x="24" y="43" font-size="13" font-style="italic" fill="#52514e">a comissão votava</text>
    <text x="250" y="33" font-size="13" fill="#0b0b0b">ME = MR, antes de MF</text>
    <line x1="420" y1="36" x2="712" y2="36" stroke="#8c8a83" stroke-width="1.5"/>
    <circle cx="480" cy="36" r="7" fill="#256abf"/>
    <circle cx="590" cy="36" r="7" fill="#12805a"/>
    <text x="480" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">ME = MR</text>
    <text x="590" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0e6b4b">MF</text>
  </g>

  <!-- Linha 4: mais-que-perfeito -->
  <g transform="translate(0 436)">
    <rect x="16" y="0" width="728" height="56" rx="6" fill="#ffffff" stroke="#e6e3da"/>
    <text x="24" y="23" font-size="13.5" font-weight="700" fill="#0b0b0b">Mais-que-perfeito</text>
    <text x="24" y="43" font-size="13" font-style="italic" fill="#52514e">a comissão votara</text>
    <text x="250" y="25" font-size="13" fill="#0b0b0b">ME antes de MR,</text>
    <text x="250" y="43" font-size="13" fill="#0b0b0b">MR antes de MF</text>
    <line x1="420" y1="36" x2="712" y2="36" stroke="#8c8a83" stroke-width="1.5"/>
    <circle cx="450" cy="36" r="7" fill="#256abf"/>
    <circle cx="520" cy="36" r="7" fill="#c98500"/>
    <circle cx="590" cy="36" r="7" fill="#12805a"/>
    <text x="450" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1c5cab">ME</text>
    <text x="520" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#8a5a00">MR</text>
    <text x="590" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0e6b4b">MF</text>
  </g>

  <!-- Linha 5: futuro do presente -->
  <g transform="translate(0 498)">
    <rect x="16" y="0" width="728" height="56" rx="6" fill="#ffffff" stroke="#e6e3da"/>
    <text x="24" y="23" font-size="13.5" font-weight="700" fill="#0b0b0b">Futuro do presente</text>
    <text x="24" y="43" font-size="13" font-style="italic" fill="#52514e">a comissão votará</text>
    <text x="250" y="33" font-size="13" fill="#0b0b0b">MR = MF, antes de ME</text>
    <line x1="420" y1="36" x2="712" y2="36" stroke="#8c8a83" stroke-width="1.5"/>
    <circle cx="590" cy="36" r="7" fill="#12805a"/>
    <circle cx="680" cy="36" r="7" fill="#256abf"/>
    <text x="590" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#0b0b0b">MR = MF</text>
    <text x="680" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#1c5cab">ME</text>
  </g>

  <!-- Rodapé -->
  <text x="24" y="578" font-size="12" fill="#52514e">“=” quer dizer ao mesmo tempo; “antes de”, anterioridade.</text>
  <text x="24" y="596" font-size="12" fill="#52514e">Fórmulas de Corôa (1985), a partir de Reichenbach, como as resumem Barbosa e Longo (2003).</text>
</svg>
