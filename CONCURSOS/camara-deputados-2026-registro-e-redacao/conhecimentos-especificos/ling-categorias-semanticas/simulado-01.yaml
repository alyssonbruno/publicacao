# Treino de categorias semânticas e papéis semânticos — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Categorias semânticas e papéis semânticos
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre um texto próprio e fictício (relato de uma reunião de comissão parlamentar
      de inquérito), no estilo de certo ou errado do Cebraspe: uma forma do texto, com remissão à linha,
      e uma afirmação por item sobre o valor dela no trecho (papel semântico, gênero, tempo, aspecto,
      modalidade, pessoa) ou sobre o efeito de uma reescrita.'
    - 'Referências de estilo, sem cópia de itens: caderno de conhecimentos específicos de Professor de
      Educação Básica – Língua Portuguesa da SEE/DF 2017 (Cebraspe) e caderno de conhecimentos específicos
      de Analista Legislativo – Taquígrafo Legislativo da Câmara dos Deputados 2012 (CESPE/UnB).'
    - 'Bases do gabarito: Cançado (2005, DELTA); Cunha (2005 e 2008, Soletras); Corrêa (2012, CESAD/UFS,
      sobre Perini); Barbosa e Longo (2003, Letras & Letras, com a descrição de Corôa, 1985); Ilari (2020,
      Diadorim); Travaglia (2016, EDUFU); Duarte (2012, Revista do GELNE); Corbari (2013, Cadernos de
      Letras da UFF); Manual de Redação da Presidência da República, 3ª ed. (2018), item 4.1.1. Consultados
      em 11/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-categorias-semanticas
    enunciado: |-
      Texto para o item: relato fictício de uma reunião de comissão parlamentar de inquérito, com as linhas numeradas.

      > **Texto I**
      >
      > 1. A reunião da comissão parlamentar de inquérito começou com uma hora
      > 2. de atraso. Às 14h, uma queda de energia desligou os microfones e o
      > 3. painel eletrônico. Quando o sistema voltou, parte dos deputados já
      > 4. tinha deixado o plenário. O relator, que tem apresentado
      > 5. requerimentos de convocação de ex-dirigentes da empresa investigada,
      > 6. leu o plano de trabalho e defendeu novas diligências. Segundo
      > 7. assessores, o presidente da comissão estaria disposto a ouvir novos
      > 8. depoentes, mas o relatório final deve ser votado até o último dia do
      > 9. prazo, como determina o ato de criação da comissão. A testemunha
      > 10. ouvida pela manhã, um servidor aposentado, disse que nunca vira tanta
      > 11. gente naquele plenário. Ao final, o relator dirigiu-se ao presidente:
      > 12. “Vossa Excelência sabe que esta relatoria ouviu todos os envolvidos.”

      Com base no texto e nas categorias semânticas, julgue o item.

      No trecho “uma queda de energia desligou os microfones e o painel eletrônico” (linhas 2 e 3), o sujeito designa a causa do evento, e não o seu agente, uma vez que não exerce controle sobre o processo que desencadeia.
  - id: q02
    topico: conhecimentos-especificos/ling-categorias-semanticas
    enunciado: |-
      Texto para o item: relato fictício de uma reunião de comissão parlamentar de inquérito, com as linhas numeradas.

