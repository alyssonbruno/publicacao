# Treino de compreensão interpretativa e crítica e de organização retórica — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Compreensão interpretativa e crítica; organização retórica
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre um texto próprio e fictício (artigo de opinião sobre a linguagem das ementas e dos pareceres, com números inventados), no estilo de certo ou errado do Cebraspe: remissão à linha do texto e uma afirmação por item, que nomeia o recurso e lhe atribui uma função.'
    - 'Referência de estilo, sem reprodução de itens: caderno de conhecimentos específicos do Cespe/UnB para Analista Legislativo, atribuição Taquígrafo Legislativo, da Câmara dos Deputados (2012), itens 71 a 100, com o gabarito definitivo. Consultado em 12/10/2026.'
    - 'Bases do gabarito, como apresentadas na aula do tópico: Blasque e Oliveira, As mensagens implícitas do texto (Signum, UEL, 2020); Azevedo, Letramento Acadêmico, aula 5 (CESAD/UFS, 2021); Oliveira, dissertação sobre modalizadores e a distinção entre fato e opinião (Profletras/UFRRJ, 2017); Quintela, Fato ou opinião (blog Descomplica, 2026); guia da Cátedra de Português da UBA, adaptado de Marcuschi (2015); Produção e Recepção de Texto I, aula 20 (CESAD/UFS, 2010), resumo de Othon M. Garcia; Squarisi, Redação 9 (Blog da Dad, Correio Braziliense).'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-compreensao-interpretativa-e-critica
    enunciado: |-
      Texto para o item: artigo de opinião fictício, criado para este treino, com números inventados, em três parágrafos (linhas 1 a 7, 8 a 11 e 12 a 15), com as linhas numeradas.

      > **Palavra difícil não é palavra exata**
      >
      > 1. Em geral, quem escreve em nome do Estado escreve para os colegas, e
      > 2. não para o público. Toda repartição tem o seu dialeto, e o do
      > 3. Legislativo aparece logo na ementa. Ementa é o resumo que vem no alto
      > 4. do projeto de lei e anuncia o seu objeto. Deveria ser a parte mais
      > 5. clara do texto; muitas vezes, é a mais obscura. Uma delas, por exemplo,
      > 6. dizia apenas que o projeto “altera dispositivos da legislação vigente
      > 7. e dá outras providências”, sem informar que lei mudava.
      > 8. Há sinais de mudança. Desde março, uma comissão da Casa deixou de
      > 9. distribuir pareceres sem um resumo em linguagem comum. O efeito foi
      > 10. rápido: em seis meses, os pedidos de esclarecimento que ela recebe por
      > 11. mês caíram de 90 para 35. Felizmente, a ideia começa a ser copiada.
      > 12. Segundo um consultor ouvido pela comissão, o resumo empobrece o
      > 13. parecer, porque troca o termo exato por outro, aproximado. Não é
      > 14. preciso, porém, abolir o termo técnico; basta explicá-lo. Talvez seja
      > 15. essa a forma mais barata de aproximar o cidadão da lei.

      Com base nas ideias e na organização do texto, julgue o item.

      O texto tem por finalidade convencer o leitor de que os termos técnicos devem ser eliminados dos textos legislativos.
