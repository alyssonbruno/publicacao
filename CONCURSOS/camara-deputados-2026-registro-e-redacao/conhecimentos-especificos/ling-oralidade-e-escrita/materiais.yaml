materiais:
  - tipo: texto
    titulo: Oralidade e escrita, normas linguísticas e a variação no português do Brasil
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: Gramática da Língua Portuguesa I - Norma culta, norma-padrão e norma gramatical
    url: https://www.youtube.com/watch?v=RFsw_txQILo
    autor: UNIVESP
    duracao_min: 18
    descricao: >-
      Indicada pelo título e pela descrição do canal, sem ter sido assistida: é uma videoaula de
      disciplina de graduação da Univesp, e o título traz os três nomes da parte "Norma-padrão,
      norma gramatical e norma culta" do texto. Não sabemos o que há dentro. Veja depois dessa
      parte e compare as definições com as do texto; se os nomes vierem de outro jeito, lembre que
      os autores divergem (parte "Onde os autores não coincidem").
  - tipo: video
    titulo: Minicurso - Norma culta brasileira - aula 1
    url: https://www.youtube.com/watch?v=Qo3XUQNu_7w
    autor: Parábola Editorial
    duracao_min: 13
    descricao: >-
      Indicada pelo título e pela descrição do canal, sem ter sido assistida: é a primeira aula
      de um minicurso da editora que publica o livro Norma culta brasileira, de Carlos Alberto
      Faraco, de onde vem a divisão das normas usada no texto. Não sabemos quem apresenta nem o
      que há dentro. Veja depois da parte "Norma-padrão, norma gramatical e norma culta" e
      compare com o texto. As outras aulas do minicurso não foram indicadas.
  - tipo: podcast
    titulo: Você sabe o que é HIPERCORREÇÃO?
    url: https://podcasts.apple.com/br/podcast/voc%C3%AA-sabe-o-que-%C3%A9-hipercorre%C3%A7%C3%A3o/id1700332316?i=1000625236153
    audio: https://anchor.fm/s/e1333fec/podcast/play/74844098/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fproduction%2Fexports%2Fe1333fec%2F74844098%2Fd8e9888cf7210814a243b2e6b77b6f83.m4a
    autor: Português em Meia Hora (Thiago Godoy, o prof. Manga)
    duracao_min: 32
    descricao: >-
      Conferimos por transcrição automática até o minuto 22; o fim não foi ouvido. Nesse trecho,
      o episódio parte de uma crônica de Vinicius de Moraes para explicar a hipercorreção (o erro
      de quem tenta imitar a forma de prestígio), lê a definição do dicionário de
      sociolinguística de Marcos Bagno e fala do prestígio e do estigma das formas. Os
      particípios pego e pegado entram para mostrar que a avaliação de uma forma muda com o
      tempo, e não como exemplo de hipercorreção; a pergunta "tinha chego ou tinha chegado?"
      ainda não tinha sido respondida. Nesse trecho, fala-se em "língua padrão", sem a divisão
      entre norma-padrão e norma culta do texto. Ouça depois da parte "Adequação no lugar de
      certo e errado".
  - tipo: link
    titulo: Fala e escrita (livro do CEEL/UFPE para professores)
    url: https://www.serdigital.com.br/gerenciador/clientes/ceel/arquivos/29.pdf
    autor: Luiz Antônio Marcuschi e Angela Paiva Dionisio (orgs.), CEEL/UFPE e MEC
    descricao: >-
      PDF de 208 páginas, base desta aula. Para aprofundar, leia só o capítulo 1 (p. 13 a 30), com
      os princípios da relação entre fala e escrita e o quadro das "dicotomias perigosas", e, no
      capítulo 3, as páginas 60 a 66, sobre o contínuo, a formalidade e a língua padrão. A grafia é
      anterior ao Acordo Ortográfico ("lingüístico", "idéia").
  - tipo: link
    titulo: Sociolinguística (livro-texto de Letras a distância, UFSC)
    url: https://ppglin.posgrad.ufsc.br/files/2013/04/Sociolingu%C3%ADstica_UFSC.pdf
    autor: Izete Lehmkuhl Coelho, Edair Maria Görski, Guilherme Henrique May e Christiane Maria Nunes de Souza (UFSC)
    descricao: >-
      PDF de 172 páginas, nível de graduação em Letras. Para esta aula, leia três trechos curtos:
      as páginas 61 a 64 (variação na sintaxe do português do Brasil: relativas, sujeito, colocação
      do pronome, verbo com "se"), as páginas 81 a 85 (formalidade e variação entre fala e escrita)
      e as páginas 155 a 157 (você, a gente e a mudança nos verbos). O resto do livro serve à aula
      de variação linguística.
