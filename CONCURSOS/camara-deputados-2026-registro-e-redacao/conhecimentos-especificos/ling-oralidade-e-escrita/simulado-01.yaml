  - id: q05
    topico: conhecimentos-especificos/ling-oralidade-e-escrita
    enunciado: |-
      Julgue o item, relativo às relações entre oralidade e escrita.

      De acordo com a noção de contínuo entre fala e escrita, um recado escrito às pressas para um familiar, por se realizar no meio gráfico, está mais próximo de um relatório técnico do que de um recado dado de viva voz.
  - id: q06
    topico: conhecimentos-especificos/ling-oralidade-e-escrita
    enunciado: |-
      Julgue o item, relativo às relações entre oralidade e escrita.

      Na perspectiva que entende fala e escrita como modos de uso de um mesmo sistema linguístico, a oposição entre o meio sonoro e o meio gráfico é a única distinção propriamente dicotômica entre as duas modalidades.
  - id: q07
    topico: conhecimentos-especificos/ling-oralidade-e-escrita
    enunciado: |-
      Julgue o item, relativo às normas linguísticas.

      Na frase “O uso de a gente no lugar de nós é a norma na conversa entre brasileiros”, a palavra “norma” designa um modelo de correção que se recomenda aos falantes.
  - id: q08
    topico: conhecimentos-especificos/ling-oralidade-e-escrita
    enunciado: |-
      Julgue o item, relativo à formalidade e à informalidade.

      A arguição oral de um candidato por uma banca examinadora e a mensagem escrita trocada entre amigos íntimos são exemplos de que o grau de formalidade de um texto não é determinado pela modalidade, falada ou escrita, em que ele se realiza.
