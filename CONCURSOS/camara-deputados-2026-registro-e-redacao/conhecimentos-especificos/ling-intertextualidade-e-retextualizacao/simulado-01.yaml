      A transposição do período “Por isso, peço o apoio dos colegas” (linhas 5 e 6 do Texto II) para logo depois do vocativo, antes do relato da visita, seria operação da mesma natureza que a divisão do registro em parágrafos, por não exigir de quem redige nenhuma decisão sobre a organização dos argumentos do orador.
