      Sem prejuízo da fidelidade ao que o orador disse, o vocábulo “só” (linha 2 do Texto II) poderia ser suprimido do registro, tal como se fez com “né” e “tá?” (linhas 1 e 2 do Texto I), por se tratar de palavra de reforço própria da fala.
