      A redação “As outras duas não têm funcionários, por isso quase não abrem” é paráfrase do período “As outras duas quase não abrem, porque não têm funcionários” (linhas 3 e 4 do Texto II), pois preserva a relação de causa e consequência entre as duas informações.
  - id: q10
    topico: conhecimentos-especificos/ling-intertextualidade-e-retextualizacao
    enunciado: |-
      Texto para o item: trecho fictício de crônica, com as linhas numeradas.

      > **Texto III**
      >
      > 1. Camões escreveu que “mudam-se os tempos, mudam-se as vontades”. Na
      > 2. biblioteca do meu bairro, mudaram os tempos e mudaram as estantes:
      > 3. onde havia enciclopédias, há agora uma fila de telas. Quem espera
      > 4. sempre alcança, e quem esperou pelo conserto do telhado alcançou
      > 5. apenas a goteira. O poeta tinha razão: com o passar do tempo, mudam
      > 6. também os desejos das pessoas.

      Com base no texto e nas relações de intertextualidade, julgue o item.

      No texto, o verso de Camões é retomado de dois modos: na linha 1, por citação, com as palavras do original entre aspas e a indicação do autor; nas linhas 5 e 6, por paráfrase, com outras palavras e manutenção do sentido.
  - id: q11
    topico: conhecimentos-especificos/ling-intertextualidade-e-retextualizacao
    enunciado: |-
      Texto para o item: trecho fictício de crônica, com as linhas numeradas.

      > **Texto III**
      >
      > 1. Camões escreveu que “mudam-se os tempos, mudam-se as vontades”. Na
      > 2. biblioteca do meu bairro, mudaram os tempos e mudaram as estantes:
      > 3. onde havia enciclopédias, há agora uma fila de telas. Quem espera
      > 4. sempre alcança, e quem esperou pelo conserto do telhado alcançou
      > 5. apenas a goteira. O poeta tinha razão: com o passar do tempo, mudam
      > 6. também os desejos das pessoas.

      Com base no texto e nas relações de intertextualidade, julgue o item.

      No trecho “quem esperou pelo conserto do telhado alcançou apenas a goteira” (linhas 4 e 5), o provérbio que o antecede é retomado em paráfrase, já que se repetem a estrutura e os verbos do texto de origem.
  - id: q12
    topico: conhecimentos-especificos/ling-intertextualidade-e-retextualizacao
    enunciado: |-
      Texto para o item: trecho fictício de crônica, com as linhas numeradas.

      > **Texto III**
      >
      > 1. Camões escreveu que “mudam-se os tempos, mudam-se as vontades”. Na
      > 2. biblioteca do meu bairro, mudaram os tempos e mudaram as estantes:
      > 3. onde havia enciclopédias, há agora uma fila de telas. Quem espera
      > 4. sempre alcança, e quem esperou pelo conserto do telhado alcançou
      > 5. apenas a goteira. O poeta tinha razão: com o passar do tempo, mudam
      > 6. também os desejos das pessoas.

      Com base no texto e nas relações de intertextualidade, julgue o item.

      No texto, tanto a retomada do verso de Camões quanto a do provérbio exemplificam a intertextualidade em sentido estrito, pois, em ambos os casos, há um texto anterior, efetivamente produzido e presente na memória dos interlocutores, a que a crônica remete.
