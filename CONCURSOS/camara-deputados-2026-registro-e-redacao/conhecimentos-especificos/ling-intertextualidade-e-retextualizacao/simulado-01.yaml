      > 6. dos colegas.

      Com base nos textos e nos processos de retextualização, de reescritura e de paráfrase, julgue o item.

      Na passagem de “dessa emenda aqui” (linha 1 do Texto I) para “da emenda em exame” (linha 1 do Texto II), tornou-se explícita, no registro, uma referência que, na fala, dependia da situação em que o discurso foi proferido, o que supõe que quem redigiu tenha identificado a emenda de que o orador falava.
