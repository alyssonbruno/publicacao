# Treino de intertextualidade, retextualização, reescritura e paráfrase — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Intertextualidade, retextualização, reescritura e paráfrase
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre textos próprios e fictícios (a transcrição de um trecho de fala em plenário, o registro escrito feito a partir dela e um trecho de crônica), no estilo de certo ou errado do Cebraspe: trechos entre aspas, com remissão à linha, e itens que julgam uma reescrita ou a relação entre textos.'
    - 'Referências de estilo, sem reprodução de itens: cadernos do Cebraspe de conhecimentos gerais da Câmara dos Deputados (edital de 2025, aplicado em 8/3/2026), de conhecimentos específicos de Taquígrafo Legislativo da Câmara dos Deputados (2012) e de Professor de Língua Portuguesa da SEDUC-AL (edital de 2017, aplicado em 2018), com os gabaritos definitivos.'
    - 'Bases do gabarito: Dikson, A retextualização escrita-escrita (RBLA, 2018); d''Andrea e Ribeiro, Retextualizar e reescrever, editar e revisar (Veredas, UFJF, 2010); Santos, Cabrera e Góes, Retextualização de texto oral (Anagrama, USP, 2008); Araujo, Retextualização, estratégias de condensação e estruturação argumentativa (CONEL/UFES); Produção e Recepção de Texto I, aula 10 (CESAD/UFS); Santos, resenha de Intertextualidade: diálogos possíveis, de Koch, Bentes e Cavalcante (Nuances, FCT/UNESP); Ferraz, Conto popular, estória oral e conto literário (Estudos Linguísticos, GEL, 2014); Souza-Santos e Araújo, O ensino de intertextualidade nos anos finais do ensino fundamental (Educação em Revista, UFMG, 2022). Consultados em 12/10/2026. O verso citado no Texto III é de soneto de Luís de Camões (domínio público); o provérbio é de uso popular.'
questoes:
  - id: q01
    topico: conhecimentos-especificos/ling-intertextualidade-e-retextualizacao
    enunciado: |-
      Textos para o item: o Texto I é a transcrição fictícia de um trecho de fala em plenário; o Texto II é o registro escrito elaborado a partir dela. As linhas estão numeradas.

      > **Texto I**
      >
      > 1. — Senhora Presidente, eu... eu queria falar, né, dessa emenda aqui,
      > 2. a das bibliotecas, tá? A gente visitou, visitou ontem três bibliotecas
      > 3. lá no interior, e só uma delas tinha, tinha acesso à internet,
      > 4. sabe? As outras duas, elas... elas quase não abrem, porque não têm
      > 5. funcionário. Olha, assim, eu acho que o dinheiro da emenda não vai
      > 6. resolver tudo, né? Mas ele ajuda, ele ajuda pelo menos a contratar
      > 7. gente. Por isso é que eu peço, eu peço o apoio dos colegas.

      > **Texto II**
      >
      > 1. Sra. Presidente, quero falar da emenda em exame, a das bibliotecas.
      > 2. Visitamos ontem três bibliotecas no interior, e só uma delas tinha
      > 3. acesso à internet. As outras duas quase não abrem, porque não têm
      > 4. funcionários. Acho que os recursos da emenda não resolverão tudo,
      > 5. mas ajudam pelo menos a contratar pessoal. Por isso, peço o apoio
      > 6. dos colegas.

      Com base nos textos e nos processos de retextualização, de reescritura e de paráfrase, julgue o item.

      No Texto I, a expressão “sabe?” (linha 4) busca a atenção de quem ouve e nada informa sobre as bibliotecas, ao passo que “eu acho que” (linha 5) apresenta como opinião o que o orador diz sobre o dinheiro da emenda, razão pela qual, no Texto II, apenas a segunda foi conservada.
