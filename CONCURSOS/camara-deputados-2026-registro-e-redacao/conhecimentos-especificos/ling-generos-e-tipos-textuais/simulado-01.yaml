      O emprego de expressões feitas como “Usaram da palavra” (linha 7) e “Nada mais havendo a tratar” (linha 10) é aspecto do estilo do gênero ata, entendido, na perspectiva de Bakhtin, como seleção de recursos lexicais, fraseológicos e gramaticais da língua.
