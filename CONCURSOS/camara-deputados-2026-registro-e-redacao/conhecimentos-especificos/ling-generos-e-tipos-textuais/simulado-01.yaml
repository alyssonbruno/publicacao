      > 12. lavrei a presente ata.

      Considerando o texto e os conceitos de gênero do discurso, tipo textual e níveis de estrutura do texto, julgue o item.

      Na leitura do Círculo de Bakhtin que distingue o tema do enunciado do conteúdo temático do gênero, se a comissão tivesse apreciado, na mesma reunião, matéria inteiramente diversa da que se lê nas linhas 5 a 7, mudaria o tema do enunciado, mas não o conteúdo temático do gênero a que o texto pertence.
