      Com base no texto e nos conceitos da teoria da enunciação e da análise do discurso, julgue o item.

      As formas “anteontem” (linha 1), “amanhã” (linha 4) e “aqui” (linha 4) só têm a referência determinada pela situação em que a fala foi proferida, o que explica a sua substituição, no trecho da ata (linhas 6 a 12), por datas e pela indicação do local.
