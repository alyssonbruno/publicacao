  - id: q05
    topico: conhecimentos-especificos/ling-enunciacao-e-discurso
    enunciado: |-
      Acerca dos conceitos da teoria da enunciação e da análise do discurso, julgue o item.

      Na acepção em que Bakhtin empregou o termo ao estudar os romances de Dostoiévski, a polifonia não se confunde com o dialogismo: este é constitutivo de todo enunciado, ao passo que aquela caracteriza obras em que as vozes das personagens se mantêm independentes da voz do autor e em igualdade com ela.
  - id: q06
    topico: conhecimentos-especificos/ling-enunciacao-e-discurso
    enunciado: |-
      Acerca dos conceitos da teoria da enunciação e da análise do discurso, julgue o item.

      Na Análise do Discurso de linha francesa, texto e discurso designam o mesmo objeto: ambos correspondem ao dado empírico de que a análise parte, sem que se distinga entre um conceito teórico e um conceito analítico.
  - id: q07
    topico: conhecimentos-especificos/ling-enunciacao-e-discurso
    enunciado: |-
      Acerca dos conceitos da teoria da enunciação e da análise do discurso, julgue o item.

      Na perspectiva do Círculo de Bakhtin, a ata de reunião é exemplo de esfera social de comunicação, e a atividade parlamentar é o gênero do discurso em que essa esfera se realiza.
