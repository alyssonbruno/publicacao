      No trecho “Sei que haverá quem reclame da demora, mas o pedido foi lido e vai ser atendido” (linhas 4 e 5), a presidente antecipa uma objeção e já responde a ela, o que ilustra, na perspectiva do Círculo de Bakhtin, o dialogismo, entendido como a relação de todo enunciado com outros enunciados, e não como conversa face a face.
