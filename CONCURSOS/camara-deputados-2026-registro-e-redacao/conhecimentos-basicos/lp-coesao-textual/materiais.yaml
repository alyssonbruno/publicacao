materiais:
  - tipo: texto
    titulo: "Coesão textual: referência, substituição, repetição e conectores"
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: Desvende a referenciação com pronomes em concursos!
    url: https://www.youtube.com/watch?v=0MBqhEmPw-E
    autor: Professora Adriana Figueiredo
    duracao_min: 19
    descricao: >-
      Pela descrição, trata do uso dos pronomes na referenciação e de como desfazer
      ambiguidades, com a precisão que o Cebraspe exige: é o item "o termo X retoma Y", o mais
      frequente do tópico. Indicado pela descrição do vídeo, sem conferência do conteúdo. A
      descrição anuncia um curso pago: ignore a parte de venda. Para o relativo, lembre a regra
      da aula: o referente é o antecedente, não o sujeito da oração.
  - tipo: video
    titulo: À medida que × na medida em que
    url: https://www.youtube.com/watch?v=BNArwG4WJjY
    autor: Professor Noslen
    duracao_min: 10
    descricao: >-
      Curto e no ponto de uma pegadinha clássica de troca de conector: quando usar cada
      expressão. Indicado pela descrição do vídeo, sem conferência do conteúdo. Não é voltado a
      uma banca. Se o vídeo não disser, fique com o texto da aula: "à medida em que" e "na
      medida que" estão fora da norma-padrão.
  - tipo: video
    titulo: É isso que cai sobre conjunções para concurso
    url: https://www.youtube.com/watch?v=tKJkDQSMdh0
    autor: Prof. Álvaro Ferreira
    duracao_min: 24
    descricao: >-
      Pela descrição, as regras de conjunções mais cobradas em concurso, com teoria e questões.
      Indicado pela descrição do vídeo, sem conferência do conteúdo; não se sabe se trata de
      "posto que", "conquanto" e "porquanto" nem de que bancas são as questões. Use para fixar
      o valor dos conectores e confira as trocas no quadro da aula.
  - tipo: video
    titulo: "LIVE #361 — Reescritura no Cespe/Cebraspe: domine os conectores e não caia nas pegadinhas!"
    url: https://www.youtube.com/watch?v=WCV7O3b7crQ
    autor: Professora Grasiela Cabral
    duracao_min: 51
    descricao: >-
      Transmitida ao vivo em 5/10/2026. Pela descrição, resolve questões de reescrita do
      Cebraspe centradas nos conectores: quando a troca mantém o sentido e a correção e quando
      torna o item errado; cita a Câmara dos Deputados entre os concursos-alvo. Indicado pela
      descrição do vídeo, sem conferência do conteúdo. É gravação de live: pule a abertura e as
      chamadas de venda de cursos. Veja depois do texto da aula, como treino.
  - tipo: podcast
    titulo: "'Posto que' tem sempre valor de 'embora'?"
    url: https://podcasts.apple.com/br/podcast/posto-que-tem-sempre-valor-de-embora/id1227867522?i=1000736496142
    autor: Pasquale Cipro Neto (A Nossa Língua de Todo Dia, rádio CBN)
    duracao_min: 13
    descricao: >-
      Conferido por transcrição automática do áudio. Um ouvinte pergunta sobre o "posto que é
      chama" de Vinicius de Moraes. O professor mostra o valor concessivo clássico (= embora,
      em Machado de Assis e em Drummond) e trata o causal de Vinicius como uso brasileiro que
      considera consagrado. Na prova, fique com o Manual da Presidência e com o texto da aula:
      "posto que" = "embora". O episódio começa com anúncios e um recado sobre um show; a
      resposta começa perto dos 2 minutos. Fala baixa: aumente o volume.
  - tipo: podcast
    titulo: "#108 Dicas sobre conectivos (Língua Portuguesa)"
    url: https://podcasts.apple.com/br/podcast/108-dicas-sobre-conectivos-l%C3%ADngua-portuguesa/id1495888330?i=1000534143972
    autor: Qconcursos (QC Cast; professor Alexandre Soares)
    duracao_min: 10
    descricao: >-
      Dicas sobre o valor semântico dos conectivos, de um cursinho de concursos. Indicado pela
      descrição do episódio, sem conferência do conteúdo; não se sabe quais conectores são
      tratados nem se fala do Cebraspe. Bom para ouvir no caminho, depois de ler o texto.
  - tipo: link
    titulo: Este/esse, esta/essa, isto/isso — Manual de Comunicação da Secom
    url: https://www12.senado.leg.br/manualdecomunicacao/estilos/este-esse-esta-essa-isto-isso
    autor: Senado Federal, Secretaria de Comunicação Social
    descricao: >-
      Leitura curta e oficial do Legislativo: os demonstrativos no tempo, no espaço e no texto
      ("este" antecipa, "esse" retoma), com exemplos de notícias do Senado e a correção de um
      caso real. Não traz o par "este" (o último citado) × "aquele" (o primeiro): esse ponto
      está no texto da aula.
