<text x="328.5" y="218" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">minutes</text>
<text x="328.5" y="252" font-size="12" fill="#1c5cab" text-anchor="middle" font-weight="700">núcleo</text>
<line x1="270" y1="248" x2="44" y2="248" stroke="#b4501f" stroke-width="2" marker-end="url(#a)"/>
