<text x="166.0" y="318" font-size="17" fill="#0b0b0b" text-anchor="middle">official</text>
<rect x="234" y="290" width="171" height="44" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
<text x="319.5" y="318" font-size="17" fill="#0b0b0b" text-anchor="middle">parliamentary</text>
<rect x="415" y="290" width="94" height="44" rx="8" fill="#1c5cab"/>
<text x="462.0" y="318" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">record</text>
