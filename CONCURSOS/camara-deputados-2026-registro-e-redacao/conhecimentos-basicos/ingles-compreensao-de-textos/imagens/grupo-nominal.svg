<text x="345.0" y="118" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">software</text>
<text x="345.0" y="152" font-size="12" fill="#1c5cab" text-anchor="middle" font-weight="700">núcleo</text>
