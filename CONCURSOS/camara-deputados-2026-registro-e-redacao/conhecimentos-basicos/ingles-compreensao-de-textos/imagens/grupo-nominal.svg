<text x="560" y="332" font-size="18" font-weight="700" fill="#0b0b0b">o registro parlamentar oficial</text>
<rect x="24" y="392" width="952" height="56" rx="10" fill="#fdf0e6" stroke="#b4501f" stroke-dasharray="6 4"/>
<text x="40" y="416" font-size="15" fill="#0b0b0b"><tspan font-weight="700" fill="#b4501f">Cuidado: </tspan><tspan font-style="italic">speech recognition software</tspan> é um <tspan font-weight="700">software</tspan>, e não uma fala;</text>
<text x="40" y="437" font-size="15" fill="#0b0b0b"><tspan font-style="italic">committee meeting minutes</tspan> são <tspan font-weight="700">atas</tspan>, e não uma comissão.</text>
