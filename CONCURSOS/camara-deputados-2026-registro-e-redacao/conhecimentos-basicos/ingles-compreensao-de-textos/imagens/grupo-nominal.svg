<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b4501f"/></marker></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="24" y="36" font-size="21" font-weight="700" fill="#0b0b0b">Grupo nominal: comece pelo último substantivo</text>
<text x="24" y="62" font-size="14" fill="#52514e">Em inglês, os modificadores vêm antes do núcleo. Leia de trás para a frente.</text>
<rect x="24" y="90" width="94" height="44" rx="8" fill="#e3edf9" stroke="#b8cfee"/>
<text x="71.0" y="118" font-size="17" fill="#0b0b0b" text-anchor="middle">speech</text>
