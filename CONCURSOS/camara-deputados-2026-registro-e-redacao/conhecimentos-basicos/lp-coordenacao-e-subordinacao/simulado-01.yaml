      Segundo as orientações do Manual de Redação da Presidência da República sobre paralelismo, a substituição de “o critério de repasse” (linha 7) por “como os recursos serão repassados” preservaria o paralelismo sintático entre os elementos ligados por “não só” (linha 6) e “mas também” (linhas 6 e 7).
