<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- Título -->
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Um período com coordenação e subordinação</text>

  <!-- O período -->
  <rect x="24" y="56" width="952" height="70" rx="10" fill="#f6f5f1" stroke="#dcdad3"/>
  <text x="40" y="84" font-size="15" fill="#0b0b0b">O relator <tspan font-weight="700">leu</tspan> o parecer, e o Plenário <tspan font-weight="700">aprovou</tspan> o texto que a comissão <tspan font-weight="700">havia emendado</tspan>,</text>
  <text x="40" y="108" font-size="15" fill="#0b0b0b">embora a oposição <tspan font-weight="700">pedisse</tspan> o adiamento.</text>

  <!-- Ligações -->
  <g stroke="#8c8b85" stroke-width="1.5" fill="none">
    <!-- coordenação 1 — 2 -->
    <line x1="400" y1="215" x2="560" y2="215"/>
    <!-- oração 2 -> 3 e 4 -->
    <line x1="750" y1="280" x2="750" y2="318"/>
    <line x1="455" y1="318" x2="820" y2="318"/>
    <line x1="455" y1="318" x2="455" y2="348"/>
    <line x1="820" y1="318" x2="820" y2="348"/>
  </g>

  <!-- Rótulo da coordenação -->
  <rect x="452" y="199" width="56" height="32" rx="16" fill="#1c5cab"/>
  <text x="480" y="221" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">e</text>
  <text x="480" y="188" font-size="13" font-weight="700" fill="#1c5cab" text-anchor="middle">coordenação</text>

  <!-- Rótulo da subordinação -->
  <text x="762" y="306" font-size="13" font-weight="700" fill="#12805a">subordinação</text>

  <!-- Oração 1 -->
  <g transform="translate(40 150)">
    <rect width="360" height="130" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <circle cx="28" cy="30" r="14" fill="#1c5cab"/>
    <text x="28" y="35" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="52" y="35" font-size="15" font-weight="700" fill="#0b0b0b">O relator leu o parecer,</text>
    <text x="16" y="76" font-size="14" font-weight="700" fill="#1c5cab">coordenada assindética</text>
    <text x="16" y="100" font-size="13" fill="#52514e">sem conjunção; não é termo de outra oração</text>
  </g>

  <!-- Oração 2 -->
  <g transform="translate(560 150)">
    <rect width="400" height="130" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <circle cx="28" cy="30" r="14" fill="#1c5cab"/>
    <text x="28" y="35" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="52" y="35" font-size="15" font-weight="700" fill="#0b0b0b">e o Plenário aprovou o texto</text>
    <text x="16" y="76" font-size="14" font-weight="700" fill="#1c5cab">coordenada sindética aditiva</text>
    <text x="16" y="100" font-size="13" fill="#52514e">e, ao mesmo tempo, principal das orações 3 e 4</text>
  </g>

  <!-- Oração 3 -->
  <g transform="translate(270 348)">
    <rect width="370" height="130" rx="10" fill="#e4f5ee" stroke="#a9dcc6"/>
    <circle cx="28" cy="30" r="14" fill="#12805a"/>
    <text x="28" y="35" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="52" y="35" font-size="15" font-weight="700" fill="#0b0b0b">que a comissão havia emendado,</text>
    <text x="16" y="76" font-size="14" font-weight="700" fill="#12805a">subordinada adjetiva restritiva</text>
    <text x="16" y="100" font-size="13" fill="#52514e">liga-se ao substantivo “texto”</text>
  </g>

  <!-- Oração 4 -->
  <g transform="translate(655 348)">
    <rect width="321" height="130" rx="10" fill="#e4f5ee" stroke="#a9dcc6"/>
    <circle cx="28" cy="30" r="14" fill="#12805a"/>
    <text x="28" y="35" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="52" y="28" font-size="15" font-weight="700" fill="#0b0b0b">embora a oposição pedisse</text>
    <text x="52" y="48" font-size="15" font-weight="700" fill="#0b0b0b">o adiamento.</text>
    <text x="16" y="84" font-size="14" font-weight="700" fill="#12805a">subordinada adverbial concessiva</text>
    <text x="16" y="108" font-size="13" fill="#52514e">liga-se ao verbo “aprovou”</text>
  </g>

  <!-- Pé -->
  <rect x="24" y="500" width="952" height="78" rx="10" fill="#f6f5f1" stroke="#dcdad3"/>
  <text x="40" y="526" font-size="14" fill="#0b0b0b"><tspan font-weight="700">4 verbos, 4 orações:</tspan> leu · aprovou · havia emendado (locução verbal: conta uma vez) · pedisse.</text>
  <text x="40" y="548" font-size="14" fill="#0b0b0b"><tspan font-weight="700">Lado a lado:</tspan> coordenação. <tspan font-weight="700">Para baixo:</tspan> subordinação.</text>
  <text x="40" y="568" font-size="13" fill="#52514e">A oração 2 é coordenada à 1 e principal da 3 e da 4.</text>
</svg>
