  - id: q06
    topico: conhecimentos-basicos/lp-reescrita-estrutura-e-formalidade
    enunciado: |-
      Texto para o item: notícia fictícia sobre a audiência pública de uma comissão, com as linhas numeradas.

      > **Texto I**
      >
      > 1. A comissão especial do projeto das bibliotecas itinerantes
      > 2. realizou ontem a sua terceira audiência pública. O presidente do
      > 3. colegiado informou, no início dos trabalhos, que os convidados
      > 4. haviam sido escolhidos na reunião anterior. A secretaria
      > 5. distribuiu cópias do parecer aos presentes. Só os deputados
      > 6. inscritos fizeram perguntas aos convidados. A relatora acolheu
      > 7. duas emendas da oposição. “Não aceitarei mudanças neste artigo”,
      > 8. afirmou ela, ao tratar do dispositivo que define a fonte dos
      > 9. recursos. O portal da Casa recebeu mais de duzentas sugestões de
      > 10. cidadãos. A relatora prometeu examiná-las até o fim do mês.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      Os dois últimos períodos do texto (linhas 9 e 10) poderiam ser reunidos em um só, sem prejuízo da correção gramatical e do sentido original do texto, da seguinte forma: Recebendo mais de duzentas sugestões de cidadãos, a relatora prometeu examiná-las até o fim do mês.
  - id: q07
    topico: conhecimentos-basicos/lp-reescrita-estrutura-e-formalidade
    enunciado: |-
      Texto para o item: mensagem fictícia que um servidor enviou aos colegas do seu setor, em um grupo de mensagens, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Pessoal, o fechamento do boletim ficou pra amanhã de manhã,
      > 2. porque as fotos da audiência ainda não chegaram. A gente se
      > 3. encontra às 9h, na sala de sempre. Se der, tragam o notebook.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      Caso se pretendesse transformar o texto II em comunicado formal do setor, a seguinte reescrita seria adequada ao novo nível de formalidade e preservaria todas as informações da mensagem original: Informamos que o fechamento do boletim foi adiado para amanhã de manhã. A equipe se reunirá às 9 horas, na sala habitual. Solicita-se aos servidores que tragam, se possível, o computador portátil.
  - id: q08
    topico: conhecimentos-basicos/lp-reescrita-estrutura-e-formalidade
    enunciado: |-
      Texto para o item: mensagem fictícia que um servidor enviou aos colegas do seu setor, em um grupo de mensagens, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Pessoal, o fechamento do boletim ficou pra amanhã de manhã,
      > 2. porque as fotos da audiência ainda não chegaram. A gente se
      > 3. encontra às 9h, na sala de sempre. Se der, tragam o notebook.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No texto II, formas como “pra” (linha 1) e “A gente” (linha 2) são marcas de informalidade compatíveis com a situação comunicativa em que a mensagem foi produzida.
