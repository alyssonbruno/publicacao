# Treino de reorganização de orações e períodos e de reescrita em outros gêneros e níveis de formalidade — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Reescrita, reorganização de orações e períodos, gêneros e níveis de formalidade
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre dois textos próprios e fictícios (notícia da audiência pública de uma comissão e mensagem informal entre colegas de um setor), no estilo de certo ou errado do Cebraspe: trecho entre aspas com remissão à linha, uma proposta de deslocamento ou de reescrita e um comando sobre a correção gramatical ou o sentido.'
    - 'Referências de estilo, sem reprodução de itens: provas do Cebraspe com gabarito definitivo — Câmara dos Deputados 2025 (Conhecimentos Gerais, aplicada em 8/3/2026), TCU 2025 (Auditor Federal de Controle Externo, aplicada em 22/2/2026), CNJ 2024 (Conhecimentos Básicos) e Câmara dos Deputados 2012 (Analista Legislativo, Taquígrafo Legislativo).'
    - 'Bases do gabarito: Manual de Redação da Presidência da República, 3ª ed. (2018), itens 3.1, 3.6 e 11.1; Manual de linguagem simples, de Patrícia Roedel (Câmara dos Deputados, Edições Câmara, 2024); Toda Matéria, Vozes verbais, Tipos de discurso e Níveis de linguagem; Norma Culta, Vozes verbais; Luiz Felipe Durval, Reescritura de frases: desvendando questões CEBRASPE (Estratégia Concursos, 2021). Consultados em 12/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-reescrita-estrutura-e-formalidade
    enunciado: |-
      Texto para o item: notícia fictícia sobre a audiência pública de uma comissão, com as linhas numeradas.

      > **Texto I**
      >
      > 1. A comissão especial do projeto das bibliotecas itinerantes
      > 2. realizou ontem a sua terceira audiência pública. O presidente do
      > 3. colegiado informou, no início dos trabalhos, que os convidados
      > 4. haviam sido escolhidos na reunião anterior. A secretaria
      > 5. distribuiu cópias do parecer aos presentes. Só os deputados
      > 6. inscritos fizeram perguntas aos convidados. A relatora acolheu
      > 7. duas emendas da oposição. “Não aceitarei mudanças neste artigo”,
      > 8. afirmou ela, ao tratar do dispositivo que define a fonte dos
      > 9. recursos. O portal da Casa recebeu mais de duzentas sugestões de
      > 10. cidadãos. A relatora prometeu examiná-las até o fim do mês.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      O deslocamento da expressão “na reunião anterior” (linha 4) para o início do período em que ela ocorre, seguida de vírgula e feitos os devidos ajustes de maiúsculas e minúsculas, manteria a correção gramatical e o sentido original do texto.
