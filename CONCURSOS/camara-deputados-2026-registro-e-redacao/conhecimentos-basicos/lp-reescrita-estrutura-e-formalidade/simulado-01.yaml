      > 10. cidadãos. A relatora prometeu examiná-las até o fim do mês.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      A correção gramatical do texto seria mantida caso o período “A secretaria distribuiu cópias do parecer aos presentes” (linhas 4 e 5) fosse reescrito da seguinte forma: Distribuíram-se cópias do parecer aos presentes.
  - id: q03
    topico: conhecimentos-basicos/lp-reescrita-estrutura-e-formalidade
    enunciado: |-
      Texto para o item: notícia fictícia sobre a audiência pública de uma comissão, com as linhas numeradas.

      > **Texto I**
      >
      > 1. A comissão especial do projeto das bibliotecas itinerantes
      > 2. realizou ontem a sua terceira audiência pública. O presidente do
      > 3. colegiado informou, no início dos trabalhos, que os convidados
      > 4. haviam sido escolhidos na reunião anterior. A secretaria
      > 5. distribuiu cópias do parecer aos presentes. Só os deputados
      > 6. inscritos fizeram perguntas aos convidados. A relatora acolheu
      > 7. duas emendas da oposição. “Não aceitarei mudanças neste artigo”,
