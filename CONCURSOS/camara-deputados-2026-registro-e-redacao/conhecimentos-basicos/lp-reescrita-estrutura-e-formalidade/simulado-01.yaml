      > 9. recursos. O portal da Casa recebeu mais de duzentas sugestões de
      > 10. cidadãos. A relatora prometeu examiná-las até o fim do mês.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      O deslocamento do vocábulo “Só” (linha 5) para imediatamente antes de “aos convidados” (linha 6), feitos os devidos ajustes de maiúsculas e minúsculas, manteria a correção gramatical do texto, mas alteraria o seu sentido original.
