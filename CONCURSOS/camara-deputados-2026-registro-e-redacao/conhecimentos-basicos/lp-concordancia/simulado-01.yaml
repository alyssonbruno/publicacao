      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No trecho “seguem anexas ao parecer as notas técnicas” (linhas 5 e 6), o vocábulo “anexas” está flexionado no feminino plural porque concorda com “as notas técnicas”.
