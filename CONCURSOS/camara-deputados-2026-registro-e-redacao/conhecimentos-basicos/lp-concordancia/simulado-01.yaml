      > 2. deputados registrou presença logo no início. A ata e o relatório
      > 3. lidos pela secretária foram aprovados sem ressalvas. Falaram, em
      > 4. seguida, o líder do governo e os vice-líderes, e a relatora, meio
      > 5. cansada depois de bastantes horas de debate, informou que seguem
