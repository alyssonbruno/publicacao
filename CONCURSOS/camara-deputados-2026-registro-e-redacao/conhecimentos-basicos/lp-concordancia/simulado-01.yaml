# Treino de concordância verbal e nominal — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Concordância verbal e nominal
  tipo: treino
  estilo: certo_errado
  fontes:
    - 'Questões próprias, sobre um texto próprio e fictício (notícia de uma reunião de comissão), no estilo de certo ou errado do Cebraspe: trecho do texto entre aspas, com remissão à linha, e uma afirmação por item, sobre a troca de uma forma e a correção gramatical ou sobre o termo com que uma forma concorda.'
    - 'Referências de estilo, sem reprodução de itens: provas objetivas de Conhecimentos Gerais do Cebraspe para a Câmara dos Deputados (Edital nº 1/2025, nível superior, aplicada em 2026) e para Analista Judiciário do TRF da 6ª Região (edital de 2024, aplicada em 2025), com os gabaritos definitivos.'
    - 'Bases do gabarito: Manual de Redação da Presidência da República, 3ª ed. (2018), item 11.7; Manual de Comunicação da Secom do Senado Federal, verbete Concordância verbal; Só Português, Sintaxe de concordância e Concordância nominal (casos particulares). Consultados em 12/10/2026 e relidos em 13/10/2026.'
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-concordancia
    enunciado: |-
      Texto para o item: notícia fictícia sobre uma reunião de comissão, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Na reunião de ontem da comissão, grande parte das sugestões enviadas
      > 2. pelos cidadãos foi lida em voz alta. Entrou na pauta, em seguida, o
      > 3. relatório do grupo de trabalho e duas emendas de redação. A consultora,
      > 4. meio cansada depois de bastantes horas de debate, apresentou um
      > 5. gráfico e uma tabela atualizados e informou que vão inclusas no
      > 6. processo as planilhas de custos. O prazo fixado pelos líderes para a
      > 7. entrega dos destaques termina amanhã. Segundo a assessoria, deve
      > 8. haver novas audiências públicas até o fim do mês. Definiram-se, por
      > 9. fim, os critérios de escolha dos convidados.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No trecho “grande parte das sugestões enviadas pelos cidadãos foi lida em voz alta” (linhas 1 e 2), a substituição de “foi lida” por foram lidas manteria a correção gramatical do texto.
