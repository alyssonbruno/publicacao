<svg xmlns="http://www.w3.org/2000/svg" width="912" height="600" viewBox="0 0 912 600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="912" height="600" fill="#ffffff"/>

  <!-- Título -->
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">“Um dos que”, “um ou outro”, “um e outro”: o que cada fonte diz</text>
  <text x="24" y="62" font-size="14" fill="#52514e">O verbo fica no singular ou no plural? Os manuais oficiais só divergem na primeira linha.</text>

  <!-- Cabeçalhos das colunas -->
  <g font-size="15" font-weight="700" fill="#1c5cab" text-anchor="middle">
    <text x="300" y="98">Manual de Redação</text>
    <text x="300" y="117">da Presidência</text>
    <text x="540" y="98">Manual de Comunicação</text>
    <text x="540" y="117">do Senado</text>
    <text x="780" y="108">Só Português</text>
  </g>

  <!-- Linha 1: um dos que -->
  <g transform="translate(0 132)">
    <rect x="24" width="150" height="96" rx="10" fill="#f4f3ee" stroke="#e1e0d9"/>
    <text x="99" y="54" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">“um dos que”</text>
    <rect x="184" width="232" height="96" rx="10" fill="#fdf0e6" stroke="#f0c3a6"/>
    <text x="200" y="30" font-size="15" font-weight="700" fill="#b4501f">singular ou plural</text>
    <text x="200" y="54" font-size="13" fill="#0b0b0b">admite as duas formas;</text>
    <text x="200" y="74" font-size="13" fill="#0b0b0b">o plural prevalece no uso atual</text>
    <rect x="424" width="232" height="96" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="440" y="30" font-size="15" font-weight="700" fill="#1c5cab">plural</text>
    <text x="440" y="54" font-size="13" fill="#0b0b0b">“o verbo fica no plural”</text>
    <rect x="664" width="232" height="96" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="680" y="30" font-size="15" font-weight="700" fill="#1c5cab">plural, de preferência</text>
    <text x="680" y="54" font-size="13" fill="#0b0b0b">registra que alguns gramáticos</text>
    <text x="680" y="74" font-size="13" fill="#0b0b0b">consideram facultativo</text>
  </g>

  <!-- Linha 2: um ou outro -->
  <g transform="translate(0 236)">
    <rect x="24" width="150" height="80" rx="10" fill="#f4f3ee" stroke="#e1e0d9"/>
    <text x="99" y="46" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">“um ou outro”</text>
    <rect x="184" width="232" height="80" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="200" y="30" font-size="15" font-weight="700" fill="#1c5cab">singular</text>
    <text x="200" y="54" font-size="13" fill="#0b0b0b">a locução “exige” o singular</text>
    <rect x="424" width="232" height="80" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="440" y="30" font-size="15" font-weight="700" fill="#1c5cab">singular</text>
    <text x="440" y="54" font-size="13" fill="#0b0b0b">“o verbo fica no singular”</text>
    <rect x="664" width="232" height="80" rx="10" fill="#fdf0e6" stroke="#f0c3a6"/>
    <text x="680" y="30" font-size="15" font-weight="700" fill="#b4501f">costuma ser singular</text>
    <text x="680" y="54" font-size="13" fill="#0b0b0b">o plural também é praticado</text>
  </g>

  <!-- Linha 3: nem um nem outro -->
  <g transform="translate(0 324)">
    <rect x="24" width="150" height="80" rx="10" fill="#f4f3ee" stroke="#e1e0d9"/>
    <text x="99" y="38" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">“nem um</text>
    <text x="99" y="58" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">nem outro”</text>
    <rect x="184" width="232" height="80" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="200" y="30" font-size="15" font-weight="700" fill="#1c5cab">singular</text>
    <text x="200" y="54" font-size="13" fill="#0b0b0b">a locução “exige” o singular</text>
    <rect x="424" width="232" height="80" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <text x="440" y="30" font-size="15" font-weight="700" fill="#1c5cab">singular</text>
    <text x="440" y="54" font-size="13" fill="#0b0b0b">“o verbo fica no singular”</text>
    <rect x="664" width="232" height="80" rx="10" fill="#fdf0e6" stroke="#f0c3a6"/>
    <text x="680" y="30" font-size="15" font-weight="700" fill="#b4501f">costuma ser singular</text>
    <text x="680" y="54" font-size="13" fill="#0b0b0b">o plural também é praticado</text>
  </g>

  <!-- Linha 4: um e outro -->
  <g transform="translate(0 412)">
    <rect x="24" width="150" height="80" rx="10" fill="#f4f3ee" stroke="#e1e0d9"/>
    <text x="99" y="46" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="middle">“um e outro”</text>
    <rect x="184" width="232" height="80" rx="10" fill="#fdf0e6" stroke="#f0c3a6"/>
    <text x="200" y="30" font-size="15" font-weight="700" fill="#b4501f">singular ou plural</text>
    <text x="200" y="54" font-size="13" fill="#0b0b0b">o substantivo fica no singular</text>
    <rect x="424" width="232" height="80" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
    <text x="440" y="46" font-size="13" fill="#52514e">não trata</text>
    <rect x="664" width="232" height="80" rx="10" fill="#ffffff" stroke="#e1e0d9"/>
    <text x="680" y="46" font-size="13" fill="#52514e">não trata</text>
  </g>

  <!-- Pé -->
  <line x1="24" y1="512" x2="888" y2="512" stroke="#e1e0d9"/>
  <text x="24" y="540" font-size="14" fill="#0b0b0b">Os manuais oficiais só divergem em “um dos que”: ali, o <tspan font-weight="700">plural</tspan> atende às três fontes.</text>
  <text x="24" y="562" font-size="14" fill="#0b0b0b">Em “um ou outro” e “nem um nem outro”, os dois manuais mandam o <tspan font-weight="700">singular</tspan>.</text>
  <text x="24" y="584" font-size="13" fill="#52514e">Azul: uma forma só. Laranja: a fonte admite ou registra duas formas.</text>
</svg>
