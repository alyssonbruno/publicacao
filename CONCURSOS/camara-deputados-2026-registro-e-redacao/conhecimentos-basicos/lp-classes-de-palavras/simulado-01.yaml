# Treino de classes de palavras — Câmara dos Deputados 2026, Analista Legislativo, Registro e Redação. Só os enunciados: o gabarito comentado fica no repositório privado.
simulado:
  titulo: Treino — Classes de palavras
  tipo: treino
  estilo: certo_errado
  fontes:
    - >-
      Questões próprias, sobre um texto próprio e fictício (relato de uma sessão legislativa),
      no estilo de certo ou errado do Cebraspe: a palavra entre aspas, com remissão à linha, e
      uma afirmação por item sobre a classe da palavra, a mesma classificação em duas
      ocorrências, a mudança de classe, a troca e o deslocamento.
    - >-
      Referências de estilo, sem cópia de itens: itens de morfologia do Cespe/Cebraspe (2013 a
      2021) listados no Estude Grátis, nos formatos “recebe a mesma classificação”, “pertencem
      à mesma classe gramatical” e “foram empregados como substantivos”.
    - >-
      Bases do gabarito: Lei Complementar nº 95/1998 (art. 10) e Manual de Redação da
      Presidência da República (3ª ed., 2018); Só Português (derivação imprópria, pronomes
      demonstrativos, pronome relativo “que” e emprego dos numerais); PrePara ENEM (“que”
      integrante × relativo, funções do “se”, morfossintaxe do “como”, pronomes indefinidos e
      o pronome “todo”); Elias Santana, blog do Gran Cursos Online (“O SE”); Martin Hummel,
      revista Confluência (adjetivo adverbializado). Consultados em 11/10/2026.
questoes:
  - id: q01
    topico: conhecimentos-basicos/lp-classes-de-palavras
    enunciado: |-
      Texto para o item: relato fictício de uma sessão legislativa, com as linhas numeradas.

      > **Texto**
      >
      > 1. Na sessão de ontem, discutiu-se até tarde o projeto que altera as
      > 2. regras de publicidade das reuniões de comissão. Como prevê o
      > 3. Regimento, o relator leu o parecer antes da votação. Falou claro e
      > 4. sem pressa, e os taquígrafos, atentos, registraram cada aparte.
      > 5. Certo deputado pediu a palavra para dizer que o texto ainda tinha
      > 6. lacunas; outro lembrou que o art. 10 do projeto repetia o que já
      > 7. constava da lei em vigor. Aprovaram-se, ao fim, três emendas, e
      > 8. dois parlamentares se queixaram do horário. O presidente encerrou
      > 9. a sessão perto da meia-noite, e todo o plenário aplaudiu a decisão
      > 10. de publicar as notas taquigráficas no mesmo dia. Para a equipe de
      > 11. redação, o difícil não é transcrever: é preservar, no texto final,
      > 12. o falar de cada orador.

      Com base no texto e em seus aspectos gramaticais, julgue o item.

      No trecho “discutiu-se até tarde o projeto” (linha 1), o vocábulo “se” é índice de indeterminação do sujeito.
  - id: q02
    topico: conhecimentos-basicos/lp-classes-de-palavras
    enunciado: |-
      Texto para o item: relato fictício de uma sessão legislativa, com as linhas numeradas.

