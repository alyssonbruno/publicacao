      Com base no texto e em seus aspectos gramaticais, julgue o item.

      No trecho “o art. 10 do projeto” (linha 6), o emprego do numeral cardinal está de acordo com a regra de numeração dos artigos das leis, segundo a qual o ordinal é empregado apenas até o nono artigo.
