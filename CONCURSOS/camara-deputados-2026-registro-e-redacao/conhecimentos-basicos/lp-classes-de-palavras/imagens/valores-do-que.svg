<svg xmlns="http://www.w3.org/2000/svg" width="760" height="692" viewBox="0 0 760 692" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="692" fill="#ffffff"/>
  <g font-size="13" font-weight="700" fill="#52514e">
  <text x="28" y="34">Valor</text>
  <text x="208" y="34">Teste</text>
  <text x="464" y="34">Exemplo</text>
  </g>
  <line x1="16" y1="44" x2="744" y2="44" stroke="#0b0b0b" stroke-width="1.5"/>
  <rect x="16" y="52" width="728" height="60" rx="6" fill="#dff3ea" stroke="#12805a" stroke-width="1.2"/>
  <line x1="196" y1="60" x2="196" y2="104" stroke="#12805a" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="60" x2="452" y2="104" stroke="#12805a" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="77.5" font-size="14" font-weight="700" fill="#0e6b4b">Pronome</text>
  <text x="28" y="96.5" font-size="14" font-weight="700" fill="#0e6b4b">relativo</text>
  <text x="208" y="77.4" font-size="13.5" fill="#0b0b0b">retoma um termo anterior;</text>
  <text x="208" y="96.4" font-size="13.5" fill="#0b0b0b">troca por “o qual”</text>
  <text x="464" y="77.5" font-size="14" fill="#0b0b0b">O projeto <tspan font-weight="700" fill="#0e6b4b">que</tspan> altera o Regimento</text>
  <text x="464" y="96.5" font-size="14" fill="#0b0b0b">voltou à pauta. (= o qual)</text>
  <rect x="16" y="118" width="728" height="60" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.2"/>
  <line x1="196" y1="126" x2="196" y2="170" stroke="#256abf" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="126" x2="452" y2="170" stroke="#256abf" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="143.5" font-size="14" font-weight="700" fill="#1c5cab">Conjunção</text>
  <text x="28" y="162.5" font-size="14" font-weight="700" fill="#1c5cab">integrante</text>
  <text x="208" y="143.4" font-size="13.5" fill="#0b0b0b">não retoma nada;</text>
  <text x="208" y="162.4" font-size="13.5" fill="#0b0b0b">a oração vira “isso”</text>
  <text x="464" y="143.5" font-size="14" fill="#0b0b0b">O relator afirmou <tspan font-weight="700" fill="#1c5cab">que</tspan> o texto</text>
  <text x="464" y="162.5" font-size="14" fill="#0b0b0b">tinha lacunas. (= afirmou isso)</text>
  <rect x="16" y="184" width="728" height="60" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.2"/>
  <line x1="196" y1="192" x2="196" y2="236" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="192" x2="452" y2="236" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="209.5" font-size="14" font-weight="700" fill="#8a5a00">Conjunção</text>
  <text x="28" y="228.5" font-size="14" font-weight="700" fill="#8a5a00">consecutiva</text>
  <text x="208" y="209.4" font-size="13.5" fill="#0b0b0b">vem depois de “tão”, “tanto”,</text>
  <text x="208" y="228.4" font-size="13.5" fill="#0b0b0b">“tal” ou “tamanho”</text>
  <text x="464" y="209.5" font-size="14" fill="#0b0b0b">A sessão foi tão longa <tspan font-weight="700" fill="#8a5a00">que</tspan> a pauta</text>
  <text x="464" y="228.5" font-size="14" fill="#0b0b0b">não terminou.</text>
  <rect x="16" y="250" width="728" height="79" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.2"/>
  <line x1="196" y1="258" x2="196" y2="321" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="258" x2="452" y2="321" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="285.0" font-size="14" font-weight="700" fill="#8a5a00">Conjunção</text>
  <text x="28" y="304.0" font-size="14" font-weight="700" fill="#8a5a00">comparativa</text>
  <text x="208" y="275.4" font-size="13.5" fill="#0b0b0b">vem depois de “mais”, “menos”,</text>
  <text x="208" y="294.4" font-size="13.5" fill="#0b0b0b">“melhor”, “pior”, “maior” ou</text>
  <text x="208" y="313.4" font-size="13.5" fill="#0b0b0b">“menor”; = “do que”</text>
  <text x="464" y="285.0" font-size="14" fill="#0b0b0b">O substitutivo é mais curto <tspan font-weight="700" fill="#8a5a00">que</tspan></text>
  <text x="464" y="304.0" font-size="14" fill="#0b0b0b">o original e melhor <tspan font-weight="700" fill="#8a5a00">que</tspan> ele.</text>
  <rect x="16" y="335" width="728" height="60" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.2"/>
  <line x1="196" y1="343" x2="196" y2="387" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="343" x2="452" y2="387" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="360.5" font-size="14" font-weight="700" fill="#8a5a00">Conjunção</text>
  <text x="28" y="379.5" font-size="14" font-weight="700" fill="#8a5a00">explicativa</text>
  <text x="208" y="369.9" font-size="13.5" fill="#0b0b0b">equivale a “pois”</text>
  <text x="464" y="370.0" font-size="14" fill="#0b0b0b">Aguardem, <tspan font-weight="700" fill="#8a5a00">que</tspan> a votação já começa.</text>
  <rect x="16" y="401" width="728" height="79" rx="6" fill="#f3f2ee" stroke="#8c8a84" stroke-width="1.2"/>
  <line x1="196" y1="409" x2="196" y2="472" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="409" x2="452" y2="472" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="436.0" font-size="14" font-weight="700" fill="#3d3c39">Pronome</text>
  <text x="28" y="455.0" font-size="14" font-weight="700" fill="#3d3c39">interrogativo</text>
  <text x="208" y="426.4" font-size="13.5" fill="#0b0b0b">abre a pergunta, direta ou</text>
  <text x="208" y="445.4" font-size="13.5" fill="#0b0b0b">indireta: sozinho (“que”, “o que”)</text>
  <text x="208" y="464.4" font-size="13.5" fill="#0b0b0b">ou junto de um substantivo</text>
  <text x="464" y="426.5" font-size="14" fill="#0b0b0b"><tspan font-weight="700" fill="#3d3c39">Que</tspan> houve? <tspan font-weight="700" fill="#3d3c39">O que</tspan> foi votado?</text>
  <text x="464" y="445.5" font-size="14" fill="#0b0b0b"><tspan font-weight="700" fill="#3d3c39">Que</tspan> emenda foi retirada?</text>
  <text x="464" y="464.5" font-size="14" fill="#0b0b0b">Quis saber <tspan font-weight="700" fill="#3d3c39">que</tspan> emenda caiu.</text>
  <rect x="16" y="486" width="728" height="60" rx="6" fill="#f3f2ee" stroke="#8c8a84" stroke-width="1.2"/>
  <line x1="196" y1="494" x2="196" y2="538" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="494" x2="452" y2="538" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="511.5" font-size="14" font-weight="700" fill="#3d3c39">Advérbio de</text>
  <text x="28" y="530.5" font-size="14" font-weight="700" fill="#3d3c39">intensidade</text>
  <text x="208" y="511.4" font-size="13.5" fill="#0b0b0b">vem antes de adjetivo ou de</text>
  <text x="208" y="530.4" font-size="13.5" fill="#0b0b0b">advérbio e o intensifica</text>
  <text x="464" y="521.0" font-size="14" fill="#0b0b0b"><tspan font-weight="700" fill="#3d3c39">Que</tspan> longa foi a sessão!</text>
  <rect x="16" y="552" width="728" height="60" rx="6" fill="#f3f2ee" stroke="#8c8a84" stroke-width="1.2"/>
  <line x1="196" y1="560" x2="196" y2="604" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="560" x2="452" y2="604" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="577.5" font-size="14" font-weight="700" fill="#3d3c39">Realce</text>
  <text x="28" y="596.5" font-size="14" font-weight="700" fill="#3d3c39">(“é que”)</text>
  <text x="208" y="577.4" font-size="13.5" fill="#0b0b0b">sai junto com o “é”,</text>
  <text x="208" y="596.4" font-size="13.5" fill="#0b0b0b">sem mudar o sentido</text>
  <text x="464" y="577.5" font-size="14" fill="#0b0b0b">O Plenário é <tspan font-weight="700" fill="#3d3c39">que</tspan> decide.</text>
  <text x="464" y="596.5" font-size="14" fill="#0b0b0b">→ O Plenário decide.</text>
  <rect x="16" y="618" width="728" height="60" rx="6" fill="#f3f2ee" stroke="#8c8a84" stroke-width="1.2"/>
  <line x1="196" y1="626" x2="196" y2="670" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="626" x2="452" y2="670" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="643.5" font-size="14" font-weight="700" fill="#3d3c39">Substantivo</text>
  <text x="28" y="662.5" font-size="14" font-weight="700" fill="#3d3c39">(“quê”)</text>
  <text x="208" y="643.4" font-size="13.5" fill="#0b0b0b">tem determinante</text>
  <text x="208" y="662.4" font-size="13.5" fill="#0b0b0b">e acento</text>
  <text x="464" y="643.5" font-size="14" fill="#0b0b0b">O discurso tinha um <tspan font-weight="700" fill="#3d3c39">quê</tspan></text>
  <text x="464" y="662.5" font-size="14" fill="#0b0b0b">de despedida.</text>
</svg>
