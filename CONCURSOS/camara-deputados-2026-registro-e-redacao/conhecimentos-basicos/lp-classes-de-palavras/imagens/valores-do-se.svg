<svg xmlns="http://www.w3.org/2000/svg" width="760" height="555" viewBox="0 0 760 555" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="555" fill="#ffffff"/>
  <g font-size="13" font-weight="700" fill="#52514e">
  <text x="28" y="34">Valor</text>
  <text x="208" y="34">Teste</text>
  <text x="464" y="34">Exemplo</text>
  </g>
  <line x1="16" y1="44" x2="744" y2="44" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="18" y="68" font-size="13" font-weight="700" fill="#0b0b0b" letter-spacing="0.6">CONJUNÇÃO: liga orações</text>
  <rect x="16" y="78" width="728" height="41" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.2"/>
  <line x1="196" y1="86" x2="196" y2="111" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="86" x2="452" y2="111" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="103.5" font-size="14" font-weight="700" fill="#8a5a00">Condicional</text>
  <text x="208" y="103.4" font-size="13.5" fill="#0b0b0b">equivale a “caso”</text>
  <text x="464" y="103.5" font-size="14" fill="#0b0b0b"><tspan font-weight="700" fill="#8a5a00">Se</tspan> houver quórum, a votação começa.</text>
  <rect x="16" y="125" width="728" height="60" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.2"/>
  <line x1="196" y1="133" x2="196" y2="177" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="133" x2="452" y2="177" stroke="#c98500" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="160.0" font-size="14" font-weight="700" fill="#8a5a00">Integrante</text>
  <text x="208" y="159.9" font-size="13.5" fill="#0b0b0b">a oração vira “isso”</text>
  <text x="464" y="150.5" font-size="14" fill="#0b0b0b">O presidente perguntou <tspan font-weight="700" fill="#8a5a00">se</tspan> havia</text>
  <text x="464" y="169.5" font-size="14" fill="#0b0b0b">acordo. (= perguntou isso)</text>
  <text x="18" y="207" font-size="13" font-weight="700" fill="#0b0b0b" letter-spacing="0.6">PRONOME: preso ao verbo</text>
  <rect x="16" y="217" width="728" height="79" rx="6" fill="#dff3ea" stroke="#12805a" stroke-width="1.2"/>
  <line x1="196" y1="225" x2="196" y2="288" stroke="#12805a" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="225" x2="452" y2="288" stroke="#12805a" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="261.5" font-size="14" font-weight="700" fill="#0e6b4b">Apassivador</text>
  <text x="208" y="242.4" font-size="13.5" fill="#0b0b0b">verbo transitivo direto; sujeito</text>
  <text x="208" y="261.4" font-size="13.5" fill="#0b0b0b">sem preposição; verbo concorda;</text>
  <text x="208" y="280.4" font-size="13.5" fill="#0b0b0b">teste: a passiva com “ser”</text>
  <text x="464" y="252.0" font-size="14" fill="#0b0b0b">Aprovaram-<tspan font-weight="700" fill="#0e6b4b">se</tspan> as emendas.</text>
  <text x="464" y="271.0" font-size="14" fill="#0b0b0b">→ As emendas foram aprovadas.</text>
  <rect x="16" y="302" width="728" height="79" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.2"/>
  <line x1="196" y1="310" x2="196" y2="373" stroke="#256abf" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="310" x2="452" y2="373" stroke="#256abf" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="327.5" font-size="14" font-weight="700" fill="#1c5cab">Índice de</text>
  <text x="28" y="346.5" font-size="14" font-weight="700" fill="#1c5cab">indeterminação</text>
  <text x="28" y="365.5" font-size="14" font-weight="700" fill="#1c5cab">do sujeito</text>
  <text x="208" y="336.9" font-size="13.5" fill="#0b0b0b">termo com preposição (ou nenhum</text>
  <text x="208" y="355.9" font-size="13.5" fill="#0b0b0b">termo); verbo sempre no singular</text>
  <text x="464" y="337.0" font-size="14" fill="#0b0b0b">Precisa-<tspan font-weight="700" fill="#1c5cab">se</tspan> de quórum.</text>
  <text x="464" y="356.0" font-size="14" fill="#0b0b0b">Trata-<tspan font-weight="700" fill="#1c5cab">se</tspan> de matéria urgente.</text>
  <rect x="16" y="387" width="728" height="41" rx="6" fill="#f3f2ee" stroke="#8c8a84" stroke-width="1.2"/>
  <line x1="196" y1="395" x2="196" y2="420" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="395" x2="452" y2="420" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="412.5" font-size="14" font-weight="700" fill="#3d3c39">Reflexivo</text>
  <text x="208" y="412.4" font-size="13.5" fill="#0b0b0b">cabe “a si mesmo”</text>
  <text x="464" y="412.5" font-size="14" fill="#0b0b0b">O deputado declarou-<tspan font-weight="700" fill="#3d3c39">se</tspan> impedido.</text>
  <rect x="16" y="434" width="728" height="41" rx="6" fill="#f3f2ee" stroke="#8c8a84" stroke-width="1.2"/>
  <line x1="196" y1="442" x2="196" y2="467" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="442" x2="452" y2="467" stroke="#8c8a84" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="459.5" font-size="14" font-weight="700" fill="#3d3c39">Recíproco</text>
  <text x="208" y="459.4" font-size="13.5" fill="#0b0b0b">cabe “um ao outro”</text>
  <text x="464" y="459.5" font-size="14" fill="#0b0b0b">Os líderes cumprimentaram-<tspan font-weight="700" fill="#3d3c39">se</tspan>.</text>
  <rect x="16" y="481" width="728" height="60" rx="6" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.2"/>
  <line x1="196" y1="489" x2="196" y2="533" stroke="#4a3aa7" stroke-width="0.8" stroke-opacity="0.6"/>
  <line x1="452" y1="489" x2="452" y2="533" stroke="#4a3aa7" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="28" y="506.5" font-size="14" font-weight="700" fill="#4a3aa7">Parte integrante</text>
  <text x="28" y="525.5" font-size="14" font-weight="700" fill="#4a3aa7">do verbo</text>
  <text x="208" y="506.4" font-size="13.5" fill="#0b0b0b">o verbo não se usa sem ele;</text>
  <text x="208" y="525.4" font-size="13.5" fill="#0b0b0b">“a si mesmo” não cabe</text>
  <text x="464" y="516.0" font-size="14" fill="#0b0b0b">O relator queixou-<tspan font-weight="700" fill="#4a3aa7">se</tspan> do prazo.</text>
</svg>
