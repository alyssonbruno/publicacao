<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>

  <!-- Pergunta inicial -->
  <rect x="170" y="14" width="420" height="68" rx="8" fill="#f3f2ee" stroke="#52514e" stroke-width="1.5"/>
  <text x="380" y="42" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">A palavra está perto do verbo.</text>
  <text x="380" y="66" font-size="14.5" fill="#0b0b0b" text-anchor="middle">Mude o gênero ou o número do sujeito.</text>

  <!-- Setas -->
  <path d="M300 82 L300 98 L194 98 L194 108" fill="none" stroke="#52514e" stroke-width="1.5"/>
  <path d="M188 108 L194 118 L200 108 Z" fill="#52514e"/>
  <path d="M460 82 L460 98 L566 98 L566 108" fill="none" stroke="#52514e" stroke-width="1.5"/>
  <path d="M560 108 L566 118 L572 108 Z" fill="#52514e"/>

  <!-- Adjetivo -->
  <rect x="16" y="120" width="356" height="250" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="194" y="146" font-size="13" fill="#52514e">A palavra acompanhou a mudança</text>
    <text x="194" y="174" font-size="19" font-weight="700" fill="#0e6b4b">Adjetivo</text>
    <text x="194" y="195" font-size="13.5" fill="#0b0b0b">com função de predicativo</text>
  </g>
  <g font-size="14.5" fill="#0b0b0b">
    <text x="36" y="232">O deputado chegou <tspan font-weight="700" fill="#0e6b4b">apressado</tspan>.</text>
    <text x="36" y="254">→ As deputadas chegaram <tspan font-weight="700" fill="#0e6b4b">apressadas</tspan>.</text>
    <text x="36" y="292">A passagem ficou <tspan font-weight="700" fill="#0e6b4b">cara</tspan>.</text>
    <text x="36" y="314">→ As passagens ficaram <tspan font-weight="700" fill="#0e6b4b">caras</tspan>.</text>
  </g>
  <text x="194" y="350" font-size="13" fill="#52514e" text-anchor="middle">Concorda com o sujeito: é adjetivo.</text>

  <!-- Advérbio -->
  <rect x="388" y="120" width="356" height="250" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="566" y="146" font-size="13" fill="#52514e">A palavra ficou igual</text>
    <text x="566" y="174" font-size="19" font-weight="700" fill="#1c5cab">Advérbio</text>
    <text x="566" y="195" font-size="13.5" fill="#0b0b0b">adjetivo adverbializado</text>
  </g>
  <g font-size="14.5" fill="#0b0b0b">
    <text x="408" y="232">O orador falou <tspan font-weight="700" fill="#1c5cab">claro</tspan>.</text>
    <text x="408" y="254">→ As oradoras falaram <tspan font-weight="700" fill="#1c5cab">claro</tspan>.</text>
    <text x="408" y="292">A passagem custou <tspan font-weight="700" fill="#1c5cab">caro</tspan>.</text>
    <text x="408" y="314">→ As passagens custaram <tspan font-weight="700" fill="#1c5cab">caro</tspan>.</text>
  </g>
  <text x="566" y="350" font-size="13" fill="#52514e" text-anchor="middle">Modifica o verbo e não varia: é advérbio.</text>

  <!-- Nota -->
  <rect x="16" y="388" width="728" height="66" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#0b0b0b">
    <text x="380" y="414" font-size="14.5">“<tspan font-weight="700" fill="#8a5a00">Calmo</tspan>, ele entrou” está correto: “calmo” é predicativo e concorda.</text>
    <text x="380" y="438" font-size="14">Com sujeito feminino: “<tspan font-weight="700" fill="#8a5a00">Calma</tspan>, ela entrou.”</text>
  </g>
</svg>
