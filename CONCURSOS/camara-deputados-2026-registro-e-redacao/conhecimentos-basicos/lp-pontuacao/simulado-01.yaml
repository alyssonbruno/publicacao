      > 3. segundo mandato, defendeu o texto com um argumento: sem
      > 4. catalogação, os registros antigos se perdem. Os deputados da
      > 5. comissão especial, que haviam examinado a matéria por três meses,
      > 6. acompanharam o voto da relatora. O líder da minoria — único orador
      > 7. inscrito para falar contra a proposta — criticou a “modernização”
      > 8. prometida pelo projeto, que, a seu ver, apenas reduz o quadro de
      > 9. pessoal, e perguntou quando o impacto orçamentário seria
      > 10. apresentado. Falaram ainda a presidente da comissão, autora do
