      Na linha 8, o modo subjuntivo em “permita”, empregado depois da conjunção “Embora”, não indica que o autor do texto considere duvidoso que o regimento admita novos adiamentos.
  - id: q07
    topico: conhecimentos-basicos/lp-tempos-e-modos-verbais
    enunciado: |-
      Texto para o item: trecho de um ato normativo fictício sobre a revisão de discursos, com as linhas numeradas.

      > **Texto II**
      >
      > 1. Art. 1º As notas taquigráficas registram integralmente os
      > 2. pronunciamentos feitos nas sessões e nas reuniões.
      > 3. Art. 2º O orador que desejar revisar o próprio discurso devolverá o
      > 4. texto ao órgão de registro no prazo de duas horas.
      > 5. § 1º Se o orador não devolver o texto no prazo, publicar-se-á a
      > 6. versão não revista, com a indicação dessa circunstância.
      > 7. § 2º Quando o revisor vir, no texto devolvido, alteração que mude o
      > 8. sentido do pronunciamento, consultará o orador antes da publicação.

      Com base no texto II e em seus aspectos linguísticos, julgue o item a seguir.

      A forma verbal “registram” (linha 1), no presente do indicativo, tem valor atemporal, próprio de texto normativo, e não se restringe ao momento em que o ato foi redigido.
