      >
      > 1. Na reunião de ontem, a comissão especial adiou pela terceira vez a
      > 2. votação do parecer. Segundo assessores, o relator estaria disposto a
      > 3. retirar do texto o artigo que provocara a obstrução. O relator lia o
      > 4. parecer quando a reunião foi suspensa por falta de quórum. Aprovada na
      > 5. comissão em março de 2019, a proposta original só seria votada em
      > 6. plenário oito meses depois e acabaria rejeitada. Caso o acordo se
      > 7. confirme e os líderes retirem os destaques, a votação ocorrerá na
      > 8. próxima terça-feira. Embora o regimento permita novos adiamentos, a
      > 9. presidente da comissão quer encerrar o debate antes do recesso.

      Com base no texto I e em seus aspectos linguísticos, julgue o item a seguir.

      A substituição da forma verbal “provocara” (linha 3) por havia provocado preservaria a correção gramatical e os sentidos do texto.
  - id: q03
    topico: conhecimentos-basicos/lp-tempos-e-modos-verbais
    enunciado: |-
      Texto para o item: notícia fictícia sobre a reunião de uma comissão, com as linhas numeradas.

      > **Texto I**
      >
      > 1. Na reunião de ontem, a comissão especial adiou pela terceira vez a
      > 2. votação do parecer. Segundo assessores, o relator estaria disposto a
      > 3. retirar do texto o artigo que provocara a obstrução. O relator lia o
      > 4. parecer quando a reunião foi suspensa por falta de quórum. Aprovada na
      > 5. comissão em março de 2019, a proposta original só seria votada em
      > 6. plenário oito meses depois e acabaria rejeitada. Caso o acordo se
      > 7. confirme e os líderes retirem os destaques, a votação ocorrerá na
      > 8. próxima terça-feira. Embora o regimento permita novos adiamentos, a
      > 9. presidente da comissão quer encerrar o debate antes do recesso.

      Com base no texto I e em seus aspectos linguísticos, julgue o item a seguir.

      No período “O relator lia o parecer quando a reunião foi suspensa por falta de quórum” (linhas 3 e 4), a substituição de “lia” por leu preservaria os sentidos do texto, uma vez que a noção de passado seria mantida.
