<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Linha do tempo do modo indicativo com o verbo votar</title>
  <rect width="760" height="460" fill="#ffffff"/>

  <!-- Caixas acima da linha -->
  <g text-anchor="middle">
    <g transform="translate(14 16)">
      <rect width="176" height="96" rx="8" fill="#ece9f8" stroke="#4a3aa7" stroke-width="1.5"/>
      <text x="88" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Mais-que-perfeito</text>
      <text x="88" y="46" font-size="16" font-weight="700" fill="#4a3aa7">votara</text>
      <text x="88" y="64" font-size="12.5" fill="#4a3aa7">= tinha votado</text>
      <text x="88" y="84" font-size="12" fill="#52514e">antes do fato de referência</text>
    </g>
    <g transform="translate(204 16)">
      <rect width="160" height="96" rx="8" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
      <text x="80" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Pretérito perfeito</text>
      <text x="80" y="48" font-size="16" font-weight="700" fill="#1c5cab">votou</text>
      <text x="80" y="70" font-size="12" fill="#52514e">fato concluído;</text>
      <text x="80" y="86" font-size="12" fill="#52514e">pode servir de referência</text>
    </g>
    <g transform="translate(390 16)">
      <rect width="160" height="96" rx="8" fill="#dff3ea" stroke="#12805a" stroke-width="1.5"/>
      <text x="80" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Presente</text>
      <text x="80" y="48" font-size="16" font-weight="700" fill="#0e6b4b">vota</text>
      <text x="80" y="70" font-size="12" fill="#52514e">agora, hábito,</text>
      <text x="80" y="86" font-size="12" fill="#52514e">verdade geral ou norma</text>
    </g>
    <g transform="translate(572 16)">
      <rect width="174" height="96" rx="8" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
      <text x="87" y="22" font-size="12.5" font-weight="700" fill="#0b0b0b">Futuro do presente</text>
      <text x="87" y="48" font-size="16" font-weight="700" fill="#8a5a00">votará</text>
      <text x="87" y="70" font-size="12" fill="#52514e">depois de agora;</text>
      <text x="87" y="86" font-size="12" fill="#52514e">também ordem, em normas</text>
    </g>
  </g>

  <!-- Ligações das caixas à linha -->
  <g stroke-width="1.5">
    <line x1="102" y1="112" x2="102" y2="160" stroke="#4a3aa7"/>
    <line x1="284" y1="112" x2="284" y2="160" stroke="#256abf"/>
    <line x1="470" y1="112" x2="470" y2="160" stroke="#12805a"/>
    <line x1="659" y1="112" x2="659" y2="160" stroke="#c98500"/>
  </g>

  <!-- Linha do tempo -->
  <line x1="24" y1="160" x2="726" y2="160" stroke="#0b0b0b" stroke-width="2"/>
  <path d="M726 153 L740 160 L726 167 Z" fill="#0b0b0b"/>
  <circle cx="102" cy="160" r="6" fill="#4a3aa7"/>
  <circle cx="284" cy="160" r="9" fill="#ffffff" stroke="#256abf" stroke-width="2.5"/>
  <circle cx="284" cy="160" r="4" fill="#256abf"/>
  <circle cx="470" cy="160" r="8" fill="#12805a"/>
  <circle cx="659" cy="160" r="6" fill="#c98500"/>
  <g font-size="12.5" fill="#52514e">
    <text x="24" y="184">passado</text>
    <text x="284" y="186" text-anchor="middle" font-weight="700" fill="#1c5cab">fato de referência</text>
    <text x="470" y="186" text-anchor="middle" font-weight="700" fill="#0e6b4b">agora</text>
    <text x="740" y="184" text-anchor="end">futuro</text>
  </g>

  <!-- Imperfeito: uma faixa no passado -->
  <rect x="130" y="204" width="300" height="22" rx="11" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
  <text x="280" y="220" font-size="13.5" font-weight="700" fill="#1c5cab" text-anchor="middle">votava</text>
  <text x="24" y="250" font-size="12.5" fill="#0b0b0b"><tspan font-weight="700">Pretérito imperfeito:</tspan> fato em curso, habitual ou pano de fundo de outro fato, sem fim marcado.</text>

  <!-- Futuro do pretérito: sai do fato de referência -->
  <line x1="284" y1="260" x2="284" y2="285" stroke="#8a8982" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="284" cy="290" r="5" fill="#b42727"/>
  <line x1="284" y1="290" x2="414" y2="290" stroke="#b42727" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M414 284 L426 290 L414 296 Z" fill="#b42727"/>
  <text x="438" y="295" font-size="13.5" font-weight="700" fill="#b42727">votaria</text>
  <text x="24" y="322" font-size="12.5" fill="#0b0b0b"><tspan font-weight="700">Futuro do pretérito:</tspan> o que viria depois do fato passado; também hipótese, polidez e distância do autor.</text>

  <!-- Frases de exemplo -->
  <g transform="translate(12 344)">
    <rect width="736" height="102" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <text font-size="13.5" fill="#0b0b0b">
      <tspan x="18" y="28">Quando a presidente <tspan font-weight="700" fill="#1c5cab">encerrou</tspan> a votação, o relator já <tspan font-weight="700" fill="#4a3aa7">votara</tspan>.<tspan fill="#52514e">  O voto veio antes do encerramento.</tspan></tspan>
      <tspan x="18" dy="27">O líder <tspan font-weight="700" fill="#1c5cab">anunciou</tspan> que a bancada <tspan font-weight="700" fill="#b42727">votaria</tspan> contra.<tspan fill="#52514e">  O voto viria depois do anúncio.</tspan></tspan>
      <tspan x="18" dy="27">O relator <tspan font-weight="700" fill="#1c5cab">lia</tspan> o parecer quando a sessão <tspan font-weight="700" fill="#1c5cab">foi suspensa</tspan>.<tspan fill="#52514e">  A leitura estava em curso.</tspan></tspan>
    </text>
  </g>
</svg>
