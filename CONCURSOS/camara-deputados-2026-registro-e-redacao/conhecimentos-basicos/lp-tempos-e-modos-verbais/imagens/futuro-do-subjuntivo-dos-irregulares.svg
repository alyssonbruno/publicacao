<svg xmlns="http://www.w3.org/2000/svg" width="880" height="538" viewBox="0 0 880 538" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Futuro do subjuntivo de verbos irregulares, em dois passos</title>
  <rect width="880" height="538" fill="#ffffff"/>
  <g font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">
    <text x="82" y="26">Verbo</text>
    <text x="82" y="44" font-weight="400" fill="#52514e">(infinitivo)</text>
    <text x="262" y="26">1. Pretérito perfeito</text>
    <text x="262" y="44" font-weight="400" fill="#52514e">“ontem eles…”</text>
    <text x="448" y="26">2. Tire o -am</text>
    <text x="448" y="44" font-weight="400" fill="#52514e">futuro do subjuntivo</text>
    <text x="540" y="26" text-anchor="start">Exemplo</text>
  </g>
  <line x1="12" y1="56" x2="868" y2="56" stroke="#0b0b0b" stroke-width="1.5"/>
  <g transform="translate(0 66)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">votar</text>
    <text x="262" y="23" fill="#0b0b0b">votar<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#f1f0ec" stroke="#8a8982" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#3b3a37">votar</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">quando o Plenário <tspan font-weight="700" fill="#3b3a37">votar</tspan> <tspan fill="#52514e" font-size="12">(igual ao infinitivo)</tspan></text>
  </g>
  <line x1="12" y1="102" x2="868" y2="102" stroke="#e1e0d9"/>
  <g transform="translate(0 104)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">ver</text>
    <text x="262" y="23" fill="#0b0b0b">vir<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">vir</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">quando o relator <tspan font-weight="700" fill="#8a5a00">vir</tspan> a emenda</text>
  </g>
  <line x1="12" y1="140" x2="868" y2="140" stroke="#e1e0d9"/>
  <g transform="translate(0 142)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">vir</text>
    <text x="262" y="23" fill="#0b0b0b">vier<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">vier</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">se a ministra <tspan font-weight="700" fill="#8a5a00">vier</tspan> à comissão</text>
  </g>
  <line x1="12" y1="178" x2="868" y2="178" stroke="#e1e0d9"/>
  <g transform="translate(0 180)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">manter</text>
    <text x="262" y="23" fill="#0b0b0b">mantiver<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">mantiver</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">se o Plenário <tspan font-weight="700" fill="#8a5a00">mantiver</tspan> o veto</text>
  </g>
  <line x1="12" y1="216" x2="868" y2="216" stroke="#e1e0d9"/>
  <g transform="translate(0 218)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">intervir</text>
    <text x="262" y="23" fill="#0b0b0b">intervier<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">intervier</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">se a Mesa <tspan font-weight="700" fill="#8a5a00">intervier</tspan> no debate</text>
  </g>
  <line x1="12" y1="254" x2="868" y2="254" stroke="#e1e0d9"/>
  <g transform="translate(0 256)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">prever</text>
    <text x="262" y="23" fill="#0b0b0b">previr<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">previr</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">se o regimento <tspan font-weight="700" fill="#8a5a00">previr</tspan> a hipótese</text>
  </g>
  <line x1="12" y1="292" x2="868" y2="292" stroke="#e1e0d9"/>
  <g transform="translate(0 294)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">propor</text>
    <text x="262" y="23" fill="#0b0b0b">propuser<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">propuser</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">se o autor <tspan font-weight="700" fill="#8a5a00">propuser</tspan> emenda</text>
  </g>
  <line x1="12" y1="330" x2="868" y2="330" stroke="#e1e0d9"/>
  <g transform="translate(0 332)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">dispor</text>
    <text x="262" y="23" fill="#0b0b0b">dispuser<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">dispuser</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">quando a lei <tspan font-weight="700" fill="#8a5a00">dispuser</tspan> sobre o tema</text>
  </g>
  <line x1="12" y1="368" x2="868" y2="368" stroke="#e1e0d9"/>
  <g transform="translate(0 370)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">obter</text>
    <text x="262" y="23" fill="#0b0b0b">obtiver<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">obtiver</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">se a proposta <tspan font-weight="700" fill="#8a5a00">obtiver</tspan> o quórum</text>
  </g>
  <line x1="12" y1="406" x2="868" y2="406" stroke="#e1e0d9"/>
  <g transform="translate(0 408)" font-size="15.5" text-anchor="middle">
    <rect x="22" y="2" width="120" height="30" rx="6" fill="#e3edf9" stroke="#256abf" stroke-width="1.5"/>
    <text x="82" y="23" font-weight="700" fill="#1c5cab">reaver</text>
    <text x="262" y="23" fill="#0b0b0b">reouver<tspan fill="#b42727" text-decoration="line-through">am</tspan></text>
    <path d="M340 17 L366 17" stroke="#52514e" stroke-width="1.5"/><path d="M366 12 L376 17 L366 22 Z" fill="#52514e"/>
    <rect x="384" y="2" width="128" height="30" rx="6" fill="#fdf1d6" stroke="#c98500" stroke-width="1.5"/>
    <text x="448" y="23" font-weight="700" fill="#8a5a00">reouver</text>
    <text x="540" y="22" font-size="14" text-anchor="start" fill="#0b0b0b">quando o órgão <tspan font-weight="700" fill="#8a5a00">reouver</tspan> os valores</text>
  </g>
  <g transform="translate(12 456)">
    <rect width="856" height="70" rx="10" fill="#fbeaea" stroke="#b42727" stroke-width="1.5"/>
    <text font-size="13.5" fill="#0b0b0b">
      <tspan x="18" y="28" font-weight="700" fill="#8f1d1d">Nos irregulares, o infinitivo depois de “se” e “quando” é erro:</tspan>
      <tspan x="18" dy="24">“se o Plenário <tspan font-weight="700">manter</tspan>”, “quando o relator <tspan font-weight="700">ver</tspan>”, “se a Mesa <tspan font-weight="700">intervir</tspan>”, “se o autor <tspan font-weight="700">propor</tspan>”.</tspan>
    </text>
  </g>
</svg>
