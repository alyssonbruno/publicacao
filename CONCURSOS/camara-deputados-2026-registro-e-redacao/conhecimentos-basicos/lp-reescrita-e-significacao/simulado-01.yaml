      No trecho “O relator afirmou que o projeto não cria despesa nova” (linha 6), a substituição de “afirmou” por alegou manteria a correção gramatical do texto, mas alteraria o sentido original.
  - id: q05
    topico: conhecimentos-basicos/lp-reescrita-e-significacao
    enunciado: |-
