      > 11. galerias se houvesse manifestações que infringissem o Regimento
      > 12. Interno da Câmara dos Deputados.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No trecho “A proposta emperrou na comissão de mérito” (linhas 2 e 3), a forma verbal “emperrou” poderia ser substituída por foi rejeitada, sem alteração do sentido original do texto.
