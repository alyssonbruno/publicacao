      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No trecho “que a princípio pretendia obstruir a votação” (linhas 4 e 5), a substituição de “a princípio” por em princípio preservaria o sentido original do texto.
  - id: q03
    topico: conhecimentos-basicos/lp-reescrita-e-significacao
    enunciado: |-
