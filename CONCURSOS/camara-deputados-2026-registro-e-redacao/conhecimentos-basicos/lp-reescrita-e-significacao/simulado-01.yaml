      > 2. programa de transporte escolar rural. A proposta emperrou na
      > 3. comissão de mérito no ano passado e só chegou à pauta depois de
      > 4. aprovado um requerimento de urgência. A bancada da Minoria, que
      > 5. a princípio pretendia obstruir a votação, acabou por apoiar o
