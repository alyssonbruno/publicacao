<svg xmlns="http://www.w3.org/2000/svg" width="912" height="470" viewBox="0 0 912 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="912" height="470" fill="#ffffff"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#0b0b0b">Quatro perguntas antes de aceitar um sinônimo</text>
  <text x="24" y="62" font-size="14" fill="#52514e">“X poderia ser substituído por Y, sem alteração de sentido”</text>
  <g transform="translate(24 84)">
    <rect width="426" height="146" rx="10" fill="#e3edf9" stroke="#b8cfee"/>
    <circle cx="30" cy="32" r="15" fill="#1c5cab"/><text x="30" y="38" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="54" y="38" font-size="17" font-weight="700" fill="#1c5cab">A precisão é a mesma?</text>
    <text x="16" y="72" font-size="16" font-weight="700" fill="#0b0b0b">furto × roubo</text>
    <text x="16" y="95" font-size="16" font-weight="700" fill="#0b0b0b">sessão (do Plenário) × reunião (de comissão)</text>
    <text x="16" y="130" font-size="13" fill="#52514e">termo técnico não se troca por palavra comum</text>
  </g>
  <g transform="translate(462 84)">
    <rect width="426" height="146" rx="10" fill="#e2f5ec" stroke="#a9dcc5"/>
    <circle cx="30" cy="32" r="15" fill="#12784f"/><text x="30" y="38" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="54" y="38" font-size="17" font-weight="700" fill="#12784f">O alcance é o mesmo?</text>
    <text x="16" y="72" font-size="16" font-weight="700" fill="#0b0b0b">deputados × parlamentares</text>
    <text x="16" y="130" font-size="13" fill="#52514e">“parlamentares” inclui os senadores</text>
  </g>
  <g transform="translate(24 244)">
    <rect width="426" height="146" rx="10" fill="#fdf1d6" stroke="#f0d28a"/>
    <circle cx="30" cy="32" r="15" fill="#8a5d00"/><text x="30" y="38" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="54" y="38" font-size="17" font-weight="700" fill="#8a5d00">A intensidade é a mesma?</text>
    <text x="16" y="72" font-size="16" font-weight="700" fill="#0b0b0b">pedir × exigir</text>
    <text x="16" y="95" font-size="16" font-weight="700" fill="#0b0b0b">criticar × atacar</text>
    <text x="16" y="130" font-size="13" fill="#52514e">a palavra nova pode dizer mais, ou menos</text>
  </g>
  <g transform="translate(462 244)">
    <rect width="426" height="146" rx="10" fill="#fde8df" stroke="#f3bfa8"/>
    <circle cx="30" cy="32" r="15" fill="#b3411a"/><text x="30" y="38" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="54" y="38" font-size="17" font-weight="700" fill="#b3411a">A avaliação é a mesma?</text>
    <text x="16" y="72" font-size="16" font-weight="700" fill="#0b0b0b">sucinto × superficial</text>
    <text x="16" y="95" font-size="16" font-weight="700" fill="#0b0b0b">afirmou × alegou × admitiu</text>
    <text x="16" y="130" font-size="13" fill="#52514e">há palavras neutras e palavras que julgam</text>
  </g>
  <text x="24" y="432" font-size="15" fill="#0b0b0b">Quatro respostas <tspan font-weight="700">“sim”</tspan>: o sentido se mantém. Um <tspan font-weight="700">“não”</tspan> basta para o sentido mudar.</text>
</svg>
