<svg xmlns="http://www.w3.org/2000/svg" width="760" height="376" viewBox="0 0 760 376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="760" height="376" fill="#ffffff"/>
  <text x="16" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Os quatro porquês: troque e veja qual cabe</text>

  <g transform="translate(12 52)">
    <rect width="736" height="312" rx="10" fill="#fcfcfb" stroke="#e1e0d9"/>
    <!-- cabeçalho -->
    <g font-size="13" font-weight="700" fill="#52514e">
      <text x="16" y="26">Forma</text>
      <text x="136" y="26">Quando · teste</text>
      <text x="420" y="26">Exemplo</text>
    </g>
    <g stroke="#e1e0d9">
      <line x1="12" y1="40" x2="724" y2="40"/>
      <line x1="12" y1="108" x2="724" y2="108"/>
      <line x1="12" y1="176" x2="724" y2="176"/>
      <line x1="12" y1="244" x2="724" y2="244"/>
    </g>

    <!-- por que -->
    <text x="16" y="72" font-size="18" font-weight="700" fill="#1c5cab">por que</text>
    <text x="136" y="66" font-size="13" fill="#0b0b0b">pergunta direta ou indireta; relativo</text>
    <text x="136" y="88" font-size="13" fill="#52514e">troque por: por qual razão; pelo qual</text>
    <text x="420" y="66" font-size="14" fill="#0b0b0b">Explicou <tspan font-weight="700">por que</tspan> mudou o voto.</text>
    <text x="420" y="88" font-size="14" fill="#0b0b0b">As razões <tspan font-weight="700">por que</tspan> votou contra.</text>

    <!-- por quê -->
    <text x="16" y="140" font-size="18" font-weight="700" fill="#1c5cab">por quê</text>
    <text x="136" y="134" font-size="13" fill="#0b0b0b">no fim da frase ou antes de pausa forte</text>
    <text x="136" y="156" font-size="13" fill="#52514e">troque por: por qual razão</text>
    <text x="420" y="134" font-size="14" fill="#0b0b0b">A pauta mudou, e ninguém disse</text>
    <text x="420" y="156" font-size="14" fill="#0b0b0b"><tspan font-weight="700">por quê</tspan>.</text>

    <!-- porque -->
    <text x="16" y="208" font-size="18" font-weight="700" fill="#127a55">porque</text>
    <text x="136" y="202" font-size="13" fill="#0b0b0b">causa ou explicação (conjunção)</text>
    <text x="136" y="224" font-size="13" fill="#52514e">troque por: pois; uma vez que</text>
    <text x="420" y="202" font-size="14" fill="#0b0b0b">A sessão caiu <tspan font-weight="700">porque</tspan> faltou</text>
    <text x="420" y="224" font-size="14" fill="#0b0b0b">quórum.</text>

    <!-- porquê -->
    <text x="16" y="276" font-size="18" font-weight="700" fill="#127a55">porquê</text>
    <text x="136" y="270" font-size="13" fill="#0b0b0b">substantivo: vem com artigo e tem plural</text>
    <text x="136" y="292" font-size="13" fill="#52514e">troque por: o motivo; a razão</text>
    <text x="420" y="270" font-size="14" fill="#0b0b0b">Ninguém entendeu <tspan font-weight="700">o porquê</tspan> do</text>
    <text x="420" y="292" font-size="14" fill="#0b0b0b">adiamento. Eram muitos <tspan font-weight="700">porquês</tspan>.</text>
  </g>
</svg>
