materiais:
  - tipo: texto
    titulo: Domínio da ortografia
    arquivo: texto.md
  - tipo: resumo
    titulo: Resumo em uma página
    arquivo: resumo.md
  - tipo: video
    titulo: "ORTOGRAFIA: Emprego das Letras [S, Z, X, CH, G, J, SS e Ç]"
    url: https://www.youtube.com/watch?v=q1xcO60HUBc
    autor: Português para Concursos - com Diego Pureza
    duracao_min: 29
    descricao: >-
      Indicado pela descrição e pelos capítulos, sem conferência do conteúdo. Passa por s com som
      de z (1:27), z (8:00), x e ch (11:31), g e j (14:34), ss, s e ç (17:15) e resolve questões
      de concurso a partir de 20:09. Complementa a parte de letras da aula, que tem pouca regra e
      muita memória: anote as palavras novas que aparecerem.
  - tipo: video
    titulo: ACENTUAÇÃO GRÁFICA - Regras Gerais (parte I)
    url: https://www.youtube.com/watch?v=Jsl1orr_k5w
    autor: Português para Concursos - com Diego Pureza
    duracao_min: 24
    descricao: >-
      Indicado pela descrição e pelos capítulos, sem conferência do conteúdo. Proparoxítonas e
      como o Cebraspe cobra (5:17), paroxítonas terminadas em ditongo (8:31), questões (9:27),
      paroxítonas que perderam o acento (11:47), oxítonas e ter e vir no plural (13:30) e
      monossílabos (14:35). Veja junto com a parte II.
  - tipo: video
    titulo: ACENTUAÇÃO GRÁFICA - Regras Específicas (parte II)
    url: https://www.youtube.com/watch?v=sbSTBZ16voM
    autor: Português para Concursos - com Diego Pureza
    duracao_min: 13
    descricao: >-
      Indicado pela descrição e pelos capítulos, sem conferência do conteúdo. Ditongos abertos e
      por que "ideia" perdeu o acento (1:13), hiatos com i e u e as exceções (4:08), pode e pôde
      (8:43), uma pegadinha do Cebraspe (9:47) e ter e vir no plural (11:01). Com a parte I,
      cobre a acentuação em 37 minutos.
  - tipo: video
    titulo: "Aula 5: Emprego do hífen (novas regras)"
    url: https://www.youtube.com/watch?v=I0N3EvDBLmU
    autor: GramáticaEmVídeo - Prof. Fábio Alves
    duracao_min: 17
    descricao: >-
      Indicado pela descrição e pelos capítulos, sem conferência do conteúdo. Hífen com
      prefixos: regra geral (3:05), letras iguais (4:37), casos em que sempre há hífen (5:48),
      circum- (7:09) e super-, hiper- e inter- (8:29). Não é voltado ao Cebraspe e, pelos
      capítulos, não trata de compostos, de locuções nem das decisões da ABL (co-, re-, não):
      para esses pontos, fique com o texto da aula.
  - tipo: video
    titulo: Uso dos "PORQUÊS" (porque, por que, porquê e por quê)
    url: https://www.youtube.com/watch?v=0sOpEWfVB34
    autor: Português para Concursos - com Diego Pureza
    duracao_min: 14
    descricao: >-
      Indicado pela descrição e pelos capítulos, sem conferência do conteúdo. Segundo a
      descrição, deixa de lado o atalho "separado na pergunta, junto na resposta" e ensina a
      troca por "o motivo", "pelo qual" e "pois", o mesmo teste da aula. Tabela-resumo em 8:50 e
      questões a partir de 9:31.
  - tipo: podcast
    titulo: "NOVO ACORDO ORTOGRÁFICO: as principais mudanças!"
    url: https://podcasts.apple.com/br/podcast/novo-acordo-ortogr%C3%A1fico-as-principais-mudan%C3%A7as/id1534371896?i=1000550828029
    autor: Português com Letícia
    duracao_min: 23
    descricao: >-
      Indicado pela descrição, sem conferência do conteúdo: as principais mudanças de
      acentuação e de hífen trazidas pelo Acordo. Parece o áudio de uma videoaula, e regra de
      grafia sem lousa exige atenção: ouça depois de ler o texto, como revisão.
  - tipo: podcast
    titulo: Quando usar cada 'porquê'?
    url: https://podcasts.apple.com/br/podcast/quando-usar-cada-porqu%C3%AA/id1227867522?i=1000725773903
    autor: Pasquale Cipro Neto (A Nossa Língua de Todo Dia, rádio CBN)
    duracao_min: 15
    descricao: >-
      Indicado pela descrição, sem conferência do conteúdo: o professor responde à dúvida de um
      ouvinte sobre os porquês, com canções como exemplo. Não é voltado a concursos, e o volume
      do áudio é baixo: pode ser preciso aumentar o som.
  - tipo: link
    titulo: Hífen — Manual de Comunicação da Secom do Senado
    url: https://www12.senado.leg.br/manualdecomunicacao/estilos/hifen
    autor: Senado Federal, Secretaria de Comunicação Social
    descricao: >-
      O melhor texto oficial de apoio sobre o hífen, com exemplos tirados de notícias do
      Legislativo: prefixos, co- e re-, não, bem e mal, compostos, locuções e cargos como
      primeiro-secretário e diretor-geral. Duas ressalvas: o manual vale para a comunicação do
      Senado, e lista subumano como segunda grafia de sub-humano, que o VOLP não registra.
