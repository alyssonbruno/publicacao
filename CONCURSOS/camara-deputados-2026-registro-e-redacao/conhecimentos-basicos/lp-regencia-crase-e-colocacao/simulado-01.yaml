      > 10. protesto em ata.

      Com base no texto e em seus aspectos linguísticos, julgue o item.

      A correção gramatical do texto seria mantida caso se empregasse o sinal indicativo de crase no vocábulo “a” em “fez alusão a sua proposta de 2019” (linhas 3 e 4).
  - id: q05
    topico: conhecimentos-basicos/lp-regencia-crase-e-colocacao
