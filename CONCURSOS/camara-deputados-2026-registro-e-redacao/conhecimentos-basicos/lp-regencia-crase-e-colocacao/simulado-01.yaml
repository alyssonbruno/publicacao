      Com base no texto e em seus aspectos linguísticos, julgue o item.

      Caso fosse suprimido o vocábulo “todas” no trecho “a todas as lideranças” (linha 9), o emprego do sinal indicativo de crase passaria a ser obrigatório, devendo-se escrever às lideranças.
  - id: q09
    topico: conhecimentos-basicos/lp-regencia-crase-e-colocacao
    enunciado: |-
