      Com base no texto e em seus aspectos linguísticos, julgue o item.

      No trecho “determinou que se registrasse o protesto em ata” (linhas 9 e 10), a colocação do pronome “se” antes do verbo deve-se ao fato de a forma verbal “registrasse” estar flexionada no modo subjuntivo.
